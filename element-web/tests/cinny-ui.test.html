<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><title>cinny ui tests</title></head>
<body>
<!-- Fixture mirrors the live Cinny 4.12.6 settings dialog: a scroll container with
     sections; each section starts with a 12px/600 heading paragraph. -->
<div id="scroller">
  <div id="content">
    <div class="section">
      <p class="heading">Appearance</p>
      <div class="row" style="background:rgb(242,242,242);color:rgb(0,0,0)">System Theme</div>
      <div class="row" style="background:rgb(242,242,242);color:rgb(0,0,0)">Monochrome Mode</div>
    </div>
    <div class="section">
      <p class="heading">Date &amp; Time</p>
      <div class="row" style="background:rgb(242,242,242);color:rgb(0,0,0)">24-Hour Time Format</div>
    </div>
  </div>
</div>

<script src="../../noise/logic.js"></script>
<script src="../../noise/cinny-ui.js"></script>
<script>
const L = window.PlotinaNoiseLogic;
if (!L) throw new Error("PlotinaNoiseLogic is not defined (logic.js missing?)");
localStorage.removeItem(L.LEVEL_KEY);
const results = [];
function test(name, fn) {
  try { fn(); results.push("PASS " + name); }
  catch (e) { results.push("FAIL " + name + " :: " + (e && e.message ? e.message : e)); }
}
function ok(cond, msg) { if (!cond) throw new Error(msg || "expected truthy"); }
function eq(a, b, msg) { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg||"") + " expected " + JSON.stringify(b) + " got " + JSON.stringify(a)); }
/* Never pin the number here: the Cinny slider must start at whatever default
   logic.js declares. Changing DEFAULT_LEVEL in logic.js has to stay a
   one-file change. */
function DEF() { return L.DEFAULT_LEVEL; }

function inject() {
  if (!window.PlotinaNoiseCinny || typeof window.PlotinaNoiseCinny.inject !== "function") {
    throw new Error("PlotinaNoiseCinny.inject is missing (cinny-ui.js not loaded?)");
  }
  window.PlotinaNoiseCinny.inject();
  return document.getElementById("plotina-noise-cinny");
}

test("block is injected into the General tab", () => {
  const block = inject();
  ok(block, "block not found");
});

test("block sits right before the Appearance section", () => {
  const block = inject();
  const appearance = [...document.querySelectorAll("p")].find((p) => p.textContent.trim() === "Appearance");
  eq(block.nextElementSibling, appearance.parentElement, "block should precede the Appearance section");
});

test("slider starts at the default level", () => {
  const d = DEF();
  ok(Number.isInteger(d) && d >= 0 && d <= 100, "DEFAULT_LEVEL is not a usable level: " + JSON.stringify(d));
  const block = inject();
  const range = block.querySelector("input[type=range]");
  ok(range, "no range input");
  // With an empty store the slider must show the logic default, and the number
  // next to it must agree with the handle.
  eq(range.value, String(L.clampLevel(null)), "slider value should be the fallback level");
  eq(range.value, String(d), "slider value");
  eq(block.querySelector("[data-plotina-value]").textContent, String(d), "shown value");
  ok(Number(range.value) >= Number(range.min) && Number(range.value) <= Number(range.max),
     "default level outside the slider range");
});

test("changing the slider stores the level", () => {
  const block = inject();
  const range = block.querySelector("input[type=range]");
  range.value = "35";
  range.dispatchEvent(new Event("input"));
  eq(localStorage.getItem(L.LEVEL_KEY), "35", "localStorage");
  eq(block.querySelector("[data-plotina-value]").textContent, "35", "shown value");
  // Put the handle back where it started; 35 above is just an arbitrary probe,
  // not a level with any meaning.
  range.value = String(DEF());
  range.dispatchEvent(new Event("input"));
});

test("on a narrow screen the label wraps and the slider stays usable", () => {
  const scroller = document.getElementById("scroller");
  scroller.style.width = "320px";
  const block = inject();
  const range = block.querySelector("input[type=range]");
  const width = range.getBoundingClientRect().width;
  ok(width >= 90, "slider squeezed to " + Math.round(width) + "px");
  ok(block.scrollWidth <= block.clientWidth + 1,
     "block overflows: " + block.scrollWidth + " > " + block.clientWidth);
  const label = block.querySelector("span");
  ok(label.getBoundingClientRect().bottom <= range.getBoundingClientRect().top + 1,
     "label should sit on its own line above the slider");
  scroller.style.width = "";
});

test("changing the slider while a call runs retunes it", () => {
  const calls = [];
  window.__plotinaNoise = { setLevel: (v) => calls.push(v) };
  const block = inject();
  const range = block.querySelector("input[type=range]");
  range.value = "40";
  range.dispatchEvent(new Event("input"));
  eq(calls, [40], "running processor should get the new level");
  delete window.__plotinaNoise;
});

test("a missing wrapper does not break the slider", () => {
  delete window.__plotinaNoise;
  const block = inject();
  const range = block.querySelector("input[type=range]");
  range.value = "50";
  range.dispatchEvent(new Event("input"));
  eq(localStorage.getItem(L.LEVEL_KEY), "50", "level still stored");
});

test("injection is idempotent", () => {
  inject(); inject();
  eq(document.querySelectorAll("#plotina-noise-cinny").length, 1, "only one block");
});

test("no Appearance section means no injection", () => {
  document.getElementById("scroller").remove();
  window.PlotinaNoiseCinny.reset();
  eq(document.getElementById("plotina-noise-cinny"), null, "should not inject without an anchor");
});

const failed = results.filter((r) => r.startsWith("FAIL"));
document.title = failed.length ? "TESTS FAILED (" + failed.length + ")" : "TESTS OK";
document.body.insertAdjacentHTML("beforeend", "<pre id='out'>" + results.join("\n") + "\n" + document.title + "</pre>");
</script>
</body>
</html>
