[package]
name = "plotina_dfn"
version = "0.1.0"
edition = "2021"
publish = false
description = "JNI shim around DeepFilterNet3 (libDF) for the plotina.cc Element X Android build"
license = "AGPL-3.0-only"

[lib]
name = "plotina_dfn"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
ndarray = "0.15"
# libDF, the Rust half of DeepFilterNet. Two features matter:
#   `tract`         - pure-Rust ONNX runtime, so the shim cross-compiles for Android with rustup
#                     and cargo-ndk alone, no C++ toolchain and no prebuilt ORT .so;
#   `default-model` - `include_bytes!`s models/DeepFilterNet3_onnx.tar.gz (7,983,136 bytes) into
#                     the shared object, so the APK carries the model and never downloads one.
# `default-features = false` drops vorbis/flac, which are file-decoding only.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", tag = "v0.5.6", default-features = false, features = [
    "tract",
    "default-model",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Not "abort": a panic in the denoiser must not take the call, and the whole app process, with it.
# lib.rs catches unwinds at every JNI entry point.
panic = "unwind"
