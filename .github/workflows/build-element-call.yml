name: build-element-call

# Static build of our own Element Call at call.plotina.cc: upstream v0.26.1
# (see element-call/pins.env) with the noise/ wrapper injected into index.html.
#
# Default mode takes the upstream release tarball and verifies its SHA-256, so
# a run is a minute of downloads and no compiler. The `source` mode builds from
# the git tag with pnpm and exists for the day we have to carry a real patch.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "release: upstream tarball (default). source: pnpm build from the git tag."
        type: choice
        options: ["release", "source"]
        default: "release"
  push:
    tags: ["v*-plotina-call.*"]

permissions:
  contents: write

concurrency:
  group: build-element-call-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The DSN is public by design: it is embedded in every bundle we serve.
      # A repository variable can override it without touching this file.
      VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN || 'https://7b413746-284e-483f-95e7-1a426596b77b@sentry.plotina.cc/1' }}
      VITE_SENTRY_RELEASE: element-call@${{ github.ref_name }}
      SENTRY_CLI_VERSION: 2.42.2
      # Gives the build step the right to fetch sentry-cli. SENTRY_URL, ORG and
      # PROJECT are deliberately absent here: upstream's vite.config.ts enables
      # @sentry/vite-plugin when all four exist, and that plugin would upload
      # the maps a second time under VITE_APP_VERSION ("0.26.1") instead of the
      # release name below. They are set on the upload step only.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read pins
        id: pins
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          . element-call/pins.env
          {
            if [ -n "${REQUESTED_MODE:-}" ]; then
              mode="$REQUESTED_MODE"
            elif compgen -G "element-call/patches/*.patch" > /dev/null; then
              mode=source
            else
              mode=release
            fi
            echo "mode=$mode"
            echo "node=$NODE_VERSION"
            echo "pnpm=$PNPM_VERSION"
            echo "ec_tag=$EC_TAG"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      # Only the source mode needs a toolchain; the release tarball is prebuilt.
      - uses: pnpm/action-setup@v4
        if: steps.pins.outputs.mode == 'source'
        with:
          version: ${{ steps.pins.outputs.pnpm }}

      - uses: actions/setup-node@v4
        if: steps.pins.outputs.mode == 'source'
        with:
          node-version: ${{ steps.pins.outputs.node }}

      - name: Build the bundle
        run: |
          set -euo pipefail
          # Debug ids must be injected into the exact files we ship, so the
          # CLI is fetched before the build and handed to build.sh. Without a
          # token the build is unchanged: no ids, no upload.
          cli=()
          if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
            curl -fsSL -o /tmp/sentry-cli \
              "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
            chmod +x /tmp/sentry-cli
            cli=(--sentry-cli /tmp/sentry-cli)
          fi
          bash element-call/build.sh --mode "${{ steps.pins.outputs.mode }}" --out dist \
            --maps-out dist/sourcemaps ${cli[@]+"${cli[@]}"}

      - name: Upload source maps to GlitchTip
        if: ${{ env.SENTRY_AUTH_TOKEN != '' }}
        env:
          SENTRY_URL: https://sentry.plotina.cc
          SENTRY_ORG: plotina
          SENTRY_PROJECT: web-clients
        run: |
          set -euo pipefail
          if [ ! -d dist/sourcemaps ]; then
            echo "::notice::this build produced no source maps; nothing to upload"
            exit 0
          fi
          release="$(cat dist/sentry-release.txt)"
          echo "uploading symbols for $release"
          /tmp/sentry-cli releases new "$release"
          /tmp/sentry-cli sourcemaps upload --release "$release" \
            --url-prefix "~/assets" dist/sourcemaps/assets

      - name: Skip the source map upload
        if: ${{ env.SENTRY_AUTH_TOKEN == '' }}
        run: |
          echo "::notice::SENTRY_AUTH_TOKEN is not set: no debug ids and no symbol upload; the build still ships and reports errors."

      # build.sh already asserted the stage directory; this proves the tarball.
      - name: Unpack and verify the artifact
        run: |
          set -euo pipefail
          mkdir -p check
          tar -xzf dist/plotina-element-call.tar.gz -C check
          grep -q 'src="/noise/logic.js"' check/element-call-plotina/index.html
          grep -q 'src="/noise/boot.js"' check/element-call-plotina/index.html
          grep -q '"livekit_service_url"' check/element-call-plotina/config.json
          test -s check/element-call-plotina/LICENSE-AGPL-3.0
          test -s check/element-call-plotina/noise/vendor/dfn.esm.js
          test -s check/element-call-plotina/noise/dfn/v3/pkg/df_bg.wasm
          test -s check/element-call-plotina/noise/dfn/v3/models/DeepFilterNet3_onnx.tar.gz
          # The Sentry SDK must be in the bundle even though it is a no-op
          # without a DSN; "sentry.javascript" is the SDK name every envelope
          # carries. Source maps, by contrast, must not be served.
          grep -Rqs 'sentry.javascript' check/element-call-plotina/assets
          if find check/element-call-plotina -name '*.map' | grep -q .; then
            echo "source maps leaked into the artifact" >&2
            exit 1
          fi
          echo "--- index.html head ---"
          head -c 400 check/element-call-plotina/index.html; echo
          du -sh check/element-call-plotina

      - uses: actions/upload-artifact@v4
        with:
          name: plotina-element-call
          path: dist/plotina-element-call.tar.gz
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plotina-element-call
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/plotina-element-call.tar.gz
          generate_release_notes: true
          body: |
            Собственный Element Call для plotina.cc: upstream v0.26.1 плюс обёртка
            шумоподавления DeepFilterNet3 из `noise/`, вставленная в `index.html`.

            Это статика. Распаковать на edge в `/srv/element-call` и отдавать как
            SPA на `call.plotina.cc` — шаги в `element-call/README.md`.

            Проверить после деплоя: `https://call.plotina.cc/room` открывается как
            экран звонка, `window.__plotinaNoise.isSupported()` возвращает `true`,
            а в консоли есть строка `[plotina-noise]`.

            Исходники этой сборки — upstream-тег плюс этот репозиторий (AGPL-3.0).
