name: Build Plotina Mobile

# Builds Plotina's FluffyChat APK: upstream pinned in fluffychat/UPSTREAM_TAG,
# our patches from fluffychat/patches/, the DeepFilterNet3 plugin in
# fluffychat/plotina_dfn/ (Kotlin + Rust), and Firebase Cloud Messaging
# (upstream's own scripts/add-firebase-messaging.sh plus google-services.json
# from the GOOGLE_SERVICES_JSON secret).
#
# Triggered by tags of the form v*-plotina-mobile.<n> (and the dev form
# v<base>-plotina-mobile.<n>-dev.<m>), e.g. v2.11.3-plotina-mobile.28.
# The client-specific part keeps this workflow from firing for tags that
# release the other clients in this repository.
#
# Dev update channel: a tag v<base>-plotina-mobile.<N>-dev.<M> (e.g.
# v2.11.3-plotina-mobile.28-dev.1) builds an opt-in dev APK for the "Канал
# обновлений" setting (patch 0016). It is based on the *published* stable .N
# — "Check the dev base is published" refuses an unreleased or outdated base
# before building — carries the SAME versionCode as that stable (only the
# versionName becomes <base>-dev.<M>, via --build-name; equal versionCode is
# reinstallable over the stable: AOSP checkDowngrade rejects lower codes
# only), and is published to the fixed GitHub `dev-latest` release, whose
# assets the app's dev feed reads:
#
#   https://github.com/plotina-cc/clients/releases/download/dev-latest/update-mobile-dev.json
#
# A dev build compiles **android-arm64 only** — one Dart AOT platform, one
# `cargo ndk` target for the denoiser, one APK — because the dev loop is
# "fix, build, check on the owner's phone" and three ABIs cost most of a
# 28-minute job. Stable tags keep all three ABIs (arm64 + armv7 APKs, x86_64
# native libraries for emulators), so nothing is lost for users. The two lists
# live in fluffychat/scripts/abi-matrix.py, which the "Work out the ABI set"
# step prints, checks and hands to every step that needs them.
#
# Nothing dev goes to plotina.cc/dl or to a per-tag release, so the stable
# feed is untouched and users get back to it with the next stable .N+1.
# Publishing dev-latest assets is by pushing such a tag (on command); the
# release itself is created once by this workflow on the first dev run.
#
# Crash reports go to GlitchTip at sentry.plotina.cc through sentry_flutter.
# The DSN is the SENTRY_DSN repository variable (public by design, it is
# compiled into the APK) and the release is fluffy@<version>+<tag>; the
# mapping files and Dart symbols are uploaded to the same release.

on:
  workflow_dispatch:
  push:
    tags: ["v*-plotina-mobile.*"]

permissions:
  contents: write

concurrency:
  group: build-fluffychat-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: https://github.com/krille-chan/fluffychat
  PLUGIN_DIR: fluffychat/plotina_dfn
  APK_NAME: Plotina-Mobile.apk
  APK_NAME_ARMV7: Plotina-Mobile-armv7.apk
  # The in-app updater reads https://plotina.cc/dl/update-mobile.json; infra
  # mirrors that JSON and the arm64 APK from the GitHub release. We produce
  # both as release assets.
  MANIFEST_NAME: update-mobile.json
  UPDATE_APK_URL: https://plotina.cc/dl/Plotina-Mobile.apk
  # GlitchTip. The DSN is public by design and ends up inside libapp.so; an
  # empty value simply builds without reporting (Sentry stays a no-op).
  SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_URL: https://sentry.plotina.cc
  SENTRY_ORG: plotina
  SENTRY_PROJECT: web-clients
  SENTRY_CLI_VERSION: 2.42.2

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Test the patch and marker scripts
        # Seconds, and it covers the gate's own negative controls: a missing marker must fail, an
        # artifact that cannot be read must fail, an empty marker list must fail.
        run: scripts/tests/run-tests.sh

      - name: Pin upstream and apply patches
        working-directory: fluffychat
        run: |
          set -euo pipefail
          TAG="$(cat UPSTREAM_TAG)"
          echo "upstream: $UPSTREAM_REPO @ $TAG"
          git clone --depth 1 --branch "$TAG" "$UPSTREAM_REPO" upstream
          # One entry point for every patch in this repository: the whole fluffychat/patches/
          # directory, in LC_ALL=C order, checked against the tree the previous patches built,
          # refused on a short count, a .rej, or a patch with no marker header. This loop used to be
          # the only thing applying them, and it would have gone on being green if a patch stopped
          # landing in the APK.
          "$GITHUB_WORKSPACE/scripts/apply-patches.sh" "$PWD" "$PWD/upstream" \
            "$GITHUB_WORKSPACE/fluffychat-markers.txt"
          grep -q '^  plotina_dfn:' upstream/pubspec.yaml
          echo "plugin registered in upstream/pubspec.yaml"

      # The versionCode/dev-tag formula and the logo-asset copy are the parts of
      # the updater contract that a 30-minute build cannot otherwise prove, and
      # both are pure Python, so they gate the build instead of being tested only
      # on a laptop: fluffychat/tests/test_version_code.py pins that a
      # `-dev.<M>` tag compiles to the versionCode of its published stable base.
      - name: Run updater and versionCode tests
        run: python3 -m unittest discover -s fluffychat/tests -p 'test_*.py' -v

      - name: Apply Plotina launcher icons
        working-directory: fluffychat
        run: python3 scripts/apply-plotina-icons.py upstream

      - name: Apply Plotina in-app logo assets
        working-directory: fluffychat
        run: |
          set -euo pipefail
          python3 scripts/apply-plotina-app-assets.py upstream
          # Fail early, not after a 30-minute build, if the copy was a no-op.
          cmp -s plotina_assets/logo_mini.png upstream/assets/logo/mini/logo_mini.png
          cmp -s plotina_assets/logo_mono_mini.png upstream/assets/logo/mini/logo_mono_mini.png
          cmp -s plotina_assets/banner.png upstream/assets/logo/mini/banner.png
          echo "in-app logos swapped to Plotina"

      - name: Keep only English and Russian UI languages
        working-directory: fluffychat
        run: bash scripts/keep-en-ru-l10n.sh upstream

      # One name for the release, the Dart define and the symbol upload. The
      # pubspec version is what upstream calls 2.11.3+3574; the build number is
      # upstream's own and would repeat across our tags, so the tag is the dist.
      - name: Work out the Sentry release
        id: sentry
        working-directory: fluffychat/upstream
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: \([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml)"
          if [ -z "$VERSION" ]; then
            echo "::error::cannot read the version from pubspec.yaml"
            exit 1
          fi
          RELEASE="fluffy@${VERSION}+${GITHUB_REF_NAME}"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "sentry release: $RELEASE"

      # Android versionCode for the in-app updater. It comes from the release
      # tag (v2.11.3-plotina-mobile.23), not from GITHUB_RUN_NUMBER, so every
      # APK ever published is comparable: 2*1000000 + 11*10000 + 3*100 + 23 =
      # 2110323 is the build number we pass, and `--split-per-abi` makes the
      # APK itself carry abi*1000 + that (arm64 2112323, armv7 2111323). The
      # formula, the digit limits, the ABI digit and the monotonicity argument
      # are documented in fluffychat/scripts/version-code.py; a local
      # scripts/build-android.sh computes the same numbers.
      #
      # A dev tag v<base>-plotina-mobile.<N>-dev.<M> compiles to the *same*
      # numbers as the stable .N it is based on — that is the whole design
      # (same package, same key, equal versionCode reinstalls in place; the
      # next stable outranks it again). Only the versionName gains the
      # `-dev.<M>` suffix, which the app reads back as its devBuild.
      - name: Work out the Android versionCode
        id: versioncode
        working-directory: fluffychat/upstream
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: \([0-9][0-9.]*\)+.*/\1/p' pubspec.yaml)"
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9.]+)-plotina-mobile\.([0-9]+)(-dev\.([0-9]+))?$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            BUILD="${BASH_REMATCH[2]}"
            DEV="${BASH_REMATCH[4]}"
            if [ "$BASE" != "$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME is for $BASE but pubspec.yaml says $VERSION"
              exit 1
            fi
          else
            echo "::warning title=Not a release tag::ref $GITHUB_REF_NAME is not v<version>-plotina-mobile.<n>[-dev.<m>]; building build 0, which never offers an update over a released one."
            BUILD=0
            DEV=""
          fi
          if [ -n "$DEV" ]; then
            VERSION_NAME="${BASE}-dev.${DEV}"
          else
            VERSION_NAME="$VERSION"
          fi
          CODE="$(python3 ../scripts/version-code.py "$VERSION" "$BUILD")"
          ARM64_CODE="$(python3 ../scripts/version-code.py "$VERSION" "$BUILD" arm64-v8a)"
          ARMV7_CODE="$(python3 ../scripts/version-code.py "$VERSION" "$BUILD" armeabi-v7a)"
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$CODE"
            echo "arm64_version_code=$ARM64_CODE"
            echo "armv7_version_code=$ARMV7_CODE"
            echo "build=$BUILD"
            echo "dev=$DEV"
          } >> "$GITHUB_OUTPUT"
          echo "build number $CODE -> arm64 APK $ARM64_CODE, armv7 APK $ARMV7_CODE ($VERSION_NAME, build $BUILD${DEV:+, dev $DEV})"

      # The design rule: a dev build sits on the latest *published* stable,
      # never on a future unreleased one and never behind the current stable.
      # version-code.py --check-dev-base compares the tag's base against the
      # remote's published stable tags and fails the build with the reason.
      # Stable builds and local dispatches skip this.
      - name: Check the dev base is published
        if: steps.versioncode.outputs.dev != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/refs/tags" \
            -q '.[].ref' > /tmp/published-tags.txt
          python3 fluffychat/scripts/version-code.py \
            --check-dev-base "$GITHUB_REF_NAME" /tmp/published-tags.txt

      # Which Android ABIs this build compiles. A dev tag (-dev.<M>) is built
      # for the owner's one phone: Dart AOT for android-arm64 only, the Rust
      # denoiser for arm64-v8a only, one APK. A stable tag keeps the three ABIs
      # it always had (arm64 + armv7 APKs, x86_64 native libraries for
      # emulators). The lists live in fluffychat/scripts/abi-matrix.py and every
      # step below reads them from here, so the two builds cannot drift apart
      # half-way. Written to both $GITHUB_OUTPUT (for `with:` inputs) and
      # $GITHUB_ENV (for the shell steps).
      - name: Work out the ABI set
        id: abis
        run: |
          set -euo pipefail
          matrix="$(python3 fluffychat/scripts/abi-matrix.py \
            --dev-build "${{ steps.versioncode.outputs.dev }}")"
          printf '%s\n' "$matrix" | tee -a "$GITHUB_OUTPUT" | tee -a "$GITHUB_ENV" > /dev/null
          printf '%s\n' "$matrix"
          echo "::notice::ABI set: $(printf '%s\n' "$matrix" | tr '\n' ' ')"

      # runner.temp is not available in workflow-level env, so the path is
      # decided here and exported for the upload step.
      - name: Fetch sentry-cli
        if: ${{ env.SENTRY_DSN != '' }}
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/sentry-cli"
          curl -fsSL -o "$cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
          chmod +x "$cli"
          echo "SENTRY_CLI=$cli" >> "$GITHUB_ENV"
          "$cli" --version

      - name: Read Flutter version
        id: flutter_version
        working-directory: fluffychat/upstream
        run: |
          set -euo pipefail
          if [ ! -f .fvmrc ]; then
            echo "::error::upstream ${{ env.UPSTREAM_REPO }} has no .fvmrc; set the Flutter version by hand"
            exit 1
          fi
          VERSION="$(python3 -c 'import json; print(json.load(open(".fvmrc"))["flutter"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "flutter $VERSION"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.flutter_version.outputs.version }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Firebase Cloud Messaging. Upstream ships the switch as a script: it adds
      # fcm_shared_isolate (which pulls in firebase_core and firebase-messaging)
      # and uncomments the FCM code paths. google-services.json has to be in
      # place before Gradle configures the project, because
      # android/settings.gradle.kts only declares the com.google.gms.google-services
      # plugin when that file exists — otherwise the manifest's FcmPushService
      # has nothing to talk to and FCM silently stays off.
      - name: Enable Firebase Cloud Messaging
        working-directory: fluffychat/upstream
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set, so FCM cannot be enabled. Add the base64 of google-services.json as a repository secret."
            exit 1
          fi
          # The secret is base64; GitHub keeps no trailing newline, but strip any
          # whitespace that a paste may have introduced.
          printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '[:space:]' | base64 --decode \
            > android/app/google-services.json
          python3 - <<'PY'
          import json
          import sys

          path = "android/app/google-services.json"
          with open(path, "rb") as handle:
              raw = handle.read()
          if not raw.strip():
              sys.exit(f"{path} decoded to an empty file; the secret is not base64")
          config = json.loads(raw)
          project = config["project_info"]["project_id"]
          clients = [
              entry["client_info"]["android_client_info"]["package_name"]
              for entry in config.get("client", [])
          ]
          print(f"firebase project: {project}")
          print("clients:", *clients, sep="\n  ")
          expected = ["chat.fluffy.fluffychat", "io.element.android.x"]
          missing = [name for name in expected if name not in clients]
          if missing:
              sys.exit(f"{path} has no client for: {', '.join(missing)}")
          # The Firebase project still registers the upstream client. Gradle's
          # google-services plugin rejects a package name that is not in this
          # file, so point that client at the Plotina package for this build.
          target = "cc.plotina.mobile"
          chosen = next(
              (
                  entry
                  for entry in config.get("client", [])
                  if entry["client_info"]["android_client_info"]["package_name"]
                  in ("chat.fluffy.fluffychat", "cc.plotina.fluffychat")
              ),
              None,
          )
          if chosen is None:
              sys.exit(f"{path} has no Plotina Mobile client to map onto {target}")
          chosen["client_info"]["android_client_info"]["package_name"] = target
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(config, handle, indent=2)
              handle.write("\n")
          print(f"firebase client mapped to {target}")
          PY
          bash scripts/add-firebase-messaging.sh
          # The script is silent about whether it matched anything, so check the
          # markers it is supposed to remove.
          if grep -q '<GOOGLE_SERVICES>' lib/utils/background_push.dart; then
            echo "::error::background_push.dart still has //<GOOGLE_SERVICES> markers"
            exit 1
          fi
          grep -q '^  fcm_shared_isolate:' pubspec.yaml ||
            { echo "::error::fcm_shared_isolate is not in pubspec.yaml"; exit 1; }
          grep -qx 'package chat.fluffy.fluffychat' \
            android/app/src/main/kotlin/chat/fluffy/fluffychat/FcmPushService.kt ||
            { echo "::error::FcmPushService.kt is still commented out"; exit 1; }
          grep -q 'com.google.gms.google-services' android/settings.gradle.kts
          echo "FCM enabled: fcm_shared_isolate added, background_push.dart and FcmPushService.kt uncommented"

      # Only the targets this build compiles: a dev build installs one rust
      # target instead of three, which is most of the denoiser step's saving.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.abis.outputs.RUST_TARGETS }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fluffychat/plotina_dfn/rust -> target

      # cargo-binstall (behind install-action) runs `cargo metadata` in the
      # repository root, which has no Cargo.toml. Plain `cargo install` does not.
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch DeepFilterNet3 model
        run: fluffychat/scripts/fetch-model.sh

      # The denoiser is a Rust crate built with cargo-ndk once per ABI. The
      # target list comes from the ABI matrix: three targets on a stable tag,
      # arm64-v8a alone on a dev tag (measured: 8-10 minutes down to under 3).
      - name: Build native denoiser
        run: |
          set -euo pipefail
          echo "denoiser targets: $CARGO_NDK_TARGETS"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_SDK_ROOT/ANDROID_HOME is not set}}"
          NDK_DIR="$(ls -d "$SDK"/ndk/* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$NDK_DIR" ]; then
            # No NDK in the runner image: install the one Flutter itself asks
            # for, so Gradle does not have to download a second copy.
            NDK_VERSION="$(sed -n 's/.*ndkVersion: String = "\([^"]*\)".*/\1/p' \
              "${FLUTTER_ROOT:?}/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" | head -1)"
            NDK_VERSION="${NDK_VERSION:-28.2.13676358}"
            echo "no NDK found, installing $NDK_VERSION"
            SDKMANAGER="$(command -v sdkmanager || echo "$SDK/cmdline-tools/latest/bin/sdkmanager")"
            # `yes | …` alone trips `pipefail` via SIGPIPE when sdkmanager exits.
            (yes || true) | "$SDKMANAGER" --install "ndk;$NDK_VERSION" > /dev/null
            NDK_DIR="$SDK/ndk/$NDK_VERSION"
          fi
          echo "using NDK $NDK_DIR"
          # cargo-ndk only looks at the process environment: set it here as well
          # as for the later Gradle step.
          export ANDROID_NDK_HOME="$NDK_DIR"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          # cargo-ndk runs `cargo metadata` in the current directory before it
          # looks at `--manifest-path`, which fails in the repository root
          # (there is no Cargo.toml there). Run it from the crate itself.
          JNI_LIBS="$GITHUB_WORKSPACE/$PLUGIN_DIR/android/src/main/jniLibs"
          cd "$GITHUB_WORKSPACE/$PLUGIN_DIR/rust"
          # $CARGO_NDK_TARGETS is space separated ("arm64-v8a" or the three);
          # it is deliberately unquoted so cargo-ndk sees one flag per ABI.
          cargo ndk \
            $CARGO_NDK_TARGETS \
            -o "$JNI_LIBS" \
            build --release 2>&1 | tee /tmp/cargo-ndk.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # The job log needs a token to read; the step summary is visible
            # without one, so the failure reason goes there as well.
            tail -n 60 /tmp/cargo-ndk.log >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          ls -l "$JNI_LIBS"/*/libplotina_dfn.so
          # Both halves of the ABI matrix are checked on the output, not on the
          # intent: every compiled ABI has its library, and an ABI this build
          # must not compile has none (a stray armeabi-v7a lib would be packaged
          # into an arm64-only APK's sibling and make the saving a lie).
          for abi in $CARGO_NDK_TARGETS; do
            [ -f "$JNI_LIBS/$abi/libplotina_dfn.so" ] ||
              { echo "::error::the denoiser was not built for $abi"; exit 1; }
          done
          for abi in $MUST_NOT_BUILD_ABIS; do
            [ ! -e "$JNI_LIBS/$abi/libplotina_dfn.so" ] ||
              { echo "::error::a $abi denoiser was built, but this build must not compile $abi"; exit 1; }
          done
          echo "denoiser built for: $CARGO_NDK_TARGETS (must-not: ${MUST_NOT_BUILD_ABIS:-none})"

      # The APK is signed with our key only when the keystore is configured.
      # Without the secrets there is nothing to sign with — upstream's
      # build.gradle.kts points at a dummy.keystore that is not in the repo — so
      # fall back to a debug build, which installs but cannot update a release.
      - name: Configure signing
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          cd fluffychat/upstream/android
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning title=Debug build::ANDROID_KEYSTORE_BASE64 is not set, so this run produces a debug APK signed with the Android debug key. It installs, but it cannot update an installed Plotina build."
            echo "variant=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_B64" | base64 --decode > plotina-release.jks
          if [ -z "${STORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD is empty"
            exit 1
          fi
          {
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS:-plotina}"
            # Relative to android/app, where build.gradle.kts resolves it:
            # android/key.properties -> android/plotina-release.jks.
            echo "storeFile=../plotina-release.jks"
          } > key.properties
          echo "signed with alias ${KEY_ALIAS:-plotina}"
          echo "variant=release" >> "$GITHUB_OUTPUT"

      # The notification path is Dart, so it is checked on the host instead of on
      # a phone, and before the 30-minute Gradle build rather than by the owner.
      # patches/0025 cancels a room's notification when our own sync reports the
      # room read; the test ships inside the patch as test/plotina_*_test.dart,
      # so this runs the same code the APK is built from. The model asset the
      # asset bundle wants is already fetched by this point.
      - name: Run the Plotina Dart tests
        working-directory: fluffychat/upstream
        run: |
          set -euo pipefail
          flutter pub get
          flutter gen-l10n
          flutter test test/plotina_*_test.dart

      - name: Build APK
        working-directory: fluffychat/upstream
        env:
          SENTRY_RELEASE: ${{ steps.sentry.outputs.release }}
        run: |
          set -euo pipefail
          VARIANT="${{ steps.signing.outputs.variant }}"
          echo "building the $VARIANT variant for $DART_PLATFORMS"
          flutter pub get
          flutter gen-l10n
          # Per-ABI splits: the universal APK carries four sets of native
          # libraries and is roughly twice the size of the arm64 one, which is
          # what every phone from the last several years needs. x86_64 is left
          # to emulators and is not published.
          #
          # --target-platform comes from the ABI matrix and is the whole
          # difference between the two build types: a dev tag compiles
          # android-arm64 only (one Dart AOT, one set of native libraries, one
          # APK), a stable tag the three platforms it always had. Passing the
          # list explicitly in both cases keeps the stable build's input
          # identical to what Flutter's default was, so nothing moves for users.
          #
          # --split-debug-info keeps the Dart symbol files that make a release
          # stack trace readable; CI uploads them to GlitchTip with the release.
          # --obfuscate is deliberately not used: it would rename symbols in the
          # whole app for little gain, and FluffyChat is not shipped to an
          # untrusted store.
          #
          # A dev build overrides only the *name* (2.11.3-dev.1) so the app can
          # tell it is running one and compare devBuild numbers; the build
          # number stays the stable one. Stable tags keep pubspec's name.
          name_args=()
          if [ -n "${{ steps.versioncode.outputs.dev }}" ]; then
            name_args+=(--build-name "${{ steps.versioncode.outputs.version_name }}")
          fi
          flutter build apk --split-per-abi "--$VARIANT" \
            --target-platform "$DART_PLATFORMS" \
            --build-number "${{ steps.versioncode.outputs.version_code }}" \
            "${name_args[@]}" \
            --dart-define=SENTRY_DSN="${SENTRY_DSN:-}" \
            --dart-define=SENTRY_RELEASE="$SENTRY_RELEASE" \
            --dart-define=SENTRY_DIST="$GITHUB_RUN_NUMBER" \
            --split-debug-info=build/app/outputs/symbols
          # Copy the APKs this build publishes; $ABI_PAIRS is "<file> <abi>".
          set -- $ABI_PAIRS
          while [ "$#" -gt 0 ]; do
            apk_name="$1"
            abi="$2"
            shift 2
            built="build/app/outputs/flutter-apk/app-$abi-$VARIANT.apk"
            [ -f "$built" ] || { echo "::error::no $abi APK ($built)"; ls build/app/outputs/flutter-apk; exit 1; }
            cp "$built" "$GITHUB_WORKSPACE/$apk_name"
          done
          # And prove the other ABIs were not compiled at all: a leftover
          # armeabi-v7a or x86_64 split means the target-platform list did not
          # reach Gradle, which would quietly cost the whole point of this.
          for abi in $MUST_NOT_BUILD_ABIS; do
            stray="build/app/outputs/flutter-apk/app-$abi-$VARIANT.apk"
            [ ! -f "$stray" ] ||
              { echo "::error::this build must not compile $abi, but $stray exists"; exit 1; }
          done
          ls -lh $APK_FILES
          sha256sum $APK_FILES

      # The updater compares versionCode values, so a silently wrong one would
      # offer no update ever (or the same one forever). Every APK this build
      # publishes is read back and must carry the build number of the tag plus
      # the ABI digit Flutter's `--split-per-abi` writes into it (arm64 +2000,
      # armv7 +1000; predicted by fluffychat/scripts/version-code.py and proven
      # on the released .22 APKs, which report 2032/1032 for build 32). A dev
      # build is arm64-only, so there is one APK to check — and its number is
      # still the stable base's 2112323-style one, because `--split-per-abi`
      # stays on. What the arm64 APK really carries is exported for the manifest
      # step, so update-mobile.json can never publish a number that no installed
      # app can match.
      - name: Verify the APK versionCode
        id: apkcode
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_SDK_ROOT/ANDROID_HOME is not set}}"
          AAPT="$(ls -1 "$SDK"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1 || true)"
          AK="$(ls -1 "$SDK"/cmdline-tools/*/bin/apkanalyzer 2>/dev/null | sort -V | tail -1 || true)"
          read_version_code() {
            local apk="$1" found=""
            if [ -n "$AAPT" ]; then
              found="$("$AAPT" dump badging "$apk" 2>/dev/null |
                sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1 || true)"
            fi
            if [ -z "$found" ] && [ -n "$AK" ]; then
              # Newer build-tools drop the aapt1 binary; apkanalyzer prints the
              # binary manifest as XML.
              found="$("$AK" manifest print "$apk" 2>/dev/null |
                sed -n 's/.*android:versionCode="\([0-9]*\)".*/\1/p' | head -1 || true)"
            fi
            [ -n "$found" ] || { echo "::error::no versionCode found in $apk (and no aapt/apkanalyzer under $SDK)"; exit 1; }
            printf '%s' "$found"
          }
          expected_for_abi() {
            case "$1" in
              arm64-v8a) printf '%s' "${{ steps.versioncode.outputs.arm64_version_code }}" ;;
              armeabi-v7a) printf '%s' "${{ steps.versioncode.outputs.armv7_version_code }}" ;;
              *) echo "::error::no expected versionCode for ABI $1"; exit 1 ;;
            esac
          }
          set -- $ABI_PAIRS
          while [ "$#" -gt 0 ]; do
            apk="$1"
            abi="$2"
            shift 2
            found="$(read_version_code "$apk")"
            expected="$(expected_for_abi "$abi")"
            echo "$abi: $apk carries $found (expected $expected)"
            [ "$found" = "$expected" ] ||
              { echo "::error::$apk carries a different versionCode"; exit 1; }
          done
          # The manifest always describes the arm64 APK, which every build
          # publishes; read it once more so the step output is unambiguous.
          arm64_found="$(read_version_code "$APK_NAME")"
          {
            echo "arm64_version_code=$arm64_found"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::versionCode $arm64_found verified on $PUBLISHED_ABIS with $(basename "${AAPT:-$AK}")"

      - name: Gate — every applied patch is in the APK
        # The build is not allowed to be green about a patch that did not reach the APK. The marker
        # list comes from apply-patches.sh, i.e. from the files really applied in this job, so this
        # catches both shapes of the bug: a patch in patches/ that never applied, and a patch that
        # applied but whose string the Dart AOT compiler or the resource shrinker dropped. Every APK
        # this build publishes is checked — one on a dev tag (arm64: the markers live in
        # lib/arm64-v8a/libapp.so), two on a stable tag, which carry the same libapp.so.
        run: |
          set -euo pipefail
          for apk in $APK_FILES; do
            echo "-- $apk"
            scripts/check-markers.sh "$apk" fluffychat-markers.txt
          done

      # What the in-app updater fetches. Stable: https://plotina.cc/dl/
      # update-mobile.json (infra mirrors it from the per-tag release). Dev:
      # update-mobile-dev.json on the `dev-latest` GitHub release, with the
      # SAME versionCode as the stable base plus "devBuild": M and a
      # -dev.<M> versionName — the app's dev channel compares M because the
      # code is equal. sha256/size describe the arm64 APK, which is what the
      # app downloads; the versionCode is the one the arm64 APK really
      # carries (build number + Flutter's ABI digit), because that is the
      # number an installed app reads from its own PackageManager. 32-bit
      # devices get "download Plotina-Mobile-armv7.apk by hand" from the app.
      - name: Write the updater manifest
        run: |
          set -euo pipefail
          sha256="$(sha256sum "$APK_NAME" | cut -d' ' -f1)"
          size="$(stat -c%s "$APK_NAME")"
          apk_code="${{ steps.apkcode.outputs.arm64_version_code }}"
          predicted="${{ steps.versioncode.outputs.arm64_version_code }}"
          [ -n "$apk_code" ] || { echo "::error::no read-back versionCode from the APK check step"; exit 1; }
          [ "$apk_code" = "$predicted" ] || { echo "::error::read-back versionCode $apk_code != predicted $predicted"; exit 1; }
          package="$(sed -n 's/.*applicationId = "\([^"]*\)".*/\1/p' \
            fluffychat/upstream/android/app/build.gradle.kts)"
          [ -n "$package" ] || { echo "::error::no applicationId in build.gradle.kts"; exit 1; }
          DEV="${{ steps.versioncode.outputs.dev }}"
          if [ -n "$DEV" ]; then
            manifest_file="update-mobile-dev.json"
            apk_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dev-latest/$APK_NAME"
            notes="Plotina Mobile ${{ steps.versioncode.outputs.version_name }} (dev-сборка $DEV на основе ${{ steps.versioncode.outputs.build }}): тестовые изменения."
          else
            manifest_file="$MANIFEST_NAME"
            apk_url="$UPDATE_APK_URL"
            notes="Plotina Mobile ${{ steps.versioncode.outputs.version_name }} (сборка ${{ steps.versioncode.outputs.build }}): улучшения и исправления."
          fi
          export package sha256 size notes apk_url
          export VERSION_NAME="${{ steps.versioncode.outputs.version_name }}"
          export VERSION_CODE="$apk_code"
          export DEV_BUILD="$DEV"
          python3 - "$manifest_file" <<'PY'
          import json, os, sys

          manifest = {
              "client": "mobile",
              "package": os.environ["package"],
              "versionName": os.environ["VERSION_NAME"],
              "versionCode": int(os.environ["VERSION_CODE"]),
              "apkUrl": os.environ["apk_url"],
              "sha256": os.environ["sha256"],
              "size": int(os.environ["size"]),
              "notes": os.environ["notes"],
          }
          # Dev manifests carry the M of <base>-dev.<M>; the versionCode is
          # deliberately the stable one. Stable manifests never have the key.
          if os.environ.get("DEV_BUILD"):
              manifest["devBuild"] = int(os.environ["DEV_BUILD"])
          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump(manifest, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          echo "MANIFEST_FILE=$manifest_file" >> "$GITHUB_ENV"

      # Uploaded before the checks on purpose: if a check rejects the APK, the
      # artifact is still there to inspect instead of costing another 30 minutes.
      # Nothing is released until both checks pass.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Plotina-Mobile
          path: Plotina-Mobile*.apk
          if-no-files-found: error

      # The build falls back to the debug key when the keystore secrets are
      # missing (see "Configure signing"). Such an APK installs but cannot update
      # an installed Plotina build, so a release run must not ship it.
      - name: Verify APK signature
        env:
          VARIANT: ${{ steps.signing.outputs.variant }}
        run: |
          set -euo pipefail
          echo "build variant: $VARIANT"
          if [ "$VARIANT" != "release" ]; then
            echo "::error::expected the release variant signed with the Plotina key, got '$VARIANT'"
            exit 1
          fi
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:?ANDROID_SDK_ROOT/ANDROID_HOME is not set}}"
          APKSIGNER="$(ls -1 "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::no apksigner under $SDK/build-tools, cannot prove the APKs are signed"
            exit 1
          fi
          echo "using $APKSIGNER"
          previous_digest=""
          # $APK_FILES: one APK on a dev tag, two on a stable one.
          for apk in $APK_FILES; do
            # apksigner writes the verify summary to stdout only with --verbose and
            # has moved cert lines between streams across build-tools versions, so
            # keep both streams and do not depend on the exact wording.
            report="$("$APKSIGNER" verify --print-certs "$apk" 2>&1)" || {
              echo "$report"
              echo "::error::$apk does not verify"
              exit 1
            }
            echo "$report" | sed 's/^/  /'
            if echo "$report" | grep -qi 'certificate DN:.*CN=Android Debug'; then
              echo "::error::$apk is signed with the Android debug key, not the Plotina key"
              exit 1
            fi
            digest="$(echo "$report" | grep -i 'certificate SHA-256 digest' | head -1 |
              sed 's/.*digest:[[:space:]]*//' | tr -d '\r')"
            if [ -z "$digest" ]; then
              # apksigner exit 0 already proves a valid signature, and a release
              # variant only exists when the keystore secrets were present.
              echo "::warning title=Signature::apksigner printed no cert digest for $apk; relying on 'verify' plus the release variant"
            elif [ -n "$previous_digest" ] && [ "$digest" != "$previous_digest" ]; then
              echo "::error::the two APKs are signed with different keys"
              exit 1
            else
              previous_digest="$digest"
            fi
          done
          echo "$APK_FILES verify, and none is debug-signed"

      # A missing libplotina_dfn.so, model asset or Firebase class does not fail
      # the build on its own: the plugin or FCM just stays silent. Fail here.
      - name: Verify APK contents
        run: |
          set -euo pipefail
          # `unzip -l | grep -c com/google/firebase` counts zip *entry names*, and
          # R8 folds those classes into classes*.dex, so it is 0 even when FCM is
          # linked in. Kept as a recorded data point; the real check reads the dex
          # payload further down.
          for apk in $APK_FILES; do
            count="$(unzip -l "$apk" | grep -c 'com/google/firebase' || true)"
            echo "unzip -l $apk | grep -c 'com/google/firebase' -> ${count:-0}"
          done
          # $ABI_PAIRS is "<apk> <abi>" per published APK: one pair on a dev tag,
          # two on a stable one. Each APK must carry the denoiser for its own
          # ABI and no lib/ directory of any other ABI — on a dev tag that is
          # the "arm64-only" claim checked on the artifact itself.
          python3 - $ABI_PAIRS <<'PY'
          import sys
          import zipfile

          args = sys.argv[1:]
          pairs = list(zip(args[0::2], args[1::2]))
          failures = []

          for apk, abi in pairs:
              print(f"== {apk} ({abi})")
              with zipfile.ZipFile(apk) as archive:
                  names = archive.namelist()
                  sizes = {name: archive.getinfo(name).file_size for name in names}
                  dex_names = sorted(name for name in names if name.endswith(".dex"))
                  dex = b"".join(archive.read(name) for name in dex_names)
                  resources = (
                      archive.read("resources.arsc") if "resources.arsc" in names else b""
                  )
                  manifest = (
                      archive.read("AndroidManifest.xml")
                      if "AndroidManifest.xml" in names
                      else b""
                  )

              lib_dirs = sorted(
                  {
                      name.split("/")[1]
                      for name in names
                      if name.startswith("lib/") and name.count("/") >= 2
                  }
              )
              print(f"  lib/ ABIs in the APK: {lib_dirs} (expected exactly [{abi!r}])")
              if lib_dirs != [abi]:
                  failures.append(f"{apk}: carries lib/ for {lib_dirs}, expected [{abi}]")

              wanted = [
                  f"lib/{abi}/libplotina_dfn.so",
                  "assets/flutter_assets/packages/plotina_dfn/assets/DeepFilterNet3_onnx.tar.gz",
              ]
              missing = [name for name in wanted if name not in names]
              if missing:
                  print("missing from the APK:", *missing, sep="\n  ")
                  print("lib/ entries:", *sorted(n for n in names if n.startswith("lib/")), sep="\n  ")
                  print("model entries:", *sorted(n for n in names if "DeepFilterNet" in n), sep="\n  ")
                  failures.append(f"{apk}: missing {', '.join(missing)}")
              for name in wanted:
                  if name in sizes:
                      if sizes[name] == 0:
                          print(f"empty entry: {name}")
                          failures.append(f"{apk}: {name} is empty")
                      print(f"  {name}: {sizes[name]} bytes")

              # Firebase. R8 folds the classes into classes*.dex, so no zip entry
              # is ever called `com/google/firebase` and `unzip -l | grep -c` stays
              # at 0 even when FCM is linked in. Look inside the dex payload.
              entry_hits = len([name for name in names if "com/google/firebase" in name])
              firebase_hits = dex.count(b"com/google/firebase")
              print(f"  zip entries named com/google/firebase: {entry_hits} (expected 0: R8 dexes the classes)")
              print(f"  'com/google/firebase' in {', '.join(dex_names)}: {firebase_hits} occurrences")
              if firebase_hits == 0:
                  failures.append(f"{apk}: no com/google/firebase classes in the dex payload")

              # The google-services plugin turns google-services.json into string
              # resources, so the project id ends up in resources.arsc; Firebase
              # reads it back by name at runtime.
              needle = b"plotina-push"
              needle_utf16 = "plotina-push".encode("utf-16-le")
              arsc_hits = resources.count(needle) + resources.count(needle_utf16)
              dex_project_hits = dex.count(needle) + dex.count(needle_utf16)
              manifest_hits = manifest.count(needle) + manifest.count(needle_utf16)
              print(
                  "  'plotina-push' — resources.arsc: "
                  f"{arsc_hits}, dex: {dex_project_hits}, AndroidManifest.xml: {manifest_hits}"
              )
              if arsc_hits + dex_project_hits + manifest_hits == 0:
                  failures.append(
                      f"{apk}: project id plotina-push is nowhere in the APK "
                      "(google-services.json did not reach the build)"
                  )

              event = b"com.google.firebase.MESSAGING_EVENT"
              event_hits = manifest.count(event) + manifest.count(event.decode().encode("utf-16-le"))
              print(f"  MESSAGING_EVENT service in AndroidManifest.xml: {event_hits > 0}")

          if failures:
              print("FAILED:", *failures, sep="\n  ")
              sys.exit(1)
          print(f"{len(pairs)} APK(s) carry the denoiser for their own ABI, the model, firebase classes and the plotina-push project id")
          PY

      # Mapping files and Dart symbols for the release that the APKs report as.
      # Known blocker (2026-10-30): sentry.plotina.cc's relay forwards only the
      # ingest endpoints (/api/1/envelope); /api/0/* is answered with Caddy's
      # 403, and sentry-cli needs /api/0 for releases and debug files. Opening
      # that path is a separate task on the relay/Caddy side. Until then this
      # step warns and skips instead of failing a good build; once the relay
      # answers, the same commands run unchanged.
      - name: Upload mapping files and symbols to GlitchTip
        if: ${{ env.SENTRY_DSN != '' }}
        continue-on-error: true
        working-directory: fluffychat/upstream
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          RELEASE: ${{ steps.sentry.outputs.release }}
        run: |
          set -euo pipefail
          if [ -z "${SENTRY_AUTH_TOKEN:-}" ]; then
            echo "::warning title=No symbol upload::SENTRY_AUTH_TOKEN is not set; the release ships without symbols."
            exit 0
          fi
          code="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $SENTRY_AUTH_TOKEN" \
            "$SENTRY_URL/api/0/organizations/$SENTRY_ORG/")"
          if [ "$code" != "200" ]; then
            echo "::warning title=Symbol upload skipped::$SENTRY_URL/api/0 answered $code (the relay only exposes ingest today); $RELEASE ships without symbols."
            exit 0
          fi
          echo "uploading symbols for $RELEASE"
          "$SENTRY_CLI" releases new "$RELEASE"
          # Dart: the files --split-debug-info wrote, one per ABI.
          "$SENTRY_CLI" debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
            build/app/outputs/symbols
          # Java/Kotlin: R8 names in every stack trace from the APK.
          mapping="build/app/outputs/mapping/${{ steps.signing.outputs.variant }}/mapping.txt"
          if [ -f "$mapping" ]; then
            "$SENTRY_CLI" debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
              "$mapping"
          else
            echo "::warning title=No mapping.txt::no $mapping; Java frames stay obfuscated."
          fi
          # Native: the unstripped libraries, including libplotina_dfn.so.
          native="$(ls -d build/app/intermediates/merged_native_libs/*/merge*NativeLibs/out/lib 2>/dev/null | head -1 || true)"
          if [ -n "$native" ] && [ -d "$native" ]; then
            "$SENTRY_CLI" debug-files upload --org "$SENTRY_ORG" --project "$SENTRY_PROJECT" \
              "$native"
          else
            echo "::notice::no merged native libraries to upload"
          fi

      # Kept as an artifact as well: while the relay's /api/0 is closed these
      # files are the only way to symbolise a trace by hand (flutter symbolize).
      - name: Upload Dart symbols
        if: ${{ env.SENTRY_DSN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Plotina-Mobile-symbols
          path: fluffychat/upstream/build/app/outputs/symbols
          if-no-files-found: warn

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/') && steps.versioncode.outputs.dev == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          BODY="$RUNNER_TEMP/release-notes.md"
          cat > "$BODY" <<'EOF'
          Plotina Mobile for Android with DeepFilterNet3 noise suppression built in.

          - The sign-in screen already points at plotina.cc, so there is no server to type.
          - Push notifications go through FCM and our own push gateway (push.plotina.cc), no ntfy app needed.
          - Signed with the Plotina key: installs over our previous builds.
          - Two APKs: arm64-v8a (most phones) and armeabi-v7a (older devices).
          - Source: `https://github.com/plotina-cc/clients` at this tag plus upstream `krille-chan/fluffychat` at the tag in `fluffychat/UPSTREAM_TAG`. Full set and rebuild steps: `SOURCE.md` (AGPL-3.0-or-later upstream, AGPL-3.0 patch layer).
          EOF
          # Title is the human-facing product name plus the base version only:
          # the tag carries the upstream client name and release counter.
          BASE="${TAG#v}"
          BASE="${BASE%%-plotina-*}"
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --title "Plotina Mobile ${BASE}" --notes-file "$BODY"
          # A stable build publishes both APKs; $APK_FILES is the same pair the
          # build produced (it is only ever arm64-only on a dev tag, which never
          # reaches this step).
          gh release upload "$TAG" $APK_FILES "$MANIFEST_NAME" --clobber
          # The release is the deliverable, so prove every asset is on it.
          for asset in $APK_FILES "$MANIFEST_NAME"; do
            gh release view "$TAG" --json assets \
              -q ".assets[] | select(.name == \"$asset\") | \"\\(.name) \\(.size) bytes\"" \
              | grep -q . || { echo "::error::$asset is not attached to release $TAG"; exit 1; }
          done

      # Dev builds never open a per-tag release: they overwrite the assets of
      # the fixed `dev-latest` release, which is the dev feed the app reads
      # (update-mobile-dev.json + the arm64 APK it points at). A dev build is
      # arm64-only, so it uploads one APK and removes the armv7 asset an older
      # three-ABI dev build left there: a stale APK on the dev feed would be
      # downloaded by 32-bit testers as if it were the current build. The
      # first dev run creates the release as a prerelease so GitHub never
      # treats it as "latest"; after that every push of a *-dev.<M> tag
      # replaces its assets atomically enough for the updater, which verifies
      # sha256/size of whatever it downloads anyway. Stable tags and the
      # plotina.cc/dl mirror are untouched by this step.
      - name: Attach to dev-latest release
        if: startsWith(github.ref, 'refs/tags/') && steps.versioncode.outputs.dev != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dev_manifest="update-mobile-dev.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev-latest" > /dev/null 2>&1 ||
            gh release create dev-latest \
              --title "Plotina Mobile dev feed (opt-in)" \
              --prerelease \
              --notes "Assets for the in-app Dev update channel (Settings -> Канал обновлений). Overwritten by every v<base>-plotina-mobile.<N>-dev.<M> build; NOT a released version. update-mobile-dev.json is the manifest the app reads."
          gh release upload dev-latest \
            $APK_FILES "$dev_manifest" --clobber
          # Drop the armv7 APK an earlier three-ABI dev build published: this
          # feed now describes an arm64-only build.
          if gh release view dev-latest --json assets -q '.assets[].name' |
               grep -qx "$APK_NAME_ARMV7"; then
            gh release delete-asset dev-latest "$APK_NAME_ARMV7" -y
            echo "removed the stale $APK_NAME_ARMV7 from dev-latest"
          fi
          # The dev feed is the deliverable; prove every asset is on it,
          # and that the manifest really points at the asset on dev-latest.
          for asset in $APK_FILES "$dev_manifest"; do
            gh release view dev-latest --json assets \
              -q ".assets[] | select(.name == \"$asset\") | \"\\(.name) \\(.size) bytes\"" \
              | grep -q . || { echo "::error::$asset is not attached to release dev-latest"; exit 1; }
          done
          grep -q "\"apkUrl\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dev-latest/$APK_NAME\"" "$dev_manifest" ||
            { echo "::error::the dev manifest apkUrl does not point at dev-latest"; exit 1; }
          echo "dev feed published: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dev-latest/$dev_manifest"
