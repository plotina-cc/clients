# Builds Plotina's Element X Android APK: upstream element-x-android, with the call WebView pointed
# at our own Element Call (https://call.plotina.cc/room) by default, so a call opens there without
# anyone typing a URL into developer settings.
#
# The patch set lives in element-x/patches/ and is described in element-x/patches/README.md. It is
# applied by element-x/scripts/apply-patches.sh — one entry point, no list of patch names in this
# file — and after the build element-x/scripts/check-markers.sh proves that every applied patch is
# actually in the APK (a patch that reaches patches/ but not the artifact fails the run).
#
# It is also the app behind https://plotina.cc/app: patch 0005 registers that URL as a verified
# app link, because mobile.element.io's assetlinks.json lists Element's certificates and not the
# Plotina key this build is signed with, so element.io invitation links cannot reach it.
#
# And it is the push build: the `gplay` flavour is the only one that carries the Firebase push
# provider (`fdroid` has no Firebase at all), and patch 0007 points it at our gateway,
# https://push.plotina.cc/_matrix/push/v1/notify, instead of matrix.org's. Note the flavour name:
# there is no `play` flavour in element-x-android, it is `gplay`.
#
# Element X does not apply the com.google.gms.google-services Gradle plugin — upstream keeps that
# alias commented out in app/build.gradle.kts and hand-maintains the Firebase values in
# libraries/pushproviders/firebase/src/*/res/values/firebase.xml for Element's own project. This
# workflow therefore decodes the GOOGLE_SERVICES_JSON secret, drops it at app/google-services.json
# and lets element-x/scripts/firebase-resources.py write our project's values (plus the resource
# keep list that AGP 9.3's default resource shrinking needs) into app/src/gplay/res. That overlay
# outranks the library module, so the APK talks to the plotina-push project.
#
# Calls run in the WebView against our own Element Call deployment; nothing here compiles Rust,
# installs the NDK or publishes element-call-android. The native-call experiment was removed from
# the tree and survives only in git history.
#
# Nothing is built on golova; this workflow is the build machine. It needs no macOS runner: the
# Android target is all we ship (see element-x/README.md, "Limitations").
#
# Secrets, all optional - without them the job builds a debug APK signed with the debug key, which
# cannot replace an installed release:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore (base64 -w0 plotina.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias (plotina)
#   ANDROID_KEY_PASSWORD      key password
#
# One secret is not optional: GOOGLE_SERVICES_JSON, the base64 google-services.json of the
# plotina-push Firebase project (client io.element.android.x). Without it the `gplay` flavour would
# build an APK that installs, launches and never receives a notification, so the workflow fails
# instead. Push also needs the server side: Synapse records our gateway URL as the pusher, and
# sygnal on push.plotina.cc holds the Firebase service account for app_id im.vector.app.android
# (the value BuildConfig.PUSHER_APP_ID carries into the pusher registration).
name: Build Plotina X (Android)

on:
  push:
    tags:
      - "v*-plotina-x.*"
  pull_request:
    paths:
      - "element-x/**"
      - ".github/workflows/build-element-x.yml"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Plotina X upstream tag (empty = the pin in element-x/pins.env)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-element-x-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same heap upstream CI uses: R8 on the full app runs out of memory well before 4g. The metaspace
  # and Kotlin-daemon caps are upstream's too — on a 16 GB hosted runner the sum matters, and two
  # gplay runs were killed by the runner while packaging (see the monitor in the Assemble step).
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC -Dkotlin.daemon.jvm.options=-Xmx4g -Dorg.gradle.workers.max=2

jobs:
  # Cheap and first: if the patches no longer apply to the pinned tag, nothing below is worth the
  # machine time, and this is the check that upstream drift breaks.
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pins
        # $GITHUB_ENV takes KEY=VALUE lines only: a '#' line is rejected as "Invalid format",
        # which is how the first run of this workflow died in ten seconds.
        run: grep -Ev '^[[:space:]]*(#|$)' element-x/pins.env >> "$GITHUB_ENV"
      - name: Patches apply to the Plotina X pin
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          # `inputs` is empty on push, and a value written to GITHUB_ENV is not visible to the
          # `env` context of the same step: stay in the shell.
          tag="${UPSTREAM_TAG:-$ELEMENT_X_TAG}"
          echo "Plotina X: $tag"
          # LFS holds screenshot-test blobs worth hundreds of MB; the build never reads them.
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch "$tag" \
            https://github.com/element-hq/element-x-android "$RUNNER_TEMP/element-x"
          # One entry point for every patch. The script applies the whole directory in LC_ALL=C
          # order, checks each patch against the tree the previous ones built (a patch generated on
          # a patched tree legitimately fails --check against pristine), fails on a .rej or on a
          # shorter applied count than patches/ holds, and refuses a patch with no marker header.
          # Nothing here names a patch: a new file in element-x/patches/ is applied on the next run
          # without editing this workflow, and a patch that is *not* applied cannot pass silently —
          # which is how 0016 was missing from .32-dev.4 while the run was green. The patch
          # descriptions live in element-x/patches/README.md and in each patch's header.
          "$GITHUB_WORKSPACE/element-x/scripts/apply-patches.sh" "$RUNNER_TEMP/element-x" \
            "$RUNNER_TEMP/plotina-markers.txt"

  build:
    needs: patches
    # Pull requests get the patch check only: a full build is 20-40 minutes and needs no review.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Read pins
        run: |
          grep -Ev '^[[:space:]]*(#|$)' element-x/pins.env >> "$GITHUB_ENV"
          if [ -n "${UPSTREAM_TAG:-}" ]; then
            echo "ELEMENT_X_TAG=$UPSTREAM_TAG" >> "$GITHUB_ENV"
          fi
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}

      - name: Free disk space
        # The gplay release build writes four ABI splits plus a universal APK, and R8 keeps the
        # whole app in the intermediate tree while it does. Two runs died while packaging, with the
        # runner logging only "The runner has received a shutdown signal" — the hosted image ships
        # ~20 GB of toolchains this build never touches, so they go first. Nothing here removes a
        # JDK, the Android SDK or the Gradle caches.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/share/powershell /opt/microsoft 2>/dev/null || true
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h / | tail -1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the SDK packages Plotina X compiles against
        run: |
          # ubuntu-latest ships the Android SDK and upstream's own CI never installs anything, so
          # nothing here may fail just because a package is already present. Do not use
          # android-actions/setup-android@v3: it asks the repository for the `tools` package, which
          # no longer exists there, and the job dies before Gradle starts.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          # Gradle finds the SDK through ANDROID_HOME; make sure the later steps have it even if the
          # image stopped exporting it.
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # compileSdk/targetSdk 37 and build-tools 37.0.0 come from plugins/src/main/kotlin/Versions.kt
          # at the pinned tag. The image carries "platforms;android-37.0" (the API 37 minor-version
          # naming), the repository may not know a bare "platforms;android-37": that is not fatal,
          # AGP downloads the SDK packages it resolves to itself once the licences are accepted.
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" \
            || "$SDKMANAGER" --channel=3 --install "platforms;android-37" "build-tools;37.0.0" \
            || {
              echo "::warning::sdkmanager has no 'platforms;android-37'; leaving it to Gradle"
              "$SDKMANAGER" --list_installed || true
            }

      - uses: gradle/actions/setup-gradle@v4

      - name: Plotina X, patched
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch "$ELEMENT_X_TAG" \
            https://github.com/element-hq/element-x-android upstream/element-x
          # Every file in element-x/patches/, in order, through one script — see its header for what
          # it guarantees. The markers of what was applied land in plotina-markers.txt, and the
          # "Gate" step after the build looks for each one in the APK. What each patch does is in
          # element-x/patches/README.md and in the patch's own header.
          element-x/scripts/apply-patches.sh upstream/element-x \
            "$GITHUB_WORKSPACE/plotina-markers.txt"

      - name: Install Pillow for the icon script
        run: python3 -m pip install --quiet pillow

      - name: Apply Plotina launcher icons
        run: python3 element-x/scripts/apply-plotina-icons.py upstream/element-x

      - name: Write the Firebase project into the gplay flavour
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # FCM is the point of the gplay build, so a missing secret is a failure, not a warning: an
          # APK without a Firebase project installs, launches and silently never receives anything.
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is not set: the gplay flavour would ship without a Firebase project"
            exit 1
          fi
          # The secret is base64(google-services.json); accept a raw JSON payload as well so a
          # hand-run does not need the extra encoding step. Neither branch may print the value.
          if printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n' | base64 -d \
               > upstream/element-x/app/google-services.json 2>/dev/null \
             && python3 -c 'import json,sys; json.load(open(sys.argv[1]))' upstream/element-x/app/google-services.json 2>/dev/null; then
            echo "google-services.json decoded from base64"
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" > upstream/element-x/app/google-services.json
            python3 -c 'import json,sys; json.load(open(sys.argv[1]))' upstream/element-x/app/google-services.json
            echo "google-services.json taken as raw JSON"
          fi

          # No Google Services Gradle plugin here (see the header): the values become the string
          # resources Firebase actually reads, in an app-module overlay for the gplay flavour only,
          # plus the keep.xml that stops AGP 9.3's resource shrinker from deleting them.
          python3 "$GITHUB_WORKSPACE/element-x/scripts/firebase-resources.py" \
            upstream/element-x/app/google-services.json \
            upstream/element-x/app/src/gplay/res \
            cc.plotina.x
          find upstream/element-x/app/src/gplay/res -type f -print

      - name: Decode the signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plotina.keystore"
            {
              echo "PLOTINA_STOREFILE=$RUNNER_TEMP/plotina.keystore"
              echo "PLOTINA_STOREPASSWORD=$KEYSTORE_PASSWORD"
              echo "PLOTINA_KEY_ALIAS=$KEY_ALIAS"
              echo "PLOTINA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: building a debug APK, which cannot be installed over a release build"
          fi

      - name: Name the Sentry release
        # Sentry's Android SDK takes the release from manifest meta-data (io.sentry.release, added by
        # patch 0008), so it has to be stamped before Gradle runs. The tag is the only name that says
        # which APK a crash came from: element-x@26.10.1-plotina-x.14. A branch build has no tag and
        # gets the upstream pin plus the commit instead, which still separates one run from another.
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            release="element-x@${GITHUB_REF_NAME#v}"
          else
            release="element-x@${ELEMENT_X_TAG}-${GITHUB_SHA:0:7}"
          fi
          echo "PLOTINA_SENTRY_RELEASE=$release" >> "$GITHUB_ENV"
          echo "Sentry release: $release"

      - name: Work out the versionCode
        id: version
        # Plotina's formula, also documented in element-x/README.md and in patch 0014's
        # app/build.gradle.kts: the release tag `vYY.MM.p-plotina-x.N` maps to the base versionCode
        # (2000 + YY) * 100_000 + MM * 1_000 + N. Gradle receives N as -PplotinaBuildNumber; the
        # packaged APK additionally carries upstream's ABI digit (base * 10 + abiCode, arm64-v8a 2,
        # armeabi-v7a 1). update-x.json holds the arm64 APK's full number, read back from the built
        # file below; the in-app updater (patch 0014, PlotinaUpdate.baseCodeOf) drops the digit from
        # both sides before comparing, because each phone installs a different split. Every base
        # here is greater than the base of the pre-updater releases (upstream's 20261001), so the
        # installer takes them as upgrades.
        # The dev channel adds a suffix to the tag: `vYY.MM.p-plotina-x.N-dev.M` compiles the
        # *same* base code as stable N - the stable it is based on - and only versionName grows the
        # `-dev.M` part (Gradle -PplotinaDevBuild). Equal versionCode replacement is what AOSP
        # allows: PackageManager.checkDowngrade rejects lower codes, never equal ones (some OEM
        # skins are stricter - switching back to a stable then means the normal greater-code
        # upgrade, which is the designed path anyway). A dev tag is refused here unless the stable
        # tag with the same N is published: dev builds test what users actually run, never a
        # future or forgotten revision.
        # A run without a tag (workflow_dispatch) gets build number 0 and no dev part; its APK is
        # a `.debug` application id installed beside the releases, never over them, so the
        # collision that would otherwise cause does not exist.
        run: |
          version_name="${ELEMENT_X_TAG#v}"
          IFS='.' read -r yy mm pp <<< "$version_name"
          build_number=0
          dev_build=0
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            rest="${GITHUB_REF_NAME#*-plotina-x.}"
            case "$rest" in
              *-dev.*)
                build_number="${rest%-dev.*}"
                dev_build="${rest##*-dev.}"
                ;;
              *)
                build_number="$rest"
                ;;
            esac
            case "$build_number" in
              ''|*[!0-9]*) echo "::error::tag '$GITHUB_REF_NAME' is not v<YY.MM.p>-plotina-x.<N>[-dev.<M>]"; exit 1 ;;
            esac
            [ "$build_number" -le 999 ] || { echo "::error::build number $build_number does not fit 0..999"; exit 1; }
            case "$dev_build" in
              ''|*[!0-9]*) echo "::error::dev build number '$dev_build' is not numeric"; exit 1 ;;
            esac
            if [ "$dev_build" -gt 0 ]; then
              [ "$dev_build" -le 999 ] || { echo "::error::dev build number $dev_build does not fit 1..999"; exit 1; }
              version_name="${version_name}-dev.${dev_build}"
              # Refuse a dev build whose stable base is not published. Dots in the pattern are
              # regex any-chars, but the only refs in this namespace are these release tags, and
              # the digits are pinned exactly besides.
              if ! git ls-remote --exit-code --tags origin "refs/tags/v${ELEMENT_X_TAG#v}-plotina-x.${build_number}" >/dev/null 2>&1; then
                echo "::error::dev tag '$GITHUB_REF_NAME' is based on v${ELEMENT_X_TAG#v}-plotina-x.${build_number}, which is not published"
                exit 1
              fi
            fi
          fi
          base=$(( (2000 + yy) * 100000 + mm * 1000 + build_number ))
          echo "Plotina versionCode: base $base; arm64 APK $((base * 10 + 2)), armv7 APK $((base * 10 + 1)); dev build $dev_build"
          {
            echo "PLOTINA_BUILD_NUMBER=$build_number"
            echo "PLOTINA_DEV_BUILD=$dev_build"
            echo "PLOTINA_VERSION_NAME=$version_name"
            echo "PLOTINA_VERSION_CODE_BASE=$base"
          } >> "$GITHUB_ENV"
          echo "dev_build=$dev_build" >> "$GITHUB_OUTPUT"

      - name: Assemble
        working-directory: upstream/element-x
        env:
          # The app-side Sentry DSN. Upstream's services/analyticsproviders/sentry reads exactly this
          # variable at configuration time and puts it in BuildConfig.SENTRY_DSN; its own
          # SentryAnalyticsProvider initialises the SDK from it, so there is no init code of ours.
          # `vars`, not `secrets`: a DSN is a write-only ingest URL, and GlitchTip prints it in the
          # browser. Blank means the APK builds and never reports a crash, hence the check below.
          ELEMENT_ANDROID_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          # The Rust SDK's own Sentry client (matrix-rust-sdk tracing), same project. Its events
          # carry the SDK's release name (the app version), not element-x@<tag>: the Rust config has
          # no release field. ELEMENT_CALL_SENTRY_DSN is deliberately unset - see the README, the app
          # passes it to whatever call page it loads, including our own call.plotina.cc.
          ELEMENT_SDK_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          # A kill in this step only ever surfaces as "The runner has received a shutdown signal",
          # with no word on what ran out first. Sample the machine every minute: the last monitor
          # line in the log then says whether it was disk or memory.
          (
            while true; do
              echo "[monitor $(date -u +%H:%M:%S)] $(df -h / | awk 'NR==2 {print "disk free " $4 " of " $2}') | $(free -m | awk 'NR==2 {print "mem available " $7 "MB of " $2 "MB"}')"
              sleep 60
            done
          ) &
          monitor=$!
          # The DSN is compiled into BuildConfig, so this log line is the only place that says
          # whether the artifact can report anything at all. Never print the DSN itself.
          if [ -n "${ELEMENT_ANDROID_SENTRY_DSN:-}" ]; then
            echo "Sentry DSN: set (${#ELEMENT_ANDROID_SENTRY_DSN} chars)"
          else
            echo "::warning::ELEMENT_ANDROID_SENTRY_DSN is empty: this APK will not report crashes"
          fi
          # Per-ABI splits, not one universal APK: a single release APK with four ABIs is 400 MB,
          # while arm64 alone is what almost every phone needs. `-PplotinaSingleApk` exists in the
          # patch and turns the splits off, but it is not used here on purpose.
          #
          # 0002 also limits the splits to arm64-v8a and armeabi-v7a and turns the universal APK
          # off. That is not tidiness: `assembleGplayRelease` with four splits plus the universal
          # one died in `:app:packageGplayRelease` with OutOfMemoryError: Java heap space, with the
          # runner down to 1.5 GB of 16 GB free. Two outputs, both of which we publish, fit.
          #
          # `gplay`, not `play`: element-x-android's store flavours are `gplay` and `fdroid`, and
          # only `gplay` links the Firebase push provider (see the dependencies block of
          # app/build.gradle.kts: `gplayImplementation(projects.libraries.pushproviders.firebase)`).
          # Asking Gradle for `assemblePlayRelease` fails with "Task not found".
          # -PplotinaDevBuild=0 leaves versionName untouched (patch 0014); a dev tag carries M > 0
          # there and the APK's versionName becomes `26.10.1-dev.M` while the versionCode stays the
          # base of the stable it is based on.
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew -PplotinaBuildNumber="$PLOTINA_BUILD_NUMBER" -PplotinaDevBuild="$PLOTINA_DEV_BUILD" assembleGplayRelease --stacktrace --no-configuration-cache
            apk_dir=app/build/outputs/apk/gplay/release
          else
            ./gradlew -PplotinaBuildNumber="$PLOTINA_BUILD_NUMBER" -PplotinaDevBuild="$PLOTINA_DEV_BUILD" assembleGplayDebug --stacktrace --no-configuration-cache
            apk_dir=app/build/outputs/apk/gplay/debug
          fi
          ls -lh "$apk_dir"
          arm64=$(find "$apk_dir" -name '*arm64-v8a*.apk' | head -1)
          armv7=$(find "$apk_dir" -name '*armeabi-v7a*.apk' | head -1)
          [ -n "$arm64" ] || { echo "::error::no arm64-v8a APK in $apk_dir"; exit 1; }
          cp "$arm64" "$GITHUB_WORKSPACE/Plotina-X.apk"
          if [ -n "$armv7" ]; then cp "$armv7" "$GITHUB_WORKSPACE/Plotina-X-armv7.apk"; fi
          ls -lh "$GITHUB_WORKSPACE"/Plotina-X*.apk
          kill "$monitor" 2>/dev/null || true

      # Uploaded before the checks on purpose: a failing check must still leave the APK behind to
      # inspect, otherwise the only trace of a wrong artifact is a red step.
      - name: Check the versionCode and write update-x.json
        run: |
          cd "$GITHUB_WORKSPACE"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT=$(ls "$SDK"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          [ -n "$AAPT" ] || { echo "::error::no aapt in $SDK/build-tools: the versionCode cannot be verified"; exit 1; }
          # aapt reads what actually got packaged - not what Gradle was asked for. The base plus the
          # ABI digit from the androidComponents block: arm64-v8a 2, armeabi-v7a 1. If these values
          # drift, the in-app updater would offer installs the system refuses as downgrades.
          read_pkg_vc() {
            local line
            line=$("$AAPT" dump badging "$1" 2>/dev/null | head -1)
            PKG=$(printf '%s' "$line" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            VC=$(printf '%s' "$line" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
            VN=$(printf '%s' "$line" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          }
          read_pkg_vc Plotina-X.apk
          echo "Plotina-X.apk: package=$PKG versionCode=$VC versionName=$VN"
          [ "$VC" = "$(( PLOTINA_VERSION_CODE_BASE * 10 + 2 ))" ] \
            || { echo "::error::Plotina-X.apk versionCode $VC is not base $PLOTINA_VERSION_CODE_BASE * 10 + 2 (arm64)"; exit 1; }
          # The manifest must carry what the installed arm64 APK reports, ABI digit included.
          ARM64_VERSION_CODE="$VC"
          if [ "$PLOTINA_DEV_BUILD" != "0" ]; then
            # Proof the -PplotinaDevBuild property reached Gradle: the packaged versionName grew
            # the dev suffix. (The versionCode deliberately does NOT move - that is the design.)
            [ "$VN" = "$PLOTINA_VERSION_NAME" ] \
              || { echo "::error::Plotina-X.apk versionName $VN is not the dev name $PLOTINA_VERSION_NAME"; exit 1; }
          fi
          if [ -f Plotina-X-armv7.apk ]; then
            read_pkg_vc Plotina-X-armv7.apk
            echo "Plotina-X-armv7.apk: package=$PKG versionCode=$VC versionName=$VN"
            [ "$VC" = "$(( PLOTINA_VERSION_CODE_BASE * 10 + 1 ))" ] \
              || { echo "::error::Plotina-X-armv7.apk versionCode $VC is not base * 10 + 1 (armv7)"; exit 1; }
          fi
          sha=$(sha256sum Plotina-X.apk | cut -d' ' -f1)
          size=$(stat -c%s Plotina-X.apk)
          # The contract in patch 0014: versionCode is the number the installed APK reports
          # (arm64 split), not the base — the updater compares it with PackageManager. For the
          # stable channel apkUrl is a stable name: publish-clients.sh copies release assets to the
          # edge host under the names the app already knows, so the URL never moves with the tag.
          # The dev channel never touches the edge host: its manifest is update-x-dev.json, served
          # from the GitHub `dev-latest` release, and it carries `devBuild: M` next to the *same*
          # versionCode as the stable it is based on. The updater offers it to a stable install of
          # that base (equal versionCode replacement) and to older dev builds when M is greater.
          if [ "$PLOTINA_DEV_BUILD" != "0" ]; then
            MANIFEST=update-x-dev.json
            APK_URL="https://github.com/plotina-cc/clients/releases/download/dev-latest/Plotina-X.apk"
            NOTES="Dev-сборка Plotina X ${PLOTINA_VERSION_NAME} (база ${PLOTINA_BUILD_NUMBER}, dev ${PLOTINA_DEV_BUILD})."
            jq -n \
              --arg package "$PKG" \
              --arg versionName "$PLOTINA_VERSION_NAME" \
              --argjson versionCode "$ARM64_VERSION_CODE" \
              --argjson devBuild "$PLOTINA_DEV_BUILD" \
              --arg apkUrl "$APK_URL" \
              --arg sha256 "$sha" \
              --argjson size "$size" \
              --arg notes "$NOTES" \
              '{client: "x", package: $package, versionName: $versionName, versionCode: $versionCode,
                devBuild: $devBuild, apkUrl: $apkUrl, sha256: $sha256, size: $size, notes: $notes}' > "$MANIFEST"
          else
            MANIFEST=update-x.json
            jq -n \
              --arg package "$PKG" \
              --arg versionName "$PLOTINA_VERSION_NAME" \
              --argjson versionCode "$ARM64_VERSION_CODE" \
              --arg apkUrl "https://plotina.cc/dl/Plotina-X.apk" \
              --arg sha256 "$sha" \
              --argjson size "$size" \
              --arg notes "Обновление Plotina X ${PLOTINA_VERSION_NAME} (сборка ${PLOTINA_BUILD_NUMBER})." \
              '{client: "x", package: $package, versionName: $versionName, versionCode: $versionCode,
                apkUrl: $apkUrl, sha256: $sha256, size: $size, notes: $notes}' > "$MANIFEST"
          fi
          cat "$MANIFEST"
          sha256sum "$MANIFEST" Plotina-X.apk

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('Plotina-X.apk') != ''
        with:
          name: Plotina-X
          path: |-
            Plotina-X*.apk
            update-x*.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the dev feed (dev-latest)
        # Dev builds never open a per-tag release: they overwrite the two assets of the fixed
        # `dev-latest` release, which is exactly what the app's dev channel reads - the manifest
        # written above (update-x-dev.json) and the arm64 APK its apkUrl points at. The first dev
        # run creates that release as a prerelease so GitHub never treats it as "latest"; every
        # later dev build replaces the assets. The updater verifies sha256/size of whatever it
        # downloads, so a half-finished upload cannot install - but a *stale* feed is invisible to
        # it, which is why this step reads the channel back over HTTPS before it goes green.
        if: steps.version.outputs.dev_build != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          manifest=update-x-dev.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/dev-latest" > /dev/null 2>&1 ||
            gh release create dev-latest \
              --title "Plotina X dev feed (opt-in)" \
              --prerelease \
              --notes "Assets for the in-app dev update channel (Настройки -> Проверить обновления). Overwritten by every v<base>-plotina-x.<N>-dev.<M> build; NOT a released version. update-x-dev.json is the manifest the app reads."
          gh release upload dev-latest Plotina-X.apk "$manifest" --clobber
          # The feed is the deliverable, so prove both assets are on the release before anything
          # below claims the channel moved.
          for asset in Plotina-X.apk "$manifest"; do
            gh release view dev-latest --json assets \
              -q ".assets[] | select(.name == \"$asset\") | \"\(.name) \(.size) bytes\"" \
              | grep -q . || { echo "::error::$asset is not attached to release dev-latest"; exit 1; }
          done
          # ---- feed verification (the report's negative control runs this block offline) ----
          # What the channel serves now, not what we think we uploaded: fetch it back over HTTPS.
          # FEED_URL only exists so the same block can be pointed at a local feed in a test.
          feed="${FEED_URL:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/dev-latest}"
          work=$(mktemp -d)
          curl -fsSL --retry 3 -o "$work/Plotina-X.apk" "$feed/Plotina-X.apk"
          curl -fsSL --retry 3 -o "$work/$manifest" "$feed/$manifest"
          # 1. The served manifest is the file this run wrote: a stale feed fails here.
          cmp -s "$work/$manifest" "$manifest" \
            || { echo "::error::the manifest on dev-latest is not the one this build wrote (the feed is stale)"; exit 1; }
          # 2. It names this build, not the previous one.
          served_name=$(jq -r '.versionName' "$work/$manifest")
          [ "$served_name" = "$PLOTINA_VERSION_NAME" ] \
            || { echo "::error::dev-latest serves versionName '$served_name', this build is '$PLOTINA_VERSION_NAME'"; exit 1; }
          # 3. sha256 and size describe the APK the channel actually serves.
          served_sha=$(jq -r '.sha256' "$work/$manifest")
          served_size=$(jq -r '.size' "$work/$manifest")
          apk_sha=$(sha256sum "$work/Plotina-X.apk" | cut -d' ' -f1)
          apk_size=$(stat -c%s "$work/Plotina-X.apk")
          [ "$served_sha" = "$apk_sha" ] \
            || { echo "::error::manifest sha256 $served_sha != served APK sha256 $apk_sha"; exit 1; }
          [ "$served_size" = "$apk_size" ] \
            || { echo "::error::manifest size $served_size != served APK size $apk_size"; exit 1; }
          # 4. apkUrl is the dev-latest asset, so the updater can never drift to another release.
          [ "$(jq -r '.apkUrl' "$work/$manifest")" = "$feed/Plotina-X.apk" ] \
            || { echo "::error::manifest apkUrl does not point at dev-latest"; exit 1; }
          echo "dev feed published: $feed/$manifest ($served_name, sha256 $apk_sha, $apk_size bytes)"

      - name: Check the APK carries our call URL, the bundled fallback and the plotina.cc app link
        run: |
          cd "$GITHUB_WORKSPACE"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls -lh Plotina-X*.apk

          # The bundled Element Call stays in the APK: it is the offline fallback if our host is down.
          unzip -l Plotina-X.apk | grep -E "assets/element-call/" | head -5
          unzip -l Plotina-X.apk | grep -q "assets/element-call/index.html"

          # And our URL is in the code, not only in the README. This is the whole point of the build:
          # if the next person bumps the pin and 0004 stops applying, this fails instead of shipping
          # an APK that silently opens Element's bundle again.
          unzip -p Plotina-X.apk "classes*.dex" | strings | grep -F "https://call.plotina.cc/room"
          unzip -p Plotina-X.apk "classes*.dex" | strings | grep -qF "https://call.plotina.cc/room"

          # 0006 puts our homeserver in the login screen's default account provider. That string
          # lives in the dex, so it is checked there: if the next pin bump drops 0006 the login
          # screen silently falls back to matrix.org, which is exactly what this fails on.
          unzip -p Plotina-X.apk "classes*.dex" | strings | grep -F "plotina.cc" | sort -u | head -5
          unzip -p Plotina-X.apk "classes*.dex" | strings | grep -qF "plotina.cc"

          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs Plotina-X.apk | head -5

          # --- the https://plotina.cc/app app link -------------------------------------------
          # This APK is signed with the Plotina key, while mobile.element.io's assetlinks.json
          # lists Element's own certificates: element.io invitation links can never resolve to it.
          # The invitation page links to https://plotina.cc/app instead, and that only opens the
          # app if the merged manifest carries our host as a *verified* filter whose only path
          # claim is pathPrefix /app. A bare path="/" (or a filter without a path) would swallow
          # the whole site, invitation page included, so that case has to fail here.

          # aapt2 (then aapt) renders the compiled AndroidManifest.xml as a readable tree. Plain
          # strings is the last resort: it can prove the host is in the string pool, not that the
          # filter is shaped correctly, so the log says which method ran.
          dump_manifest() {
            local apk="$1" out="$2" aapt2 aapt
            MODE=aapt2
            aapt2=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
            aapt=$(ls "$SDK"/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
            if [ -n "$aapt2" ]; then
              echo "   manifest check method: aapt2 dump xmltree ($aapt2)"
              "$aapt2" dump xmltree --file AndroidManifest.xml "$apk" > "$out"
            elif [ -n "$aapt" ]; then
              MODE=aapt
              echo "   manifest check method: aapt dump xmltree ($aapt)"
              "$aapt" dump xmltree "$apk" AndroidManifest.xml > "$out"
            else
              MODE=strings
              echo "::warning::no aapt/aapt2 in $SDK/build-tools: falling back to strings over the decompressed AndroidManifest.xml"
              unzip -p "$apk" AndroidManifest.xml > "$out.bin"
              { strings "$out.bin"; strings -e l "$out.bin"; } > "$out"
            fi
            # A dump that has no element lines is not a tree: treat it as a string scan.
            if ! grep -qm1 'E: ' "$out"; then MODE=strings; fi
          }

          # One line on purpose: a heredoc cannot be indented inside a YAML block.
          check_app_link() {
            local apk="$1" out="$RUNNER_TEMP/manifest-$(basename "$apk").txt"
            echo "   -- $apk"
            dump_manifest "$apk" "$out"
            echo "   plotina.cc in the manifest dump:"
            grep -n -i "plotina\.cc" "$out" || echo "      (none)"
            if [ "$MODE" = "strings" ]; then
              grep -q "plotina\.cc" "$out"
              grep -q -- "/app" "$out"
              echo "   strings check: plotina.cc and /app are in the compiled manifest (structure NOT verified)"
            else
              awk -v apk="$apk" 'function close_block(){ if (inblock && block ~ /plotina\.cc/) { if (block ~ /autoVerify/ && block ~ /pathPrefix/ && block ~ /"\/app"/ && block !~ /:path\(/) { print "   OK: " apk " has a verified intent-filter for plotina.cc with pathPrefix /app at the filter level"; got=1 } else { print "   FAIL: intent-filter for plotina.cc is not autoVerify+pathPrefix /app:" block } } inblock=0; block="" } /E: intent-filter/ { close_block(); inblock=1; block=$0; next } inblock { if ($0 ~ /E: (activity|service|receiver|provider)/) { close_block(); next } block = block "\n" $0 } END { close_block(); if (!got) print "   FAIL: no intent-filter in the merged manifest claims plotina.cc"; exit (got ? 0 : 1) }' "$out"
            fi
          }

          for apk in Plotina-X*.apk; do check_app_link "$apk"; done

      - name: Gate — every applied patch is in the APK
        # The build is not allowed to be green about a patch that did not reach the artifact. The
        # marker list comes from apply-patches.sh, i.e. from the files that were really applied in
        # this job, so this catches the .32-dev.4 shape (a patch in patches/, missing from the APK)
        # and also the subtler one: applied, but stripped out by R8 or the resource shrinker.
        # Both splits are checked — they carry the same dex, and the armv7 one is published too.
        run: |
          cd "$GITHUB_WORKSPACE"
          for apk in Plotina-X*.apk; do
            echo "-- $apk"
            element-x/scripts/check-markers.sh "$apk" plotina-markers.txt
          done

      - name: Check the APK carries Firebase and our push project
        run: |
          cd "$GITHUB_WORKSPACE"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          echo "aapt2: ${AAPT2:-none}"
          failed=0
          for apk in Plotina-X*.apk; do
            echo "-- $apk"

            # 1. The library itself. Two notes on the command: `unzip -l | grep -c
            #    'com/google/firebase'` lists *zip entries*, and Firebase's classes are inside
            #    classes*.dex rather than separate entries, so that count is 0 even in a correct
            #    APK. It is printed for the record; the gate is the same measurement against the
            #    places the classes actually live — the dex string pool and the merged manifest
            #    (FirebaseInitProvider / FirebaseMessagingService are manifest components).
            echo "   zip entries matching com/google/firebase: $(unzip -l "$apk" | grep -c 'com/google/firebase' || true)"
            dex_hits=$(unzip -p "$apk" "classes*.dex" | strings | grep -c 'com/google/firebase' || true)
            manifest_hits=$({ unzip -p "$apk" AndroidManifest.xml | strings -a; unzip -p "$apk" AndroidManifest.xml | strings -a -e l; } | grep -c 'com\.google\.firebase' || true)
            echo "   com/google/firebase strings: $dex_hits in classes*.dex, $manifest_hits in the manifest"
            if [ "${dex_hits:-0}" -eq 0 ] && [ "${manifest_hits:-0}" -eq 0 ]; then
              echo "::error file=$apk::$apk contains no Firebase: the gplay flavour's push provider is missing"
              failed=1
              continue
            fi

            # 2. The Firebase project. project_id is a string resource, not a dex constant, so it
            #    lives in resources.arsc — this is the check that GOOGLE_SERVICES_JSON reached the
            #    build and that it is our project rather than Element's vector-alpha.
            #
            #    `aapt2 dump resources` prints the resource on one line and each configuration's
            #    value on the lines *after* it ("(default) \"...\""), so the value has to be read
            #    with context: `grep 'string/project_id' | head -1` finds the name and never the
            #    value, which is how the first version of this check failed a correct APK.
            if [ -n "$AAPT2" ]; then
              section=$("$AAPT2" dump resources "$apk" | grep -A3 'string/project_id' || true)
              echo "   aapt2 dump resources, project_id:"
              printf '%s\n' "${section:-<no string/project_id>}" | sed 's/^/      /'
              if printf '%s' "$section" | grep -qF 'plotina-push'; then
                echo "   OK: project_id is plotina-push"
              else
                echo "::error file=$apk::$apk does not carry the plotina-push project id: the Firebase overlay did not reach the build"
                failed=1
              fi
              # Same question for the app id: without it FirebaseApp cannot initialise at all.
              appid=$("$AAPT2" dump resources "$apk" | grep -A3 'string/google_app_id' || true)
              echo "   aapt2 dump resources, google_app_id:"
              printf '%s\n' "${appid:-<no string/google_app_id>}" | sed 's/^/      /'
              if printf '%s' "$appid" | grep -q 'android:'; then
                echo "   OK: google_app_id is present"
              else
                echo "::error file=$apk::$apk has no google_app_id resource"
                failed=1
              fi
            else
              echo "   no aapt2 in $SDK/build-tools: scanning resources.arsc instead (value only, no resource name)"
              { unzip -p "$apk" resources.arsc | strings -a; unzip -p "$apk" resources.arsc | strings -a -e l; } \
                | grep -F 'plotina-push' | head -1 || true
              if unzip -p "$apk" resources.arsc | strings -a | grep -qF 'plotina-push'; then
                echo "   OK: plotina-push is in resources.arsc"
              else
                echo "::error file=$apk::$apk does not carry the plotina-push project id"
                failed=1
              fi
            fi

            # 3. And the gateway in the code. The generic `plotina.cc` check above also matches the
            #    account provider, so this one is specific about the push URL of patch 0007.
            unzip -p "$apk" "classes*.dex" | strings | grep -F "https://push.plotina.cc/_matrix/push/v1/notify" | head -1 || true
            unzip -p "$apk" "classes*.dex" | strings | grep -qF "https://push.plotina.cc/_matrix/push/v1/notify" \
              || { echo "::error file=$apk::$apk does not call https://push.plotina.cc/_matrix/push/v1/notify: patch 0007 is missing"; failed=1; }
          done
          exit "$failed"

      - name: Work out the release title
        # Dev builds publish nothing automatically: the moving `dev-latest` feed is updated by hand
        # (see "Dev feed hand-off"). A tagged dev release would fork the feed away from it.
        if: startsWith(github.ref, 'refs/tags/') && steps.version.outputs.dev_build == '0'
        id: release_title
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base="${TAG#v}"
          echo "name=Plotina X ${base%%-plotina-*}" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # Human-facing title only: never the tag, which carries the upstream
          # client name and the plotina release counter.
          name: ${{ steps.release_title.outputs.name }}
          # A dev tag is a test build of the stable base it names, so it must never be offered as
          # "latest": GitHub's /releases/latest skips prereleases, and this keeps a dev build out
          # of the stable slot for however long its per-tag release exists.
          prerelease: ${{ contains(github.ref_name, '-dev.') }}
          files: |-
            Plotina-X*.apk
            update-x.json
          # Tag namespace is shared with the other clients in this repository, so generated notes
          # would paste an unrelated changelog.
          generate_release_notes: false
          body: |
            Plotina X for Android built from element-x-android `${{ env.ELEMENT_X_TAG }}`, with calls
            opening on **https://call.plotina.cc/room** by default — no setting to change, no URL to
            type. Element Call is loaded in the WebView from our origin, which is where our noise
            suppression lives.

            - The bundled Element Call stays in the APK as the offline fallback; developer settings
              ("Custom Element Call base URL") still override the default.
            - **https://plotina.cc/app opens this app** on Android 12 and later, once the site's
              `assetlinks.json` lists the Plotina signing certificate. Paths outside `/app` stay in
              the browser.
            - The sign-in screen is prefilled with **plotina.cc** as the homeserver; another
              address can still be typed there.
            - **Push notifications come through FCM**, registered against our own push gateway at
              `https://push.plotina.cc` instead of Element's. The phone needs Google Play Services
              for that; where they are missing, the app falls back to UnifiedPush (ntfy).
            - Signed with the Plotina key, application id `cc.plotina.x`: installs over our
              previous builds. Without signing secrets the build falls back to a debug APK with the
              `.debug` application id, which has to be installed from scratch.
            - `Plotina-X.apk` is the arm64-v8a build (every phone from the last several
              years); `Plotina-X-armv7.apk` covers older 32-bit devices. There is no universal
              APK on purpose: one file for all four ABIs is 400 MB.
            - **Updates from inside the app**: the «Проверить обновления» row at the top of the
              Settings list, right above «О приложении», opens the full-screen updater page, plus a
              silent check once a day at start. `update-x.json` (attached to this release next to
              the APK, and mirrored to https://plotina.cc/dl/update-x.json by
              `scripts/publish-clients.sh`) carries the APK's sha256, size and versionCode; the
              app downloads, verifies, and opens the system installer. The versionCode follows the
              tag: `vYY.MM.p-plotina-x.N` -> `(2000+YY)*100000 + MM*1000 + N`.
            - Source: this repository at this tag plus the upstream tag pinned in `element-x/pins.env`. The full set and rebuild steps are in
              https://github.com/plotina-cc/clients/blob/main/SOURCE.md (AGPL-3.0-or-later upstream, AGPL-3.0 patch layer).

            If the call page cannot be reached, the copy of Element Call bundled in the APK is used
            instead.
