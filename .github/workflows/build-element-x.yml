# Builds Plotina's Element X Android APK: upstream element-x-android, with the call WebView pointed
# at our own Element Call (https://call.plotina.cc/room) by default, so a call opens there without
# anyone typing a URL into developer settings.
#
# The native Rust/JNI denoiser path (element-x/native/plotina-dfn, patches 0001 and 0003) is kept in
# this repository as a reserve but is deliberately NOT part of this build: nothing here compiles
# Rust, installs the NDK, or publishes element-call-android to mavenLocal. The WebView call reaches
# noise suppression through our own Element Call deployment instead.
#
# Nothing is built on golova; this workflow is the build machine. It needs no macOS runner: the
# Android target is all we ship (see element-x/README.md, "Limitations").
#
# Secrets, all optional - without them the job builds a debug APK signed with the debug key, which
# cannot replace an installed release:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore (base64 -w0 plotina.jks)
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias (plotina)
#   ANDROID_KEY_PASSWORD      key password
name: Build Element X (Android, Plotina)

on:
  push:
    tags:
      - "v*-plotina-x.*"
  pull_request:
    paths:
      - "element-x/**"
      - ".github/workflows/build-element-x.yml"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "element-x-android tag (empty = the pin in element-x/pins.env)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: build-element-x-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same heap upstream CI uses: R8 on the full app runs out of memory well before 4g.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8 -XX:+UseG1GC

jobs:
  # Cheap and first: if the patches no longer apply to the pinned tag, nothing below is worth the
  # machine time, and this is the check that upstream drift breaks.
  patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pins
        # $GITHUB_ENV takes KEY=VALUE lines only: a '#' line is rejected as "Invalid format",
        # which is how the first run of this workflow died in ten seconds.
        run: grep -Ev '^[[:space:]]*(#|$)' element-x/pins.env >> "$GITHUB_ENV"
      - name: Patches apply to element-x-android
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: |
          # `inputs` is empty on push, and a value written to GITHUB_ENV is not visible to the
          # `env` context of the same step: stay in the shell.
          tag="${UPSTREAM_TAG:-$ELEMENT_X_TAG}"
          echo "element-x-android: $tag"
          # LFS holds screenshot-test blobs worth hundreds of MB; the build never reads them.
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch "$tag" \
            https://github.com/element-hq/element-x-android "$RUNNER_TEMP/element-x"
          cd "$RUNNER_TEMP/element-x"
          git apply --check --verbose "$GITHUB_WORKSPACE/element-x/patches/0002-element-x-android-plotina-signing.patch"
          git apply --check --verbose "$GITHUB_WORKSPACE/element-x/patches/0004-element-x-android-plotina-call-url.patch"

  build:
    needs: patches
    # Pull requests get the patch check only: a full build is 20-40 minutes and needs no review.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Read pins
        run: |
          grep -Ev '^[[:space:]]*(#|$)' element-x/pins.env >> "$GITHUB_ENV"
          if [ -n "${UPSTREAM_TAG:-}" ]; then
            echo "ELEMENT_X_TAG=$UPSTREAM_TAG" >> "$GITHUB_ENV"
          fi
        env:
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the SDK packages Element X compiles against
        run: |
          # ubuntu-latest ships the Android SDK and upstream's own CI never installs anything, so
          # nothing here may fail just because a package is already present. Do not use
          # android-actions/setup-android@v3: it asks the repository for the `tools` package, which
          # no longer exists there, and the job dies before Gradle starts.
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK: $SDK"
          # Gradle finds the SDK through ANDROID_HOME; make sure the later steps have it even if the
          # image stopped exporting it.
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # compileSdk/targetSdk 37 and build-tools 37.0.0 come from plugins/src/main/kotlin/Versions.kt
          # at the pinned tag. The image carries "platforms;android-37.0" (the API 37 minor-version
          # naming), the repository may not know a bare "platforms;android-37": that is not fatal,
          # AGP downloads the SDK packages it resolves to itself once the licences are accepted.
          "$SDKMANAGER" --install "platforms;android-37" "build-tools;37.0.0" \
            || "$SDKMANAGER" --channel=3 --install "platforms;android-37" "build-tools;37.0.0" \
            || {
              echo "::warning::sdkmanager has no 'platforms;android-37'; leaving it to Gradle"
              "$SDKMANAGER" --list_installed || true
            }

      - uses: gradle/actions/setup-gradle@v4

      - name: element-x-android, patched
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone --depth 1 --branch "$ELEMENT_X_TAG" \
            https://github.com/element-hq/element-x-android upstream/element-x
          cd upstream/element-x
          # 0002: release is signed with our key instead of upstream's debug key, and
          # `-PplotinaSingleApk` builds one APK instead of four ABI splits.
          git apply --verbose "$GITHUB_WORKSPACE/element-x/patches/0002-element-x-android-plotina-signing.patch"
          # 0004: the call WebView defaults to https://call.plotina.cc/room.
          git apply --verbose "$GITHUB_WORKSPACE/element-x/patches/0004-element-x-android-plotina-call-url.patch"

      - name: Decode the signing key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/plotina.keystore"
            {
              echo "PLOTINA_STOREFILE=$RUNNER_TEMP/plotina.keystore"
              echo "PLOTINA_STOREPASSWORD=$KEYSTORE_PASSWORD"
              echo "PLOTINA_KEY_ALIAS=$KEY_ALIAS"
              echo "PLOTINA_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: building a debug APK, which cannot be installed over a release build"
          fi

      - name: Assemble
        working-directory: upstream/element-x
        run: |
          if [ "${{ steps.keystore.outputs.signed }}" = "true" ]; then
            ./gradlew -PplotinaSingleApk assembleFdroidRelease --stacktrace --no-configuration-cache
            apk_dir=app/build/outputs/apk/fdroid/release
          else
            ./gradlew -PplotinaSingleApk assembleFdroidDebug --stacktrace --no-configuration-cache
            apk_dir=app/build/outputs/apk/fdroid/debug
          fi
          apk=$(find "$apk_dir" -name '*.apk' | head -1)
          echo "APK: $apk"
          cp "$apk" "$GITHUB_WORKSPACE/Plotina-ElementX.apk"

      - name: Check the APK carries our call URL and the bundled fallback
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -lh Plotina-ElementX.apk

          # The bundled Element Call stays in the APK: it is the offline fallback if our host is down.
          unzip -l Plotina-ElementX.apk | grep -E "assets/element-call/" | head -5
          unzip -l Plotina-ElementX.apk | grep -q "assets/element-call/index.html"

          # And our URL is in the code, not only in the README. This is the whole point of the build:
          # if the next person bumps the pin and 0004 stops applying, this fails instead of shipping
          # an APK that silently opens Element's bundle again.
          unzip -p Plotina-ElementX.apk "classes*.dex" | strings | grep -F "https://call.plotina.cc/room"
          unzip -p Plotina-ElementX.apk "classes*.dex" | strings | grep -qF "https://call.plotina.cc/room"

          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs Plotina-ElementX.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: Plotina-ElementX
          path: Plotina-ElementX.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Plotina-ElementX.apk
          generate_release_notes: true
          body: |
            Element X for Android built from element-x-android `${{ env.ELEMENT_X_TAG }}`, with calls
            opening on **https://call.plotina.cc/room** by default — no setting to change, no URL to
            type. Element Call is loaded in the WebView from our origin, which is where our noise
            suppression lives.

            - The bundled Element Call stays in the APK as the offline fallback; developer settings
              ("Custom Element Call base URL") still override the default.
            - **Debug APK**: no signing secrets are configured yet, so this is signed with the Android
              debug key and has application id `io.element.android.x.debug`. It installs next to a
              release build, but a later signed release has to be installed from scratch.
            - Source: this repository at this tag plus the upstream tag pinned in `element-x/pins.env`.

            Check that `https://call.plotina.cc/room` answers before handing this APK out.
