name: Build Plotina Lite Web

# The static web bundle served at cinny.plotina.cc. It is the same dist the
# desktop workflow compiles into the Tauri shell, but it ships on its own
# schedule: a change in noise/ or in the Sentry patch has to reach the browser
# without waiting for an installer build, and the source maps must belong to
# the exact files the edge serves.
#
# The artifact is what gets unpacked into /srv/cinny; the deploy itself stays
# manual (cinny/README.md, "Cinny Web"), because only the edge host holds the
# key that may write there.
#
# This workflow is independent of the desktop shell: from tag
# v4.12.8-plotina-lite-desktop.18 the desktop is Electron
# (build-cinny-electron.yml, which compiles its own web dist for the asar),
# but the site bundle here keeps building on the same tags and on main.

on:
  workflow_dispatch:
    inputs:
      release:
        description: "GlitchTip release (empty: cinny@<UPSTREAM_TAG without v>)"
        required: false
        default: ""
  push:
    branches: [main]
    tags: ["v*-plotina-lite-desktop.*"]
    paths: ["cinny/**", "noise/**", ".github/workflows/build-cinny-web.yml"]

permissions:
  contents: read

env:
  UPSTREAM_REPO: https://github.com/cinnyapp/cinny-desktop.git
  # Public by design: it is embedded in every bundle we serve.
  VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_SDK_VERSION: 10.27.0
  SENTRY_CLI_VERSION: 2.42.2
  SENTRY_ORG: plotina
  SENTRY_PROJECT: web-clients
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

concurrency:
  group: build-cinny-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: web dist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pin upstream
        working-directory: cinny
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(cat UPSTREAM_TAG)"
          echo "upstream tag: $TAG"
          git clone --depth 1 --branch "$TAG" --recurse-submodules --shallow-submodules \
            "$UPSTREAM_REPO" upstream

      # The release is what groups events in GlitchTip and must equal the name
      # the source maps are uploaded under. Two forms only:
      #   cinny@4.12.8                  a build of upstream tag v4.12.8
      #   cinny@v4.12.8-plotina-lite-desktop.4 a tag of this repository (same string
      #                                 the desktop build reports)
      - name: Name the release
        shell: bash
        env:
          RELEASE_INPUT: ${{ inputs.release }}
        run: |
          set -euo pipefail
          version="$(tr -d 'v\r\n' < cinny/UPSTREAM_TAG)"
          if [ -n "${RELEASE_INPUT:-}" ]; then
            release="$RELEASE_INPUT"
          elif [ "${GITHUB_REF_TYPE}" = tag ]; then
            release="cinny@${GITHUB_REF_NAME}"
          else
            release="cinny@${version}"
          fi
          echo "SENTRY_RELEASE=$release" >> "$GITHUB_ENV"
          echo "release: $release"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cinny/upstream/package-lock.json
            cinny/upstream/cinny/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The denoiser ships inside the mounted Element Call frame (its own
      # noise/ tree), so the dist needs no copy of it at the root.
      # The noise layer still ships inside the call frame, so its suites must
      # not regress; they read the repo-level noise/ fetched here (digest
      # assertions + headless smoke).
      - name: Fetch DPDFNet assets for the tests
        run: python3 noise/scripts/fetch-dpdfnet.py

      - name: Noise tests (python)
        run: python3 -m unittest discover -s noise/tests -p '*_test.py'

      - name: Plotina Lite branding tests (python)
        run: python3 -m unittest discover -s cinny/tests -p 'test_*.py'

      - name: Noise tests (node)
        run: node --test noise/tests/*.test.mjs

      - name: Noise tests (headless browser)
        shell: bash
        run: |
          set -euo pipefail
          for b in chromium chromium-browser google-chrome; do
            if command -v "$b" >/dev/null 2>&1; then export CHROME="$b"; break; fi
          done
          if [ -n "${CHROME:-}" ]; then
            bash noise/tests/run-headless.sh
          else
            echo "::notice::no chromium binary on this runner; headless smoke skipped"
          fi

      - name: Apply the Sentry init
        working-directory: cinny
        shell: bash
        run: |
          set -euo pipefail
          # Apply every patch in cinny/patches in name order. 0001 adds Sentry;
          # 0002 adds the Plotina source link to the auth footer and About page.
          # Fails loudly if a future upstream tag moves an anchor.
          for patch in "$PWD"/patches/*.patch; do
            git -C upstream/cinny apply --check "$patch"
            git -C upstream/cinny apply "$patch"
          done

      - name: Build Plotina Lite Web
        working-directory: cinny/upstream/cinny
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          # Not in upstream's package.json on purpose: --no-save leaves both
          # package.json and package-lock.json untouched, and letting npm read
          # the lock keeps transitive pins like @swc/core intact.
          npm install --no-save --no-audit --no-fund "@sentry/browser@${SENTRY_SDK_VERSION}"
          VITE_SENTRY_RELEASE="$SENTRY_RELEASE" npm run build

      # Debug ids pair an event with its map, and the maps then leave the dist:
      # /srv/cinny must not publish the TypeScript source.
      - name: Split the source maps
        working-directory: cinny
        shell: bash
        run: |
          set -euo pipefail
          cli=()
          if [ -n "${SENTRY_AUTH_TOKEN:-}" ]; then
            curl -fsSL -o "$RUNNER_TEMP/sentry-cli" \
              "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Linux-x86_64"
            chmod +x "$RUNNER_TEMP/sentry-cli"
            cli=(--sentry-cli "$RUNNER_TEMP/sentry-cli")
          else
            echo "::notice::SENTRY_AUTH_TOKEN is not set: the maps are split out unlabelled."
          fi
          python scripts/sentry-sourcemaps.py --dist upstream/cinny/dist \
            --out "$RUNNER_TEMP/cinny-sourcemaps" --release "$SENTRY_RELEASE" \
            "${cli[@]+"${cli[@]}"}"

      # /api/0/* is proxied by the relay with a bearer token, so this upload is
      # expected to work; a rejection is a real failure, not a known 403.
      - name: Upload source maps to GlitchTip
        if: env.SENTRY_AUTH_TOKEN != ''
        shell: bash
        env:
          SENTRY_URL: https://sentry.plotina.cc
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/sentry-cli"
          test -d "$RUNNER_TEMP/cinny-sourcemaps"
          "$cli" releases new "$SENTRY_RELEASE"
          "$cli" sourcemaps upload --release "$SENTRY_RELEASE" \
            --url-prefix "~" "$RUNNER_TEMP/cinny-sourcemaps"

      - name: Apply noise and branding patches
        working-directory: cinny
        shell: bash
        run: |
          set -euo pipefail
          cp config.json upstream/config.json
          cp config.json upstream/cinny/config.json
          cp config.json upstream/cinny/dist/config.json
          # Upstream's embedded 0.20.1 is gone: the frame is our Element Call
          # archive (cinny/element-call.lock.json, same pin as Desktop), which
          # carries its own noise/ inside the mount.
          python scripts/mount-element-call.py --dist upstream/cinny/dist \
            --lock element-call.lock.json --work "$RUNNER_TEMP/element-call"
          python apply-noise.py --dist upstream/cinny/dist
          python branding.py --dist upstream/cinny/dist --brand "Plotina Lite Web"

      - name: Verify the artifact
        working-directory: cinny
        shell: bash
        run: |
          set -euo pipefail
          dist=upstream/cinny/dist
          # Patch 0009 compiles the Settings -> General noise block into the
          # bundle; its testid marker must survive minification or the
          # settings never ship. The shell itself carries no noise <script>
          # tags any more — only the call frame does.
          grep -Raqs 'plotina-noise-settings' "$dist/assets"
          if grep -q 'noise/cinny-ui.js' "$dist/index.html"; then
            echo "stale noise injection survived in the shell" >&2
            exit 1
          fi
          # The dist carries OUR frame: no upstream widget, no dist-level
          # noise copy, and the denoiser models live inside the mount.
          python scripts/mount-element-call.py --dist upstream/cinny/dist --check
          if grep -Raqs 'element-call-embedded' upstream/cinny/dist; then
            echo "upstream embedded widget survived in the dist" >&2
            exit 1
          fi
          test ! -e upstream/cinny/dist/noise
          grep -Raqs 'video_tile.stream_paused' upstream/cinny/dist/public/element-call/assets
          if grep -Raqs 'video_tile.hide_stream' upstream/cinny/dist/public/element-call/assets; then
            echo "the superseded hide_stream menu survived in the dist" >&2
            exit 1
          fi
          test -f upstream/cinny/dist/public/element-call/noise/dfn/v3/pkg/df_bg.wasm
          test -f "$dist/config.json"
          test -s "$dist/LICENSE-AGPL-3.0"
          test -s "$dist/NOTICE"
          grep -q 'plotina-icon.svg' "$dist/index.html"
          if grep -q 'favicon-.*\.ico' "$dist/index.html"; then
            echo "upstream favicon survived branding" >&2
            exit 1
          fi
          # The SDK is in the bundle; both build-time values survive minification.
          grep -Raqs 'sentry.javascript' "$dist/assets"
          grep -RaqsF "$VITE_SENTRY_DSN" "$dist/assets"
          grep -RaqsF "$SENTRY_RELEASE" "$dist/assets"
          # Nothing may publish the app's TypeScript source.
          if find "$dist/assets" -name '*.map' | grep -q . || [ -e "$dist/sw.js.map" ]; then
            echo "source maps leaked into the artifact" >&2
            exit 1
          fi
          echo "reporting enabled for $SENTRY_RELEASE"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C cinny/upstream/cinny/dist -czf dist/plotina-lite-web.tar.gz .
          # The checksum names the file without a directory, so it verifies
          # next to the tarball wherever it is unpacked.
          ( cd dist && sha256sum plotina-lite-web.tar.gz > plotina-lite-web.tar.gz.sha256 )
          cat dist/plotina-lite-web.tar.gz.sha256
          cinny_commit="$(git -C cinny/upstream/cinny rev-parse HEAD)"
          jq -n --arg release "$SENTRY_RELEASE" \
                --arg tag "$(cat cinny/UPSTREAM_TAG)" \
                --arg repo_commit "$GITHUB_SHA" \
                --arg cinny_commit "$cinny_commit" \
                --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{release:$release, upstream_tag:$tag, repo_commit:$repo_commit, cinny_commit:$cinny_commit, run:$run}' \
            > dist/build-info.json
          cat dist/build-info.json
          du -h dist/plotina-lite-web.tar.gz
          {
            echo "### Plotina Lite Web $SENTRY_RELEASE"
            echo '```'
            cat dist/plotina-lite-web.tar.gz.sha256
            echo '```'
            echo "Deploy: untar into a new directory under /srv, then swap /srv/cinny (cinny/README.md)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: plotina-lite-web
          path: dist/*
          if-no-files-found: error
          retention-days: 30
