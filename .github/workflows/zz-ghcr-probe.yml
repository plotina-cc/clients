name: tmp ghcr token probe

# Throwaway: asks GHCR for a push-scoped token with the workflow GITHUB_TOKEN and
# prints the granted access claims. Writes nothing, creates no package.

on:
  push:
    branches: [tmp/ghcr-probe]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Request a push-scoped token
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsS -u "${GITHUB_ACTOR}:${TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:plotina-cc/element-web:pull,push" \
            -o "$RUNNER_TEMP/token.json"
          python3 - "$RUNNER_TEMP/token.json" <<'PY'
          import base64, json, sys
          token = json.load(open(sys.argv[1]))["token"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print(json.dumps(claims.get("access"), indent=2))
          PY

      - name: Docker login
        run: |
          set -euo pipefail
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
