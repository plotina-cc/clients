name: tmp ghcr token probe

# Throwaway: asks GHCR for a push-scoped token with the workflow GITHUB_TOKEN and
# prints the granted access claims. Writes nothing, creates no package.

on:
  push:
    branches: [tmp/ghcr-probe]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Request a push-scoped token
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS -o "$RUNNER_TEMP/basic.json" \
            -u "${GITHUB_ACTOR}:${TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:plotina-cc/element-web:pull,push"
          python3 - "$RUNNER_TEMP/basic.json" <<'PY'
          import base64, json, sys

          raw = json.load(open(sys.argv[1]))["token"]
          decoded = base64.b64decode(raw).decode()
          jwt = decoded.split("_", 2)[-1]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          print("claims:", json.dumps(json.loads(base64.urlsafe_b64decode(payload)), indent=2)[:1500])
          PY

      # A push-permission probe that writes nothing: the registry answers a blob
      # upload POST with 202 when the token may push and 401/403 when it may not.
      # No session is completed, so no manifest and no package version is made.
      - name: Can this token push?
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bearer="$(curl -sS -u "${GITHUB_ACTOR}:${TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:plotina-cc/element-web:pull,push" | jq -r .token)"
          echo "tags list (read): $(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${bearer}" \
            https://ghcr.io/v2/plotina-cc/element-web/tags/list)"
          echo "upload POST (write): $(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${bearer}" \
            https://ghcr.io/v2/plotina-cc/element-web/blobs/uploads/)"
