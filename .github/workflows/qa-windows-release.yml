name: QA windows release installer (no publish)

# Acceptance QA on the artefact we actually PUBLISH, not on a local build: for an
# existing release tag this workflow downloads the release assets (the NSIS
# setup.exe + latest.yml), checks the sha512/size/version that latest.yml
# advertises BEFORE anything is installed, installs the package silently, proves
# the installed tree reports the tag's version (exe metadata + the version inside
# the shipped app.asar), launches the app, and proves a window appears and the
# process survives.
#
# With `from_tag` it covers the update path instead: install `from_tag`, launch
# it, then run the new installer exactly the way desktop/updater.ts does
# (`/S --updated --force-run`) and assert the OLD pid exits while a NEW pid gets a
# window — the Windows auto-restart that `.46` needed.
#
# Nothing is published, tagged or uploaded anywhere: contents: read, no secrets,
# the only write is the workflow artifact (logs, versions, PID tables, screenshot).
#
# This is the release-artefact counterpart of qa/windows-update-restart, which
# builds qa44/qa45/qa46 installers of its own to pin the argv contract.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag whose Windows installer is checked, e.g. v1.12.32-plotina-desktop.46'
        required: false
        type: string
        default: ''
      from_tag:
        description: 'Optional older release tag to install first and update from, e.g. v1.12.32-plotina-desktop.45 (empty = fresh install only)'
        required: false
        type: string
        default: ''
      settle_seconds:
        description: 'How long the launched app must stay alive with a window'
        required: false
        type: string
        default: '30'
      artifact_run_id:
        description: 'QA branch mode: Actions run id whose plotina-desktop-windows artifact is installed, exercised and uninstalled instead of a published release'
        required: false
        type: string
        default: ''
      expected_sha:
        description: 'QA branch mode: commit the artifact must have been built from (checked against the run head)'
        required: false
        type: string
        default: ''

run-name: "QA windows ${{ inputs.artifact_run_id != '' && format('branch artifact of run {0}', inputs.artifact_run_id) || inputs.tag }}${{ inputs.from_tag != '' && format(' (update from {0})', inputs.from_tag) || '' }}"

permissions:
  contents: read
  actions: read

concurrency:
  group: qa-windows-release-${{ inputs.tag }}-${{ inputs.from_tag }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  windows-release:
    name: windows release installer QA
    if: inputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Tags carry the release counter, the app version does not (v1.12.32-
      # plotina-desktop.46 -> 1.12.32-plotina.46, -dev.1 kept as -dev.1), exactly
      # like the build workflow derives it. Everything downstream is keyed off
      # these two values, so a tag that does not parse fails before any download.
      - name: Resolve the tag -> app version and asset name
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          FROM_TAG: ${{ inputs.from_tag }}
          SETTLE_SECONDS: ${{ inputs.settle_seconds }}
        run: |
          set -euo pipefail
          resolve() {
            local tag="$1"
            local re='^v([0-9]+\.[0-9]+\.[0-9]+)-plotina-desktop\.([0-9]+)(-dev\.([0-9]+))?$'
            [[ "$tag" =~ $re ]] || return 1
            local v="${BASH_REMATCH[1]}-plotina.${BASH_REMATCH[2]}"
            if [[ -n "${BASH_REMATCH[3]:-}" ]]; then
              v="${v}-dev.${BASH_REMATCH[4]}"
            fi
            printf '%s' "$v"
          }

          if ! EXPECTED="$(resolve "$TAG")"; then
            echo "::error::tag '$TAG' is not a Plotina Desktop release tag (v<upstream>-plotina-desktop.<N>[-dev.<M>])"
            exit 1
          fi
          echo "tag      : $TAG"
          echo "version  : $EXPECTED"
          echo "installer: Plotina-Desktop-$EXPECTED-setup.exe"

          {
            echo "TAG=$TAG"
            echo "EXPECTED_VERSION=$EXPECTED"
            echo "EXPECTED_SETUP=Plotina-Desktop-$EXPECTED-setup.exe"
            echo "SETTLE_SECONDS=$SETTLE_SECONDS"
          } >> "$GITHUB_ENV"

          if [[ ! "$SETTLE_SECONDS" =~ ^[0-9]+$ ]] || [ "$SETTLE_SECONDS" -lt 10 ]; then
            echo "::error::settle_seconds must be an integer >= 10 (got '$SETTLE_SECONDS')"
            exit 1
          fi

          if [ -n "$FROM_TAG" ]; then
            if ! FROM_VERSION="$(resolve "$FROM_TAG")"; then
              echo "::error::from_tag '$FROM_TAG' is not a Plotina Desktop release tag"
              exit 1
            fi
            if [ "$FROM_VERSION" = "$EXPECTED" ]; then
              echo "::error::from_tag '$FROM_TAG' resolves to the same app version as tag '$TAG' — the update would be a no-op"
              exit 1
            fi
            echo "from tag : $FROM_TAG"
            echo "from ver : $FROM_VERSION"
            {
              echo "FROM_TAG=$FROM_TAG"
              echo "FROM_VERSION=$FROM_VERSION"
              echo "FROM_SETUP=Plotina-Desktop-$FROM_VERSION-setup.exe"
            } >> "$GITHUB_ENV"
          else
            echo "from_tag : (empty — fresh install only)"
            echo "FROM_TAG=" >> "$GITHUB_ENV"
            echo "FROM_VERSION=" >> "$GITHUB_ENV"
            echo "FROM_SETUP=" >> "$GITHUB_ENV"
          fi

      - name: Download the release assets (setup.exe + latest.yml)
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local tag="$1" setup="$2"
            echo "::group::release $tag"
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json tagName,isPrerelease,assets \
              --jq '"tag=\(.tagName) prerelease=\(.isPrerelease)", (.assets[] | "asset: \(.name) \(.size) bytes")'
            local names
            names="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
            for want in "$setup" latest.yml; do
              if ! printf '%s\n' "$names" | grep -Fxq "$want"; then
                echo "::error::release $tag has no asset '$want'"
                exit 1
              fi
            done
            mkdir -p "rel/$tag"
            # gh takes the tag as its only positional; assets go through -p, which
            # is repeatable (newer gh accepts several file args, windows-latest's
            # does not, so keep to -p).
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "rel/$tag" --clobber \
              -p "$setup" -p latest.yml
            for f in "$setup" latest.yml; do
              if [ ! -s "rel/$tag/$f" ]; then
                echo "::error::release $tag: '$f' was not downloaded into rel/$tag"
                exit 1
              fi
            done
            ls -l "rel/$tag"
            echo "::endgroup::"
          }
          fetch "$TAG" "$EXPECTED_SETUP"
          if [ -n "${FROM_TAG:-}" ]; then
            fetch "$FROM_TAG" "$FROM_SETUP"
          fi

      # Must run BEFORE any install: this is the same sha512 the updater trusts.
      - name: Verify sha512 / size / version from latest.yml (before install)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $EV = Join-Path $env:GITHUB_WORKSPACE 'qa-evidence'
          New-Item -ItemType Directory -Force -Path $EV | Out-Null

          function Assert-AssetMetadata([string]$tag, [string]$setupName, [string]$wantVersion) {
              $dir  = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'rel') $tag
              $setup = Join-Path $dir $setupName
              $yml   = Join-Path $dir 'latest.yml'
              if (-not (Test-Path $setup)) { throw "release $tag`: $setupName was not downloaded to $dir" }
              if (-not (Test-Path $yml))   { throw "release $tag`: latest.yml was not downloaded to $dir" }

              $text = Get-Content -Path $yml -Raw
              Copy-Item $yml (Join-Path $EV "latest-$tag.yml") -Force
              $version = [regex]::Match($text, '(?m)^version:\s*(\S+)\s*$').Groups[1].Value
              $path    = [regex]::Match($text, '(?m)^path:\s*(\S+)\s*$').Groups[1].Value
              $sha512  = [regex]::Match($text, '(?m)^sha512:\s*(\S+)\s*$').Groups[1].Value
              $size    = [regex]::Match($text, '(?m)^\s+size:\s*(\d+)').Groups[1].Value

              Write-Host "---- latest.yml of $tag ----`n$text"
              Write-Host "latest.yml: version='$version' path='$path' size=$size"
              Write-Host "latest.yml: sha512=$sha512"

              $bytes = (Get-Item $setup).Length
              $algo = [System.Security.Cryptography.SHA512]::Create()
              $stream = [System.IO.File]::OpenRead($setup)
              try { $digest = $algo.ComputeHash($stream) } finally { $stream.Dispose(); $algo.Dispose() }
              $computed = [Convert]::ToBase64String($digest)
              Write-Host "download  : $setupName $bytes bytes"
              Write-Host "download  : sha512=$computed"
              $vi = (Get-Item $setup).VersionInfo
              Write-Host "installer VersionInfo: ProductVersion='$($vi.ProductVersion)' FileVersion='$($vi.FileVersion)'"

              if ($version -ne $wantVersion) { throw "$tag`: latest.yml version '$version' does not match the tag's app version '$wantVersion'" }
              if ($path -ne $setupName) { throw "$tag`: latest.yml path '$path' does not name the release asset '$setupName'" }
              if ([string]::IsNullOrEmpty($sha512)) { throw "$tag`: latest.yml carries no sha512" }
              if ($computed -ne $sha512) { throw "$tag`: sha512 mismatch for $setupName — release metadata and asset disagree, refusing to install" }
              if ([string]::IsNullOrEmpty($size)) { throw "$tag`: latest.yml carries no size" }
              if ($bytes -ne [int64]$size) { throw "$tag`: size mismatch for $setupName ($bytes downloaded, latest.yml says $size)" }
              Write-Host "CHECK|$tag|version+path+sha512+size agree; nothing installed yet"
          }

          Assert-AssetMetadata $env:TAG $env:EXPECTED_SETUP $env:EXPECTED_VERSION
          if ($env:FROM_TAG) {
              Assert-AssetMetadata $env:FROM_TAG $env:FROM_SETUP $env:FROM_VERSION
          }

      - name: Install on a real Windows runner, launch, and (optionally) update
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $EV = Join-Path $env:GITHUB_WORKSPACE 'qa-evidence'
          New-Item -ItemType Directory -Force -Path $EV | Out-Null
          Start-Transcript -Path (Join-Path $EV 'transcript.txt') | Out-Null

          $want   = $env:EXPECTED_VERSION
          $from   = $env:FROM_VERSION
          $settle = [int]$env:SETTLE_SECONDS
          $tagDir  = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'rel') $env:TAG
          $setup   = Join-Path $tagDir $env:EXPECTED_SETUP
          $fromDir = if ($from) { Join-Path (Join-Path $env:GITHUB_WORKSPACE 'rel') $env:FROM_TAG } else { $null }
          $fromSetup = if ($from) { Join-Path $fromDir $env:FROM_SETUP } else { $null }

          $results = [ordered]@{}
          $failures = New-Object System.Collections.Generic.List[string]

          function Log([string]$m) {
              $line = "EVID|{0}|{1}" -f (Get-Date).ToString('o'), $m
              Write-Host $line
              Add-Content -Path (Join-Path $EV 'events.log') -Value $line
          }

          # Version comparison that survives electron-builder's own normalisation:
          # the exe's ProductVersion may be the full semver ('1.12.32-plotina.46-dev.1')
          # or a numeric Windows form ('1.12.32.46'), but never a different build.
          function Get-VerTokens([string]$v) {
              @([regex]::Matches($v.ToLowerInvariant(), '[0-9]+|[a-z]+') | ForEach-Object { $_.Value })
          }
          function Compare-Ver([string]$got, [string]$wantV) {
              if ([string]::IsNullOrWhiteSpace($got)) { return 'MISSING' }
              if ($got.Trim().ToLowerInvariant() -eq $wantV.ToLowerInvariant()) { return 'EXACT' }
              $g = Get-VerTokens $got
              $w = Get-VerTokens $wantV
              if ($g.Count -ge 3 -and $g.Count -le 4 -and ($g[0..2] -join '.') -eq ($w[0..2] -join '.')) {
                  if ($g.Count -eq 3) { return 'BASE-ONLY' }
                  if ($g[3] -eq $w[4]) { return 'NUMERIC' }
                  if ($g[3] -eq '0') { return 'BASE-ZERO' }
              }
              return 'MISMATCH'
          }

          # azar/asar: uint32 payload-size, uint32 header size, header JSON, then
          # file data; offsets in the header are relative to the header's end.
          function Get-AsarPackageVersion([string]$asar) {
              $js = @'
          const fs = require('fs');
          const fd = fs.openSync(process.argv[2], 'r');
          try {
            const head = Buffer.alloc(16);
            fs.readSync(fd, head, 0, 16, 0);
            const headerSize = head.readUInt32LE(4);
            const hb = Buffer.alloc(headerSize);
            fs.readSync(fd, hb, 0, headerSize, 8);
            let txt = hb.toString('utf8');
            txt = txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1);
            const header = JSON.parse(txt);
            const entry = header.files['package.json'];
            if (!entry || entry.unpacked) throw new Error('package.json is not stored in the asar header');
            const size = Number(entry.size), off = Number(entry.offset);
            const buf = Buffer.alloc(size);
            fs.readSync(fd, buf, 0, size, 8 + headerSize + off);
            process.stdout.write(String(JSON.parse(buf.toString('utf8')).version || ''));
          } finally { fs.closeSync(fd); }
          '@
              $tmp = Join-Path $EV 'asar-version.js'
              Set-Content -Path $tmp -Value $js -Encoding utf8
              $v = (& node $tmp $asar)
              if ($LASTEXITCODE -ne 0) { throw "could not read the version out of $asar (node exit $LASTEXITCODE)" }
              return ("$v").Trim()
          }

          function Get-InstallRoot {
              $roots = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Directory -Filter 'Plotina*' -ErrorAction SilentlyContinue)
              if ($roots.Count -eq 0) { throw "no Plotina* install directory under $env:LOCALAPPDATA\Programs" }
              if ($roots.Count -gt 1) { Log "WARN several install dirs: $($roots.Name -join ', ')" }
              return $roots[0].FullName
          }

          function Assert-InstalledVersion([string]$label, [string]$wantV, [string]$exe) {
              $vi = (Get-Item $exe).VersionInfo
              $root = Split-Path $exe -Parent
              $asar = Join-Path $root 'resources\app.asar'
              if (-not (Test-Path $asar)) { throw "$label`: no resources\app.asar under $root" }
              $asarV = Get-AsarPackageVersion $asar
              $pv = Compare-Ver $vi.ProductVersion $wantV
              $fv = Compare-Ver $vi.FileVersion $wantV
              $av = Compare-Ver $asarV $wantV
              Log "$label`: ProductVersion='$($vi.ProductVersion)' ($pv) FileVersion='$($vi.FileVersion)' ($fv) app.asar version='$asarV' ($av), want '$wantV'"
              # Windows' version resource is four numeric parts, so electron-builder
              # drops the prerelease suffix there: the .46 installer's exe reports
              # ProductVersion 1.12.32.0 while FileVersion keeps the full
              # 1.12.32-plotina.46-dev.1. The tag must therefore match exactly on
              # FileVersion and inside the shipped app.asar; ProductVersion only has
              # to agree on the upstream base (it may carry the counter or a 0).
              if ($pv -eq 'MISMATCH' -or $pv -eq 'MISSING') { throw "$label`: exe ProductVersion '$($vi.ProductVersion)' does not match the tag version '$wantV' (base $($wantV.Split('-')[0]))" }
              if ($fv -ne 'EXACT') { throw "$label`: exe FileVersion '$($vi.FileVersion)' is not the tag version '$wantV'" }
              if ($av -ne 'EXACT') { throw "$label`: the shipped app.asar reports '$asarV', the tag says '$wantV'" }
              Write-Host "CHECK|version $label|ProductVersion=$pv FileVersion=EXACT app.asar=EXACT ('$asarV')"
          }

          function Snap([string]$label) {
              $ps = @(Get-Process -Name 'Plotina-Desktop' -ErrorAction SilentlyContinue)
              $d = ($ps | ForEach-Object { "pid=$($_.Id) window=$($_.MainWindowHandle) title='$($_.MainWindowTitle)' started=$($_.StartTime.ToString('o'))" }) -join '; '
              Log "SNAP $label count=$($ps.Count) $d"
              $tbl = if ($ps.Count) { ($ps | Select-Object Id, StartTime, MainWindowHandle, MainWindowTitle | Format-Table -AutoSize | Out-String) } else { "(no Plotina-Desktop process)`n" }
              Add-Content -Path (Join-Path $EV "pids-$label.txt") -Value ("# $label @ $(Get-Date -Format o)`n" + $tbl)
              return ,$ps
          }

          function Wait-Exit([int]$procId, [int]$sec) {
              $dl = (Get-Date).AddSeconds($sec)
              while ((Get-Date) -lt $dl) {
                  if (-not (Get-Process -Id $procId -ErrorAction SilentlyContinue)) { return $true }
                  Start-Sleep 2
              }
              return $false
          }

          function Wait-Windowed([int]$sec, [int]$exclude) {
              $dl = (Get-Date).AddSeconds($sec)
              while ((Get-Date) -lt $dl) {
                  $p = @(Get-Process -Name 'Plotina-Desktop' -ErrorAction SilentlyContinue |
                         Where-Object { $_.MainWindowHandle -ne 0 -and $_.Id -ne $exclude })
                  if ($p.Count -ge 1) { return $p[0] }
                  Start-Sleep 2
              }
              return $null
          }

          function Shot([string]$name, [int]$procId) {
              try {
                  if ($procId) { try { [Microsoft.VisualBasic.Interaction]::AppActivate($procId) | Out-Null; Start-Sleep 2 } catch { Log "SCREENSHOT could not activate pid $procId`: $($_.Exception.Message)" } }
                  Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                  $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                  $b = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
                  $g = [System.Drawing.Graphics]::FromImage($b)
                  $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
                  $path = Join-Path $EV "$name.png"
                  $b.Save($path, [System.Drawing.Imaging.ImageFormat]::Png)
                  $g.Dispose(); $b.Dispose()
                  Log "SCREENSHOT $name.png saved ($((Get-Item $path).Length) bytes, $($bounds.Width)x$($bounds.Height))"
              } catch {
                  Log "SCREENSHOT $name FAILED (best effort on a headless runner): $($_.Exception.Message)"
              }
          }

          function KillAll([string]$why) {
              Log "KILLALL $why"
              & taskkill /IM Plotina-Desktop.exe /F /T 2>&1 | ForEach-Object { Log "  $_" }
              Start-Sleep 3
          }

          # Named parameters on purpose: an empty @() passed positionally unrolls
          # to nothing, which would shift extra argv into $label.
          function Install-Silent {
              param([string]$setupPath, [string[]]$extra = @(), [string]$label)
              if (-not (Test-Path $setupPath)) { throw "$label`: installer $setupPath is missing" }
              $argv = @('/S') + $extra
              Log "INSTALL $label argv='$($argv -join ' ')' file=$setupPath"
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $p = Start-Process -FilePath $setupPath -ArgumentList $argv -Wait -PassThru
              $sw.Stop()
              Log "INSTALL $label exit=$($p.ExitCode) elapsed=$([int]$sw.Elapsed.TotalSeconds)s"
              if ($p.ExitCode -ne 0) { throw "$label`: installer exited with $($p.ExitCode)" }
          }

          function Launch-And-Window([string]$appExe, [int]$timeoutSec) {
              $p = Start-Process -FilePath $appExe -PassThru
              Log "LAUNCH started pid=$($p.Id) exe=$appExe"
              $w = Wait-Windowed $timeoutSec 0
              if (-not $w) { Snap 'no-window' | Out-Null; throw "no Plotina-Desktop window appeared within $timeoutSec s of launching $appExe" }
              Log "WINDOW pid=$($w.Id) handle=$($w.MainWindowHandle) title='$($w.MainWindowTitle)'"
              return $w
          }

          function Assert-Survives([int]$procId, [string]$label) {
              Start-Sleep $settle
              $p = Get-Process -Id $procId -ErrorAction SilentlyContinue
              if (-not $p) {
                  $crashes = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'CrashDumps') -Filter 'Plotina*' -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 3)
                  foreach ($c in $crashes) { Log "CRASHDMP $($c.Name) $($c.LastWriteTime.ToString('o'))" }
                  throw "$label`: pid $procId is gone ${settle}s after launch (crash?)"
              }
              if ($p.MainWindowHandle -eq 0) { throw "$label`: pid $procId still runs but has no window after ${settle}s" }
              Log "SURVIVED $label pid=$procId after ${settle}s window=$($p.MainWindowHandle) title='$($p.MainWindowTitle)'"
          }

          function Copy-AppLogs {
              foreach ($d in @((Join-Path $env:APPDATA 'Plotina Desktop'), (Join-Path $env:APPDATA 'plotina-desktop'))) {
                  if (Test-Path $d) {
                      $logs = Get-ChildItem $d -Recurse -Include *.log -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 2
                      foreach ($l in $logs) { Copy-Item $l.FullName (Join-Path $EV ("applog-" + $l.Name)) -ErrorAction SilentlyContinue; Log "APPCOPY $($l.FullName)" }
                      return
                  }
              }
              Log "APPCOPY no app log dir found"
          }

          $hardFail = $null
          try {
              Log "BEGIN tag=$($env:TAG) version=$want settle=${settle}s"
              Log "BEGIN from_tag=$($env:FROM_TAG) from_version=$from"
              Log "installer=$setup ($([math]::Round((Get-Item $setup).Length / 1MB)) MB)"
              KillAll 'pre-clean'

              if ($from) {
                  # ---- update mode: install the OLD release, then update to the new one ----
                  Install-Silent -setupPath $fromSetup -label "from_tag $from"
                  $root = Get-InstallRoot
                  Log "INSTALL ROOT $root"
                  $appExe = Join-Path $root 'Plotina-Desktop.exe'
                  Assert-InstalledVersion "installed $from (from_tag)" $from $appExe
                  $results['from_tag_installed'] = "PASS — $from from $env:FROM_TAG (exe + app.asar agree)"

                  $old = Launch-And-Window $appExe 180
                  $oldPid = $old.Id
                  Shot '01-from-tag-window' $oldPid
                  Snap 'before-update' | Out-Null
                  $results['from_tag_launched'] = "PASS — old pid $oldPid, window '$($old.MainWindowTitle)'"
                  Start-Sleep 10

                  $t0 = Get-Date
                  Install-Silent -setupPath $setup -extra @('--updated', '--force-run') -label "update to $want"
                  $gone = Wait-Exit $oldPid 240
                  Log "UPDATE old_pid=$oldPid exited=$gone (installer started $($t0.ToString('o')))"
                  if (-not $gone) { Snap 'old-pid-stuck' | Out-Null; throw "old pid $oldPid is still alive 240s after the update installer ran" }
                  $results['old_process_exited'] = "PASS — pid $oldPid gone"

                  $new = Wait-Windowed 240 $oldPid
                  if (-not $new) { Snap 'no-new-window' | Out-Null; throw "no new windowed Plotina-Desktop process appeared after the update (auto-restart did not happen)" }
                  Log "UPDATE new_pid=$($new.Id) handle=$($new.MainWindowHandle) title='$($new.MainWindowTitle)' started=$($new.StartTime.ToString('o'))"
                  $results['new_process_relaunched'] = "PASS — new pid $($new.Id) with a window, old pid $oldPid gone"
                  Assert-Survives $new.Id 'updated app'
                  $results['updated_app_survives'] = "PASS — pid $($new.Id) alive with a window ${settle}s after the restart"
                  Shot '02-updated-window' $new.Id
                  Snap 'after-update' | Out-Null
                  Assert-InstalledVersion "installed $want after update" $want $appExe
                  $results['update_version_matches_tag'] = "PASS — $want installed by the update"
              } else {
                  # ---- fresh mode: install this release and prove it starts ----
                  Install-Silent -setupPath $setup -label "fresh $want"
                  $root = Get-InstallRoot
                  Log "INSTALL ROOT $root"
                  $appExe = Join-Path $root 'Plotina-Desktop.exe'
                  Assert-InstalledVersion "installed $want" $want $appExe
                  $results['release_installed'] = "PASS — $want installed from $env:EXPECTED_SETUP"

                  $w = Launch-And-Window $appExe 180
                  Shot '01-fresh-window' $w.Id
                  Snap 'after-launch' | Out-Null
                  Assert-Survives $w.Id 'fresh app'
                  $results['app_window_opens'] = "PASS — pid $($w.Id), window '$($w.MainWindowTitle)'"
                  $results['app_survives'] = "PASS — alive with a window ${settle}s after launch"
                  Shot '02-fresh-window-after-settle' $w.Id
              }

              Copy-AppLogs
          } catch {
              $hardFail = $_
              Log "FAIL $($_.Exception.Message)"
              $results['verdict'] = "FAIL — $($_.Exception.Message)"
          } finally {
              KillAll 'final-cleanup'
              Snap 'final' | Out-Null
              try { Stop-Transcript | Out-Null } catch { }

              $lines = New-Object System.Collections.Generic.List[string]
              $lines.Add('# Windows release-installer QA')
              $lines.Add('')
              $lines.Add("- tag: ``$($env:TAG)`` -> app version ``$want``")
              if ($from) { $lines.Add("- from_tag: ``$($env:FROM_TAG)`` -> app version ``$from`` (update path)") }
              else { $lines.Add('- from_tag: not set (fresh install only)') }
              $lines.Add("- installer: ``$($env:EXPECTED_SETUP)``")
              $lines.Add("- liveness window: ${settle}s")
              $lines.Add('')
              $lines.Add('## Checks')
              $lines.Add('')
              foreach ($k in $results.Keys) { $lines.Add("- **$($k)**: $($results[$k])") }
              if (-not $results.Contains('verdict')) { $lines.Add('- **verdict**: PASS') }
              $lines.Add('')
              $lines.Add('Evidence in this artifact: `events.log` (timestamped EVID lines), `pids-*.txt` (process tables), `transcript.txt` (full step log), `latest-*.yml` (published metadata), `*.png` (window screenshots, best effort on a headless runner).')
              Set-Content -Path (Join-Path $EV 'qa-summary.md') -Value ($lines -join "`n") -Encoding utf8
          }

          if ($hardFail) { throw $hardFail }

      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          $EV = Join-Path $env:GITHUB_WORKSPACE 'qa-evidence'
          foreach ($f in @('qa-summary.md', 'events.log')) {
              $p = Join-Path $EV $f
              if (Test-Path $p) {
                  "`n### $f`n" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
                  if ($f -like '*.md') { (Get-Content $p -Raw) | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY }
                  else { "``````" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY; (Get-Content $p -Raw) | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY; "``````" | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY }
              }
          }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-release-evidence-${{ inputs.tag }}
          path: qa-evidence/
          if-no-files-found: warn
          retention-days: 30
  # ---------------------------------------------------------------------------
  # QA branch mode (`artifact_run_id`): verify a BRANCH build on a real Windows
  # runner instead of a published release - the release path above installs the
  # published asset only. This job installs the NSIS package built from a branch
  # by build-element-desktop.yml (artifact of the given run, provenance checked
  # against expected_sha), proves every protocol scheme is registered AND opens
  # the app, uninstalls it, then asserts: the scheme keys are gone (and nothing
  # under HKCU\Software\Classes still names the removed directory), the user
  # profile survived, shortcuts and the Programs-and-features entry are gone, and
  # no process is left hanging. Nothing is published: the only write is the
  # evidence artifact.
  #
  # This job exists only on the QA branch; qa-windows-release.yml on the default
  # branch stays the release harness.
  windows-uninstall:
    name: windows branch uninstall QA
    if: inputs.artifact_run_id != ''
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Download the branch-built installer and prove its provenance
        shell: pwsh
        env:
          RUN_ID: ${{ inputs.artifact_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $EV = Join-Path $env:GITHUB_WORKSPACE 'qa-evidence-uninstall'
          New-Item -ItemType Directory -Force -Path $EV | Out-Null
          $log = Join-Path $EV 'events.log'

          function Check([string]$id, [bool]$ok, [string]$detail) {
              $verdict = if ($ok) { 'PASS' } else { 'FAIL' }
              $line = 'CHECK|{0}|{1}|{2}' -f $id, $verdict, $detail
              Write-Host $line
              Add-Content -Path $log -Value $line
          }

          $runId = $env:RUN_ID
          $wantSha = $env:EXPECTED_SHA
          if (-not $runId) { throw 'artifact_run_id is empty' }

          $meta = (gh run view $runId --repo $env:GITHUB_REPOSITORY --json headSha,headBranch,workflowName,conclusion,event,displayTitle,url,jobs | ConvertFrom-Json)
          $meta | ConvertTo-Json -Depth 4 | Set-Content -Path (Join-Path $EV 'run-provenance.json') -Encoding utf8
          # A negative-control run is dispatched from a base commit whose OTHER jobs may
          # legitimately fail (a branch dispatch of main dies in the deb branding step), so
          # the artefact is vouched for by the `windows` build job, not by the run verdict.
          $winJob = @($meta.jobs | Where-Object { $_.name -eq 'windows' })
          $buildOk = if ($winJob.Count -gt 0) { $winJob[0].conclusion -eq 'success' } else { $meta.conclusion -eq 'success' }
          $desc = 'run={0} workflow={1} branch={2} sha={3} runConclusion={4} windowsJob={5} event={6}' -f $runId, $meta.workflowName, $meta.headBranch, $meta.headSha, $meta.conclusion, ($winJob[0].conclusion -replace '^$', '(absent)'), $meta.event
          Write-Host $desc
          Check 'artifact:provenance' ($buildOk -and ($wantSha -eq '' -or $meta.headSha -eq $wantSha)) $desc
          if (-not $buildOk) { throw ('run ' + $runId + ' has no successful windows build job') }
          if ($wantSha -and ($meta.headSha -ne $wantSha)) { throw ('run ' + $runId + ' built ' + $meta.headSha + ', expected ' + $wantSha) }

          gh run download $runId --repo $env:GITHUB_REPOSITORY -n plotina-desktop-windows -D pkg
          $setups = @(Get-ChildItem 'pkg' -Filter 'Plotina-Desktop-*-setup.exe' -File)
          if ($setups.Count -ne 1) { throw ('artifact should carry exactly one versioned setup exe, found ' + $setups.Count) }
          $setup = $setups[0]

          $latest = Get-Content (Join-Path 'pkg' 'latest.yml') -Raw
          Copy-Item (Join-Path 'pkg' 'latest.yml') (Join-Path $EV 'latest.yml') -Force
          $version = [regex]::Match($latest, '(?m)^version:\s*(\S+)\s*$').Groups[1].Value
          $path = [regex]::Match($latest, '(?m)^path:\s*(\S+)\s*$').Groups[1].Value
          $sha512 = [regex]::Match($latest, '(?m)^sha512:\s*(\S+)\s*$').Groups[1].Value
          $size = [regex]::Match($latest, '(?m)^\s+size:\s*(\d+)').Groups[1].Value

          $algo = [System.Security.Cryptography.SHA512]::Create()
          $stream = [System.IO.File]::OpenRead($setup.FullName)
          try { $digest = $algo.ComputeHash($stream) } finally { $stream.Dispose(); $algo.Dispose() }
          $computed = [Convert]::ToBase64String($digest)
          $bytes = (Get-Item $setup.FullName).Length
          $vi = (Get-Item $setup.FullName).VersionInfo

          $detail = 'version={0} path={1} setup={2} bytes={3} sha512match={4} FileVersion={5}' -f $version, $path, $setup.Name, $bytes, ($computed -eq $sha512), $vi.FileVersion
          Write-Host $detail
          Write-Host ('latest.yml sha512=' + $sha512)
          Write-Host ('computed   sha512=' + $computed)
          Check 'artifact:sha512' (($computed -eq $sha512) -and ($bytes -eq [int64]$size) -and ($path -eq $setup.Name)) $detail

      - name: Install, exercise the protocol schemes, uninstall, verify
        id: uninst
        continue-on-error: true
        shell: pwsh
        env:
          RUN_ID: ${{ inputs.artifact_run_id }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false

          $EV = Join-Path $env:GITHUB_WORKSPACE 'qa-evidence-uninstall'
          New-Item -ItemType Directory -Force -Path $EV | Out-Null
          Start-Transcript -Path (Join-Path $EV 'transcript.txt') | Out-Null
          $log = Join-Path $EV 'events.log'
          $script:failures = New-Object System.Collections.Generic.List[string]

          function Log([string]$m) {
              $line = 'EVID|{0}|{1}' -f (Get-Date).ToString('o'), $m
              Write-Host $line
              Add-Content -Path $log -Value $line
          }
          function Check([string]$id, [bool]$ok, [string]$detail) {
              $verdict = if ($ok) { 'PASS' } else { 'FAIL' }
              $line = 'CHECK|{0}|{1}|{2}' -f $id, $verdict, $detail
              Write-Host $line
              Add-Content -Path $log -Value $line
              if (-not $ok) { $script:failures.Add(($id + ': ' + $detail)) }
          }
          function RegQuery([string]$key) {
              return (& reg.exe query $key /s 2>&1 | Out-String)
          }
          function RegDefaultOf([string]$key) {
              $out = (& reg.exe query $key /ve 2>&1 | Out-String)
              $m = [regex]::Match($out, '(?m)^\s+\(Default\)\s+REG_[A-Z_]+\s+(.*?)\s*$')
              if ($m.Success) { return $m.Groups[1].Value } else { return '' }
          }
          function SchemeState([string]$scheme) {
              $key = 'HKCU:\Software\Classes\' + $scheme
              $cmdKey = $key + '\shell\open\command'
              $hasKey = Test-Path $key
              $hasCmd = Test-Path $cmdKey
              $cmd = ''
              if ($hasCmd) { $cmd = RegDefaultOf ('HKCU\Software\Classes\{0}\shell\open\command' -f $scheme) }
              return [pscustomobject]@{ Scheme = $scheme; KeyExists = $hasKey; CommandExists = $hasCmd; Command = $cmd }
          }
          function Kill-App {
              $procs = @(Get-Process -Name 'Plotina-Desktop' -ErrorAction SilentlyContinue)
              if ($procs.Count -gt 0) {
                  Log ('KILL ' + (($procs | ForEach-Object { $_.Id }) -join ','))
                  & taskkill.exe /IM Plotina-Desktop.exe /F /T 2>&1 | ForEach-Object { Log ('  ' + $_) }
                  $deadline = (Get-Date).AddSeconds(30)
                  while ((Get-Date) -lt $deadline) {
                      if (@(Get-Process -Name 'Plotina-Desktop' -ErrorAction SilentlyContinue).Count -eq 0) { break }
                      Start-Sleep -Seconds 2
                  }
              }
          }
          function Wait-Window([int]$seconds) {
              $deadline = (Get-Date).AddSeconds($seconds)
              while ((Get-Date) -lt $deadline) {
                  $p = @(Get-Process -Name 'Plotina-Desktop' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })
                  if ($p.Count -ge 1) { return $p[0] }
                  Start-Sleep -Seconds 2
              }
              return $null
          }
          function Shot([string]$name) {
              try {
                  Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                  $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
                  $b = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
                  $g = [System.Drawing.Graphics]::FromImage($b)
                  $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
                  $b.Save((Join-Path $EV ($name + '.png')), [System.Drawing.Imaging.ImageFormat]::Png)
                  $g.Dispose(); $b.Dispose()
                  Log ('SCREENSHOT ' + $name + '.png')
              } catch { Log ('SCREENSHOT ' + $name + ' failed: ' + $_.Exception.Message) }
          }

          $schemes = @('element', 'io.element.desktop', 'cc.plotina.element')
          $lnkDirs = @(
              (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs'),
              (Join-Path $env:USERPROFILE 'Desktop'),
              (Join-Path $env:PUBLIC 'Desktop')
          )
          $uninstallRoots = @(
              'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall',
              'HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )

          function Get-PlotinaLnk {
              $res = @()
              foreach ($d in $lnkDirs) {
                  if (-not (Test-Path $d)) { continue }
                  $res += @(Get-ChildItem $d -Filter '*.lnk' -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'Plotina|Element' })
              }
              return $res
          }
          function Get-PlotinaPrograms {
              $res = @()
              foreach ($r in $uninstallRoots) {
                  if (-not (Test-Path $r)) { continue }
                  foreach ($k in @(Get-ChildItem $r -ErrorAction SilentlyContinue)) {
                      $dn = $null
                      try { $dn = (Get-ItemProperty -Path $k.PSPath -ErrorAction SilentlyContinue).DisplayName } catch { }
                      if ($dn -and ($dn -match 'Plotina|Element')) {
                          $res += [pscustomobject]@{ Path = $k.PSPath; DisplayName = $dn }
                      }
                  }
              }
              return $res
          }
          function Write-List([string]$file, [object[]]$items) {
              $text = if ($items.Count -gt 0) { (($items | ForEach-Object { if ($_ -is [string]) { $_ } else { $_.FullName } }) -join "`n") } else { '(none)' }
              Set-Content -Path (Join-Path $EV $file) -Value $text -Encoding utf8
          }

          $hardFail = $null
          try {
              # ---------- 1. install ----------
              $setups = @(Get-ChildItem 'pkg' -Filter 'Plotina-Desktop-*-setup.exe' -File)
              if ($setups.Count -ne 1) { throw ('expected exactly one setup exe in pkg, found ' + $setups.Count) }
              $setup = $setups[0]
              Log ('INSTALLER ' + $setup.Name + ' ' + $setup.Length + ' bytes')
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $proc = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
              $sw.Stop()
              Check 'install:exit' ($proc.ExitCode -eq 0) ('exit=' + $proc.ExitCode + ' elapsed=' + [int]$sw.Elapsed.TotalSeconds + 's')

              $roots = @(Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Directory -Filter 'Plotina*' -ErrorAction SilentlyContinue)
              Check 'install:dir' ($roots.Count -eq 1) ('install dirs: ' + (($roots | ForEach-Object { $_.Name }) -join ', '))
              if ($roots.Count -eq 0) { throw 'no Plotina* install dir under %LOCALAPPDATA%\Programs; nothing to exercise' }
              $root = $roots[0].FullName
              Log ('INSTALL ROOT ' + $root)
              $exe = Join-Path $root 'Plotina-Desktop.exe'
              Check 'install:exe' (Test-Path $exe) $exe
              $vi = (Get-Item $exe).VersionInfo
              Check 'install:version' (-not [string]::IsNullOrWhiteSpace($vi.FileVersion)) ('FileVersion=' + $vi.FileVersion + ' ProductVersion=' + $vi.ProductVersion)

              $uninstallers = @(Get-ChildItem $root -Filter 'Uninstall*.exe' -File -ErrorAction SilentlyContinue)
              Check 'install:uninstaller' ($uninstallers.Count -ge 1) (($uninstallers | ForEach-Object { $_.Name }) -join ', ')
              if ($uninstallers.Count -eq 0) { throw ('no Uninstall*.exe in ' + $root) }
              $uninst = $uninstallers[0]

              # ---------- 2. who removes the keys? ----------
              # NSIS compresses the uninstaller payload, so the hook's DetailPrint strings
              # are not greppable in the exe (probe below) - that proves nothing either way.
              # Attribution rests on two measurements instead: the installer writes NO
              # protocol keys at install time (logged below), so electron-builder's own
              # uninstaller has nothing to unregister, and the runtime keys that appear
              # after the first launch are gone after the uninstall anyway. The
              # negative-control run of this harness on the unfixed base build shows what
              # the same steps produce without the hook.
              $bytes = [IO.File]::ReadAllBytes($uninst.FullName)
              $even = $bytes.Length - ($bytes.Length % 2)
              $blobs = @(
                  [Text.Encoding]::ASCII.GetString($bytes),
                  [Text.Encoding]::Unicode.GetString($bytes, 0, $even),
                  [Text.Encoding]::Unicode.GetString($bytes, 1, $even - 2)
              )
              $found = @($schemes | Where-Object { $n = $_; @($blobs | Where-Object { $_.Contains($n) }).Count -gt 0 })
              Log ('UNINSTALLER ' + $uninst.Name + ' ' + $bytes.Length + ' bytes; scheme names greppable in the payload: ' + (($found -join ', ') -replace '^$', '(none)') + ' (NSIS compresses its payload, so absence is expected)')

              # ---------- 3. state right after the install ----------
              foreach ($s in $schemes) {
                  $st = SchemeState $s
                  Set-Content -Path (Join-Path $EV ('registry-after-install-' + $s + '.txt')) -Value ('== HKCU\Software\Classes\' + $s + "`n" + (RegQuery ('HKCU\Software\Classes\' + $s))) -Encoding utf8
                  Log ('PROTOCOL after install ' + $s + ' key=' + $st.KeyExists + ' command=' + $st.Command)
              }

              # ---------- 4. first launch: the app registers its schemes at startup ----------
              $p = Start-Process -FilePath $exe -PassThru
              Log ('LAUNCH ' + $exe + ' pid=' + $p.Id)
              $w = Wait-Window 180
              if ($null -eq $w) {
                  Check 'app:launch' $false 'no Plotina-Desktop window within 180s of a plain launch'
                  throw 'the installed app never opened a window, so the runtime protocol keys cannot be produced'
              }
              Check 'app:launch' $true ('pid=' + $w.Id + ' title=' + $w.MainWindowTitle)
              Shot '01-installed-window'

              # ---------- 5. user profile data that must SURVIVE the uninstall ----------
              $dataDirs = @()
              foreach ($base in @($env:APPDATA, $env:LOCALAPPDATA)) {
                  $dataDirs += @(Get-ChildItem $base -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'Plotina|Element' -and $_.FullName -notmatch '\\Programs\\' })
              }
              $dataBefore = @()
              foreach ($d in $dataDirs) {
                  $marker = Join-Path $d.FullName 'qa-uninstall-marker.txt'
                  Set-Content -Path $marker -Value ('qa marker written before the uninstall at ' + (Get-Date).ToString('o')) -Encoding utf8
                  $files = @(Get-ChildItem $d.FullName -Recurse -File -ErrorAction SilentlyContinue)
                  $sum = ($files | Measure-Object -Property Length -Sum).Sum
                  if ($null -eq $sum) { $sum = 0 }
                  $dataBefore += [pscustomobject]@{ Path = $d.FullName; Files = $files.Count; Bytes = [int64]$sum; Marker = (Test-Path $marker) }
              }
              $dataText = ($dataBefore | ForEach-Object { '{0} files={1} bytes={2} marker={3}' -f $_.Path, $_.Files, $_.Bytes, $_.Marker }) -join "`n"
              Set-Content -Path (Join-Path $EV 'userdata-before.txt') -Value ($dataText -replace '^$', '(none)') -Encoding utf8
              Check 'keep:userdata-found' ($dataBefore.Count -ge 1) (($dataBefore | ForEach-Object { $_.Path }) -join ' | ')

              # ---------- 6. shortcuts and the Programs-and-features entry before the uninstall ----------
              $lnkBefore = @(Get-PlotinaLnk)
              Write-List 'shortcuts-before.txt' $lnkBefore
              Log ('SHORTCUTS before: ' + (($lnkBefore | ForEach-Object { $_.FullName }) -join ' | '))
              $progBefore = @(Get-PlotinaPrograms)
              Set-Content -Path (Join-Path $EV 'programs-before.txt') -Value (($progBefore | ForEach-Object { '{0}  [{1}]' -f $_.DisplayName, $_.Path }) -join "`n") -Encoding utf8
              Log ('PROGRAMS before: ' + (($progBefore | ForEach-Object { $_.DisplayName }) -join ' | '))
              Check 'install:programs-entry' ($progBefore.Count -ge 1) (($progBefore | ForEach-Object { $_.DisplayName }) -join ' | ')

              # ---------- 7. every scheme is registered AND opens the app ----------
              foreach ($s in $schemes) {
                  $st = SchemeState $s
                  $into = ($st.Command -ne '') -and ($st.Command -like ('*' + $root + '*'))
                  Log ('PROTOCOL before uninstall ' + $s + ' key=' + $st.KeyExists + ' command=' + $st.Command)
                  Check ('protocol:registry:' + $s) ($st.CommandExists -and $into) ('key=' + $st.KeyExists + ' command=' + $st.Command)
                  Set-Content -Path (Join-Path $EV ('registry-before-uninstall-' + $s + '.txt')) -Value ('== HKCU\Software\Classes\' + $s + "`n" + (RegQuery ('HKCU\Software\Classes\' + $s))) -Encoding utf8

                  if (-not $st.CommandExists) {
                      Check ('protocol:launch:' + $s) $false ('scheme is not registered at all (no HKCU\Software\Classes\' + $s + '\shell\open\command), so it cannot open the app')
                      continue
                  }
                  Kill-App
                  Start-Sleep -Seconds 2
                  $uri = $s + '://plotina.test/qa-registration'
                  Log ('PROTOCOL launch ' + $uri)
                  $err = ''
                  try { Start-Process $uri | Out-Null } catch { $err = $_.Exception.Message }
                  if ($err -ne '') {
                      Check ('protocol:launch:' + $s) $false ('Start-Process ' + $uri + ' failed: ' + $err)
                      continue
                  }
                  $win = Wait-Window 180
                  if ($null -eq $win) {
                      Check ('protocol:launch:' + $s) $false ('no Plotina-Desktop window within 180s of ' + $uri)
                  } else {
                      Check ('protocol:launch:' + $s) $true ('pid=' + $win.Id + ' title=' + $win.MainWindowTitle + ' via ' + $uri)
                      Shot ('02-scheme-' + ($s -replace '[^A-Za-z0-9]', '_'))
                  }
              }

              # ---------- 8. uninstall ----------
              Kill-App
              Start-Sleep -Seconds 3
              Log ('UNINSTALL ' + $uninst.FullName + ' /S /currentuser')
              $up = Start-Process -FilePath $uninst.FullName -ArgumentList '/S', '/currentuser' -Wait -PassThru
              Check 'uninstall:exit' ($up.ExitCode -eq 0) ('exit=' + $up.ExitCode)
              $deadline = (Get-Date).AddSeconds(300)
              while ((Test-Path $root) -and ((Get-Date) -lt $deadline)) { Start-Sleep -Seconds 2 }
              Start-Sleep -Seconds 5
              Check 'uninstall:installdir-gone' (-not (Test-Path $root)) $root

              # ---------- 9. protocol keys after the uninstall ----------
              foreach ($s in $schemes) {
                  $st = SchemeState $s
                  Set-Content -Path (Join-Path $EV ('registry-after-uninstall-' + $s + '.txt')) -Value ('== HKCU\Software\Classes\' + $s + "`n" + (RegQuery ('HKCU\Software\Classes\' + $s))) -Encoding utf8
                  $stale = ($st.Command -ne '') -and ($st.Command -like ('*' + $root + '*'))
                  Log ('PROTOCOL after uninstall ' + $s + ' key=' + $st.KeyExists + ' command=' + $st.Command)
                  Check ('uninstall:registry:' + $s) (-not $stale) ('keyExists=' + $st.KeyExists + ' commandExists=' + $st.CommandExists + ' command=' + $st.Command)
              }
              # Every class under HKCU\Software\Classes whose shell\open\command still
              # points into the removed install dir would be a handler for a deleted exe.
              $staleKeys = @()
              $scanned = 0
              foreach ($cls in @(Get-ChildItem 'HKCU:\Software\Classes' -ErrorAction SilentlyContinue)) {
                  $cmdPath = $cls.PSPath + '\shell\open\command'
                  if (-not (Test-Path $cmdPath)) { continue }
                  $scanned++
                  $cmd = $null
                  try { $cmd = (Get-ItemProperty -Path $cmdPath -ErrorAction SilentlyContinue).'(default)' } catch { }
                  if ($cmd -and ($cmd -like ('*' + $root + '*'))) { $staleKeys += ($cls.PSChildName + ' -> ' + $cmd) }
              }
              Set-Content -Path (Join-Path $EV 'registry-scan-classes.txt') -Value ('classes with shell\open\command: ' + $scanned + "`n" + (($staleKeys -join "`n") -replace '^$', '(none point into the removed install dir)')) -Encoding utf8
              Check 'uninstall:no-stale-command-in-classes' ($staleKeys.Count -eq 0) ('scanned ' + $scanned + ' class handlers; stale: ' + (($staleKeys -join ' ; ') -replace '^$', '(none)'))
              # The shell's display-name cache for the exe path is not a protocol handler.
              $mui = (& reg.exe query 'HKCU\Software\Classes\Local Settings\Software\Microsoft\Windows\Shell\MuiCache' /s /f $root 2>&1 | Out-String)
              Set-Content -Path (Join-Path $EV 'registry-muicache.txt') -Value $mui -Encoding utf8
              Log ('MUICACHE leftovers naming the removed exe (harmless shell cache, not a handler): ' + ((@($mui -split "`r?`n" | Where-Object { $_ -match [regex]::Escape($root) }) -join ' ; ') -replace '^$', '(none)'))

              # A scheme with no handler must not start anything any more. ShellExecute can
              # sit on a shell dialog forever (observed: 19 min), so the launch runs in a
              # job we abandon after 30s.
              $stillOpens = $false
              $uriAfter = 'element://plotina.test/qa-after-uninstall'
              $job = Start-Job -ScriptBlock { param($u) try { Start-Process $u | Out-Null; 'returned' } catch { 'threw: ' + $_.Exception.Message } } -ArgumentList $uriAfter
              if (Wait-Job $job -Timeout 30) {
                  Log ('PROTOCOL post-uninstall launch: ' + ((Receive-Job $job) -join ' '))
              } else {
                  Log 'PROTOCOL post-uninstall launch did not return within 30s (no handler; abandoned)'
                  Stop-Job $job -ErrorAction SilentlyContinue
              }
              Remove-Job $job -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 5
              $w2 = @(Get-Process -Name 'Plotina-Desktop' -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowHandle -ne 0 })
              if ($w2.Count -gt 0) { $stillOpens = $true }
              Check 'uninstall:scheme-has-no-handler' (-not $stillOpens) 'no Plotina-Desktop window appeared for element:// after the uninstall'
              Shot '03-after-uninstall'

              # ---------- 10. nothing extra was deleted ----------
              $dataAfter = @()
              foreach ($rec in $dataBefore) {
                  $exists = Test-Path $rec.Path
                  $files = 0
                  $size = 0
                  if ($exists) {
                      $f = @(Get-ChildItem $rec.Path -Recurse -File -ErrorAction SilentlyContinue)
                      $files = $f.Count
                      $sum = ($f | Measure-Object -Property Length -Sum).Sum
                      if ($null -eq $sum) { $sum = 0 }
                      $size = [int64]$sum
                  }
                  $dataAfter += [pscustomobject]@{ Path = $rec.Path; Exists = $exists; Files = $files; Bytes = $size; BeforeFiles = $rec.Files; BeforeBytes = $rec.Bytes; Marker = ($exists -and (Test-Path (Join-Path $rec.Path 'qa-uninstall-marker.txt'))) }
              }
              Set-Content -Path (Join-Path $EV 'userdata-after.txt') -Value (($dataAfter | ForEach-Object { '{0} exists={1} files={2} bytes={3} marker={4}' -f $_.Path, $_.Exists, $_.Files, $_.Bytes, $_.Marker }) -join "`n") -Encoding utf8
              $missing = @($dataAfter | Where-Object { -not $_.Exists })
              $kept = @($dataAfter | Where-Object { $_.Exists })
              Check 'keep:userdata-dirs' ($missing.Count -eq 0) ('missing: ' + ((($missing | ForEach-Object { $_.Path }) -join ' | ') -replace '^$', '(none)') + ' ; kept: ' + (($kept | ForEach-Object { $_.Path }) -join ' | '))
              $noMarker = @($dataAfter | Where-Object { -not $_.Marker })
              Check 'keep:userdata-marker' ($noMarker.Count -eq 0) (($noMarker | ForEach-Object { $_.Path }) -join ' | ')
              $lostFiles = @($dataAfter | Where-Object { $_.Exists -and ($_.Files -lt $_.BeforeFiles) })
              Check 'keep:userdata-content' ($lostFiles.Count -eq 0) (($dataAfter | ForEach-Object { '{0} files {1}->{2}' -f $_.Path, $_.BeforeFiles, $_.Files }) -join ' | ')

              # ---------- 11. shortcuts, Programs-and-features, processes ----------
              $lnkAfter = @(Get-PlotinaLnk)
              Write-List 'shortcuts-after.txt' $lnkAfter
              Check 'uninstall:shortcuts-gone' ($lnkAfter.Count -eq 0) ((($lnkAfter | ForEach-Object { $_.FullName }) -join ' | ') -replace '^$', '(no Plotina shortcut left)')
              $progAfter = @(Get-PlotinaPrograms)
              Set-Content -Path (Join-Path $EV 'programs-after.txt') -Value (($progAfter | ForEach-Object { '{0}  [{1}]' -f $_.DisplayName, $_.Path }) -join "`n") -Encoding utf8
              Check 'uninstall:programs-entry-gone' ($progAfter.Count -eq 0) ((($progAfter | ForEach-Object { $_.DisplayName }) -join ' | ') -replace '^$', '(no Plotina entry left in HKCU/HKLM Uninstall)')

              Start-Sleep -Seconds 5
              $left = @(Get-Process -Name 'Plotina-Desktop' -ErrorAction SilentlyContinue)
              Check 'uninstall:no-process' ($left.Count -eq 0) ('pids=' + (($left | ForEach-Object { $_.Id }) -join ',') -replace '^pids=$', '(no Plotina-Desktop process)')
              $unProcs = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -match '^(Au_|Un_A|Uninstall)' })
              Check 'uninstall:no-uninstaller-process' ($unProcs.Count -eq 0) (($unProcs | ForEach-Object { $_.ProcessName + '(' + $_.Id + ')' }) -join ',')
          } catch {
              $hardFail = $_
              Log ('HARD FAIL ' + $_.Exception.Message)
          } finally {
              try { Kill-App } catch { }
              $lines = New-Object System.Collections.Generic.List[string]
              $lines.Add('# Windows uninstall protocol-key QA (branch artifact)')
              $lines.Add('')
              $lines.Add('- artifact run: ' + $env:RUN_ID + ' (sha ' + $env:EXPECTED_SHA + ')')
              $lines.Add('- checks failed: ' + $script:failures.Count)
              if ($hardFail) { $lines.Add('- hard failure: ' + $hardFail.Exception.Message) }
              foreach ($f in $script:failures) { $lines.Add('- FAIL ' + $f) }
              Set-Content -Path (Join-Path $EV 'verdict.txt') -Value ($lines -join "`n") -Encoding utf8
              try { Stop-Transcript | Out-Null } catch { }
          }

          if ($hardFail) { throw $hardFail }
          if ($script:failures.Count -gt 0) { throw ('uninstall QA checks failed: ' + ($script:failures -join '; ')) }

      - name: Job summary
        if: always()
        shell: pwsh
        run: |
          $EV = Join-Path $env:GITHUB_WORKSPACE 'qa-evidence-uninstall'
          $p = Join-Path $EV 'events.log'
          if (Test-Path $p) {
              '' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
              '### CHECK lines' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
              '```' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
              (Get-Content $p -Raw) | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
              '```' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-uninstall-evidence-${{ inputs.artifact_run_id }}
          path: qa-evidence-uninstall/
          if-no-files-found: warn
          retention-days: 30

      - name: Verdict
        if: always()
        shell: pwsh
        run: |
          $EV = Join-Path $env:GITHUB_WORKSPACE 'qa-evidence-uninstall'
          $v = Join-Path $EV 'verdict.txt'
          if (Test-Path $v) { Get-Content $v | Write-Host }
          if ('${{ steps.uninst.outcome }}' -ne 'success') { throw 'uninstall QA failed - see the CHECK|FAIL lines and the uploaded evidence' }
