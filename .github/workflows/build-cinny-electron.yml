# Build Plotina Lite Desktop (Electron) — the release pipeline.
#
# FROM TAG v4.12.8-plotina-lite-desktop.18 THIS WORKFLOW IS THE LITE DESKTOP
# RELEASE PATH: the old Tauri workflow (build-cinny-desktop.yml) is reduced to
# workflow_dispatch for historical rebuilds (.17 and earlier stay published
# as-is and keep serving updates until the feed is retired). Tags matching
# v*-plotina-lite-desktop.* build web -> linux/windows packaging -> smoke and
# then run the `release` job, which verifies the artifacts and attaches them
# to the GitHub release for that tag; the in-app updater (src/updater.js)
# reads latest-lite.yml / latest-lite-linux.yml from that release. A dev tag
# v<semver>-plotina-lite-desktop.N-dev.M instead publishes a PRERELEASE for
# the tag and rolls the same verified artifacts plus Lite-scoped metadata
# (latest-lite-dev.yml / latest-lite-linux-dev.yml) into the shared
# `dev-latest` release; Desktop's latest-dev.yml / latest-linux-dev.yml there
# are never touched. Nothing is published to /dl from CI: the edge host pulls
# the release itself (pull-release).
#
# workflow_dispatch stays for branch testing; builds run with --publish never
# and the release job only runs on tags, so a branch or dispatch build can
# never overwrite a release.
#
# The first job, `dev-base-guard`, is the dev-base gate: a dev tag is only built
# when its base v<semver>-plotina-lite-desktop.<N> is a PUBLISHED stable release
# carrying the updater manifests. A tag ref alone is not evidence — a build can
# die after the tag was cut — so the check looks at the release, not at the tag,
# and it runs before web/linux/windows so a bad tag costs seconds, not a runner.
# Stable tags are never gated: the first release of a new base has no release yet.
#
# Layout follows the internal Lite migration doc §6.7 minus the Tauri
# cross-grade jobs (the old installed base is negligible; clean installs
# only): web -> linux/windows packaging -> smoke -> release.
name: Build Plotina Lite Desktop (Electron)

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "Override APP_VERSION (default: derived from tag, else 4.12.8-plotina.0.local)"
        required: false
        default: ""
  push:
    tags: ["v*-plotina-lite-desktop.*"]
    # noise/ is baked into the bundle and cinny-electron/ is the shell:
    # only changes to those (or this file) justify a full release rebuild.
    paths:
      - "cinny/**"
      - "noise/**"
      - "cinny-electron/**"
      - ".github/workflows/build-cinny-electron.yml"

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/cinnyapp/cinny-desktop.git
  VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
  SENTRY_SDK_VERSION: 10.27.0
  SENTRY_CLI_VERSION: 2.42.2
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  # No Authenticode certificate yet (migration plan §6.6): never attempt
  # auto-discovery, never claim signed builds.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

concurrency:
  group: build-cinny-electron-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Early gate, before anything is built: a dev tag may only exist on a base
  # that was really published. The `release` job parses the tag at the very end
  # of the run, so a check there would only speak after web/linux/windows spent
  # ~40 runner minutes — and it never looked at the base anyway.
  dev-base-guard:
    name: dev base guard
    runs-on: ubuntu-24.04
    # Four API calls; anything slower than this is a hung runner, not a check.
    timeout-minutes: 5
    steps:
      - name: Guard — a dev tag sits on a published base release
        # A dev build sorts ABOVE the stable of the same base
        # (4.12.8-plotina.27-dev.8 > 4.12.8-plotina.27), so a dev tag cut on a
        # base nobody ever installed leaves the dev channel with no stable to
        # return to and no feed to descend from. A tag ref is not evidence of a
        # release: .49 carried a tag while its release never existed. What is
        # required here is the release plus the updater manifests the release
        # job always writes (verify-release-assets.mjs renames dist/latest-linux.yml
        # and dist/latest.yml to the two latest-lite* names below).
        #
        # Stable tags are deliberately NOT checked: the first release of a new
        # base number is cut from a tag that has no release yet.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          ref="${GITHUB_REF_NAME:-}"
          repo="${GITHUB_REPOSITORY:-plotina-cc/clients}"
          work="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/dev-base-guard"
          rm -f "$work"/*.txt "$work"/*.log 2>/dev/null || true
          mkdir -p "$work"

          if [[ ! "$ref" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-plotina-lite-desktop\.([0-9]+)-dev\.([0-9]+)$ ]]; then
            echo "ref '$ref' is not a <semver>-plotina-lite-desktop.<N>-dev.<M> tag."
            echo "Stable tags are deliberately not checked here — otherwise the first release of a base could never be built."
            exit 0
          fi
          semver="${BASH_REMATCH[1]}"
          base_rev="${BASH_REMATCH[2]}"
          dev_counter="${BASH_REMATCH[3]}"
          base_tag="v${semver}-plotina-lite-desktop.${base_rev}"
          base_version="${semver}-plotina.${base_rev}"
          manifests=(latest-lite-linux.yml latest-lite.yml)

          echo "dev tag       : $ref (dev build $dev_counter)"
          echo "requires base : $base_tag -> $base_version"
          echo "                published, with ${manifests[*]} inside"
          echo

          problems=()
          why=()
          manifests_missing=()
          tag_state=absent
          release_state=absent
          lookup_error=0

          if gh api "repos/${repo}/git/ref/tags/${base_tag}" --template '{{.ref}}' >"$work/tag.txt" 2>"$work/tag.err"; then
            tag_state=present
          fi

          if gh release view "$base_tag" --json isDraft,isPrerelease \
               --template '{{.isDraft}} {{.isPrerelease}}' >"$work/flags.txt" 2>"$work/flags.err"; then
            release_state=present
            is_draft=unknown
            is_prerelease=unknown
            read -r is_draft is_prerelease <"$work/flags.txt" || true
            if [ "$is_draft" = true ]; then
              problems+=("release $base_tag is a DRAFT")
            fi
            if [ "$is_prerelease" = true ]; then
              problems+=("release $base_tag is a prerelease, not a published stable")
            fi
            if gh release view "$base_tag" --json assets \
                 --template '{{range .assets}}{{.name}}{{"\n"}}{{end}}' >"$work/assets.txt" 2>"$work/assets.err"; then
              for m in "${manifests[@]}"; do
                if ! grep -qxF "$m" "$work/assets.txt"; then
                  manifests_missing+=("$m")
                fi
              done
            else
              manifests_missing=("${manifests[@]}")
            fi
            if [ "${#manifests_missing[@]}" -eq 0 ]; then
              mkdir -p "$work/manifests"
              if gh release download "$base_tag" --pattern 'latest-lite*.yml' --dir "$work/manifests" >"$work/download.log" 2>&1; then
                for m in "${manifests[@]}"; do
                  if [ ! -s "$work/manifests/$m" ]; then
                    problems+=("$m was not downloadable from $base_tag")
                    continue
                  fi
                  declared="$(awk '/^version:/ { sub(/^version:[ \t]*/, ""); print; exit }' "$work/manifests/$m" | tr -d "\"' \t\r")"
                  if [ "$declared" != "$base_version" ]; then
                    problems+=("$m declares version '${declared:-<none>}', expected '$base_version'")
                  fi
                done
              else
                problems+=("gh release download $base_tag failed: $(tr '\n' ' ' <"$work/download.log")")
              fi
            fi
          else
            if grep -qi 'not found' "$work/flags.err"; then
              problems+=("no release exists for $base_tag")
            else
              lookup_error=1
              problems+=("release lookup for $base_tag failed: $(tr '\n' ' ' <"$work/flags.err")")
            fi
          fi

          if [[ "${#problems[@]}" -eq 0 && "${#manifests_missing[@]}" -eq 0 ]]; then
            echo "OK: $ref sits on the published base release $base_tag ($base_version) with ${manifests[*]} inside."
            exit 0
          fi

          # ---- diagnose ------------------------------------------------------
          if [ "$release_state" = present ]; then
            why+=("the release $base_tag exists, but it is not a published stable release")
          elif [ "$lookup_error" = 1 ]; then
            why+=("the base release of $base_tag could not be looked up (see the error above)")
          elif [ "$tag_state" = present ]; then
            why+=("the tag $base_tag exists, but no release was ever published for it — a build that died after the tag was cut")
          else
            why+=("neither the tag $base_tag nor its release exists — the base number in $ref was never cut")
          fi
          if [ "${#manifests_missing[@]}" -gt 0 ]; then
            why+=("its assets carry no updater manifest: ${manifests_missing[*]}")
          fi

          # Newest published Lite base, for the one line of advice. Advisory only:
          # a failing call here never changes the verdict.
          last_stable="$(gh release list --limit 100 --exclude-drafts \
            --template '{{range .}}{{.TagName}}{{"\n"}}{{end}}' 2>/dev/null \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-plotina-lite-desktop\.[0-9]+$' \
            | sed -E 's/.*\.([0-9]+)$/\1/' | sort -n | tail -n1)" || last_stable=""

          {
            echo "::error::dev tag ${ref} refused: base ${base_tag} is not a published stable release"
            echo
            echo "FATAL: refusing dev tag ${ref} — its base is not a published release."
            echo
            echo "  base tag       : ${tag_state}"
            echo "  base release   : ${release_state}"
            echo "  required inside: ${manifests[*]}"
            echo
            printf '  - %s\n' "${why[@]}"
            if [ "${#problems[@]}" -gt 0 ]; then
              printf '  - %s\n' "${problems[@]}"
            fi
            echo
            echo "Why this is fatal: a dev build sorts ABOVE the stable of the same base"
            echo "(4.12.8-plotina.27-dev.8 > 4.12.8-plotina.27), so a dev tag on a base that was"
            echo "never published leaves the dev channel with no stable to return to, and the"
            echo "updater feed it descends from does not exist."
            echo
            if [ -n "$last_stable" ]; then
              echo "Last published Lite base: v${semver}-plotina-lite-desktop.${last_stable}"
              echo "Cut the dev build on it instead:"
              echo "  git tag v${semver}-plotina-lite-desktop.${last_stable}-dev.<M> <sha>   # then push only the tag"
              echo "…or publish ${base_tag} first: stable tags are not gated, so that release can still be built."
            else
              echo "No published Lite base found at all — publish ${base_tag} first (stable tags are not gated)."
            fi
            echo
            echo "Refused here in seconds, instead of after web/linux/windows (~40 runner minutes)."
          } >&2
          exit 1

  web:
    name: web dist
    # Nothing is built until the tag is known to sit on a published base.
    needs: dev-base-guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Pin upstream
        working-directory: cinny
        shell: bash
        run: |
          TAG="$(cat UPSTREAM_TAG)"
          git clone --depth 1 --branch "$TAG" --recurse-submodules --shallow-submodules \
            "$UPSTREAM_REPO" upstream

      - name: Name the release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d 'v\r\n' < cinny/UPSTREAM_TAG)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            release="cinny-lite-electron@${GITHUB_REF_NAME}"
          else
            release="cinny-lite-electron@${version}+${GITHUB_REF_NAME}"
          fi
          echo "SENTRY_RELEASE=$release" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cinny/upstream/package-lock.json
            cinny/upstream/cinny/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the patch and marker scripts
        # Seconds, and it covers the gate's own negative controls: a missing marker must fail, an
        # artifact that cannot be read must fail, an empty marker list must fail.
        run: scripts/tests/run-tests.sh

      - name: Apply the Plotina patches (incl. SSO 0007)
        working-directory: cinny
        shell: bash
        run: |
          set -euo pipefail
          # One entry point for every patch in this repository. The script applies the whole
          # cinny/patches/ directory in LC_ALL=C order, checks each patch against the tree the
          # previous ones built, fails on a .rej or on a shorter applied count than the directory
          # holds, and refuses a patch with no marker header. Nothing here names a patch: a new file
          # in cinny/patches/ is applied on the next run without editing this workflow, and a patch
          # that is *not* applied cannot pass silently.
          "$GITHUB_WORKSPACE/scripts/apply-patches.sh" "$PWD" "$PWD/upstream/cinny" \
            "$GITHUB_WORKSPACE/cinny-markers.txt"

      - name: Build web
        working-directory: cinny/upstream/cinny
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-audit --no-fund "@sentry/browser@${SENTRY_SDK_VERSION}"
          VITE_SENTRY_RELEASE="$SENTRY_RELEASE" npm run build

      # The GlitchTip noise filter is code in our patch, not configuration: a
      # filter that quietly stops filtering would look like a healthy build and
      # an empty project. The rules and the "must still be reported" half are
      # pinned against the same patched tree, with the esbuild npm ci just
      # installed.
      - name: Sentry noise filter tests (node)
        working-directory: cinny
        shell: bash
        run: bash scripts/test-sentry-filter.sh "$PWD/upstream/cinny"

      - name: Apply noise and branding
        working-directory: cinny
        shell: bash
        run: |
          set -euo pipefail
          cp config.json upstream/config.json
          cp config.json upstream/cinny/config.json
          cp config.json upstream/cinny/dist/config.json
          # Upstream's embedded 0.20.1 is gone: the frame is our Element Call
          # archive (cinny/element-call.lock.json, same pin as Desktop), which
          # carries its own noise/ inside the mount.
          python scripts/mount-element-call.py --dist upstream/cinny/dist \
            --lock element-call.lock.json --work "$RUNNER_TEMP/element-call"
          python apply-noise.py --dist upstream/cinny/dist
          python branding.py --dist upstream/cinny/dist --brand "Plotina Lite Desktop"

      - name: Verify the SSO handoff marker survived
        working-directory: cinny
        shell: bash
        run: |
          set -euo pipefail
          # The Electron shell's opener flow requires patch 0007 in the dist.
          grep -Raqs 'plotina:sso:login-token' upstream/cinny/dist/assets
          # Patch 0008 adds the Settings -> Updates page; its testid marker
          # must survive minification or the page never ships. Patch 0009
          # adds the Settings -> General noise block the same way.
          grep -Raqs 'plotina-updates-page' upstream/cinny/dist/assets
          grep -Raqs 'plotina-noise-settings' upstream/cinny/dist/assets
          # The GlitchTip noise filter is code, not a stamp: these rule names
          # exist only in patches/0001, so one of them in the bundle is what a
          # patch that got past the minifier looks like.
          grep -Raqs 'widget-transport-timeout' upstream/cinny/dist/assets
          # The served frame is ours, not upstream's embedded 0.20.1.
          python scripts/mount-element-call.py --dist upstream/cinny/dist --check
          test ! -e upstream/cinny/dist/noise
          test -f upstream/cinny/dist/sw.js

      - name: Gate — every applied patch is in the web dist
        # The build is not allowed to be green about a patch that did not reach the dist. The marker
        # list comes from apply-patches.sh, i.e. from the files really applied in this job, so this
        # catches both shapes of the bug: a patch in patches/ that never applied, and a patch that
        # applied but whose string the minifier dropped. It is checked on the built dist, never on
        # the source tree — that is where the literals survive or die.
        run: scripts/check-markers.sh cinny/upstream/cinny/dist cinny-markers.txt

      - name: Package the web dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -C cinny/upstream/cinny/dist -cf dist/plotina-lite-web-dist.tar .
          du -h dist/plotina-lite-web-dist.tar

      - uses: actions/upload-artifact@v4
        with:
          name: plotina-lite-web-dist
          path: dist/plotina-lite-web-dist.tar
          if-no-files-found: error
          retention-days: 30

  linux:
    name: linux packages
    needs: web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            librsvg2-bin imagemagick desktop-file-utils binutils \
            xvfb xdotool x11-utils libgtk-3-0t64 libnss3 libasound2t64 \
            libgbm1 libxss1 libxtst6 libatspi2.0-0t64 libsecret-1-0 \
            libnotify4 xdg-utils rpm fakeroot

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: plotina-lite-web-dist
          path: web-in

      - name: Install shell deps
        working-directory: cinny-electron
        run: npm ci --no-audit --no-fund

      - name: Build AppImage + deb + rpm (never publish)
        working-directory: cinny-electron
        shell: bash
        env:
          APP_VERSION_OVERRIDE: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dist-src"
          tar -C "$RUNNER_TEMP/dist-src" -xf "$GITHUB_WORKSPACE/web-in/plotina-lite-web-dist.tar"
          LITE_DIST="$RUNNER_TEMP/dist-src" bash scripts/build-packages.sh linux

      - name: Upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plotina-lite-desktop-electron-linux
          # upload-artifact v4 stores entries relative to the deepest
          # wildcard-free directory: dist contents land at the artifact root.
          path: cinny-electron/dist/**
          if-no-files-found: error
          retention-days: 30

  linux-smoke:
    name: linux smoke (${{ matrix.kind }})
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        kind: [appimage, deb]
    steps:
      - uses: actions/checkout@v4

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool x11-utils binutils libgtk-3-0t64 libnss3 \
            libasound2t64 libgbm1 libxss1 libxtst6 libatspi2.0-0t64 \
            libsecret-1-0 libnotify4

      - uses: actions/download-artifact@v4
        with:
          name: plotina-lite-desktop-electron-linux
          path: cinny-electron/dist

      - name: Identity asserts under Xvfb (WM_CLASS, title, _NET_WM_ICON, updater feed)
        working-directory: cinny-electron
        run: SKIP_QA_HARNESS=1 bash scripts/qa-linux-package.sh "${{ matrix.kind }}"

  windows:
    name: windows installers
    needs: web
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: plotina-lite-web-dist
          path: web-in

      - name: Install shell deps
        working-directory: cinny-electron
        run: npm ci --no-audit --no-fund

      - name: Build NSIS + MSI (never publish)
        working-directory: cinny-electron
        shell: bash
        env:
          APP_VERSION_OVERRIDE: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          mkdir -p web-dist
          # Git Bash tar treats the drive letter in an absolute path as a remote
          # host ("Cannot connect to D:"); extract from a relative path.
          cd "$GITHUB_WORKSPACE/web-in"
          tar -xf plotina-lite-web-dist.tar -C ../cinny-electron/web-dist
          cd "$GITHUB_WORKSPACE/cinny-electron"
          LITE_DIST="$PWD/web-dist" bash scripts/build-packages.sh windows
          # NSIS is the auto-updating installer: metadata + blockmap required.
          test -f dist/latest.yml
          ls dist/Plotina-Lite-Desktop-*-x64.exe.blockmap

      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plotina-lite-desktop-electron-windows
          path: cinny-electron/dist/**
          if-no-files-found: error
          retention-days: 30

  windows-smoke:
    name: windows installer smoke
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plotina-lite-desktop-electron-windows
          path: pkg

      - name: Silent NSIS install + protocol registry + launch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Get-ChildItem pkg/Plotina-Lite-Desktop-*-x64.exe | Where-Object Name -notlike '*.blockmap' | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $exe -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent NSIS install exit $($p.ExitCode)" }
          # electron-builder may sanitize the product name in the install dir;
          # locate the payload instead of hard-coding the folder.
          $found = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter plotina-lite-desktop.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { throw "NSIS install dir missing plotina-lite-desktop.exe under $env:LOCALAPPDATA\Programs" }
          $bin = $found.FullName
          $dir = $found.DirectoryName
          # install-kind marker drives the in-app updater state
          if ((Get-Content "$dir\install-kind").Trim() -ne 'nsis') { throw 'install-kind marker wrong' }
          # packaged app-update.yml feed must name plotina-cc/clients
          $feed = Get-Content "$dir\resources\app-update.yml" -Raw
          if ($feed -notmatch 'owner:\s*plotina-cc' -or $feed -notmatch 'repo:\s*clients') { throw 'app-update.yml feed wrong' }
          if ($feed -match 'vector-im|element-web|cinnyapp') { throw 'upstream feed reference survived' }
          # protocols registered by the installer
          if (-not (Test-Path 'HKCU:\Software\Classes\cc.plotina.chat')) { throw 'cc.plotina.chat protocol missing' }
          if (-not (Test-Path 'HKCU:\Software\Classes\matrix')) { throw 'matrix protocol missing' }
          # launch the packaged app, then kill
          $proc = Start-Process $bin -PassThru
          Start-Sleep -Seconds 20
          if ($proc.HasExited) { throw "app exited early with $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          # MSI: silent install of the same payload into the machine/user DB
          $msi = (Get-ChildItem pkg/Plotina-Lite-Desktop-*-x64.msi | Select-Object -First 1).FullName
          $m = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /norestart" -Wait -PassThru
          if ($m.ExitCode -ne 0) { throw "silent MSI install exit $($m.ExitCode)" }

  # Phase 4: the GitHub release is the updater feed (app-update.yml points at
  # plotina-cc/clients, src/updater.js reads latest*.yml from the newest
  # stable release). The builds themselves never publish (--publish never);
  # this job uploads the verified artifacts. Nothing goes to /dl from CI —
  # the edge host pulls this release itself (pull-release).
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    # Smoke jobs run in parallel and are advisory; packaging already asserts
    # identity (build-packages.sh) and verify-release-assets.mjs re-verifies
    # hashes + feed metadata before a single byte is uploaded.
    needs: [web, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Release version from the tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # v<semver>-plotina-lite-desktop.N        -> stable release
          # v<semver>-plotina-lite-desktop.N-dev.M  -> dev prerelease + dev-latest roll
          if [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-plotina-lite-desktop\.([0-9]+)-dev\.([0-9]+)$ ]]; then
            echo "app_version=${BASH_REMATCH[1]}-plotina.${BASH_REMATCH[2]}-dev.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "release APP_VERSION=${BASH_REMATCH[1]}-plotina.${BASH_REMATCH[2]}-dev.${BASH_REMATCH[3]} (dev tag: prerelease)"
          elif [[ "${GITHUB_REF_NAME}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-plotina-lite-desktop\.([0-9]+)$ ]]; then
            echo "app_version=${BASH_REMATCH[1]}-plotina.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "release APP_VERSION=${BASH_REMATCH[1]}-plotina.${BASH_REMATCH[2]}"
          else
            echo "FATAL: tag '${GITHUB_REF_NAME}' is not v<semver>-plotina-lite-desktop.<rev>[-dev.<M>]" >&2
            echo "       expected e.g. v4.12.8-plotina-lite-desktop.18 -> 4.12.8-plotina.18" >&2
            echo "                 or  v4.12.8-plotina-lite-desktop.18-dev.2 -> 4.12.8-plotina.18-dev.2" >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: plotina-lite-desktop-electron-linux
          path: pkg-linux

      - uses: actions/download-artifact@v4
        with:
          name: plotina-lite-desktop-electron-windows
          path: pkg-windows

      - name: Verify hashes and feed metadata, assemble upload dir
        shell: bash
        run: |
          set -euo pipefail
          node cinny-electron/scripts/verify-release-assets.mjs \
            --linux pkg-linux --windows pkg-windows \
            --version "${{ steps.ver.outputs.app_version }}" \
            --out release-assets

      - name: Add the Linux install helper
        shell: bash
        run: |
          set -euo pipefail
          cp cinny-electron/scripts/install-lite-electron.sh \
             release-assets/Plotina-Lite-Desktop-install.sh
          test -s release-assets/Plotina-Lite-Desktop-install.sh

      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.prerelease != 'true'
        with:
          tag_name: ${{ github.ref_name }}
          # Human-facing title: the base version plus the release counter, so
          # this build is distinguishable from the historical Tauri releases.
          name: "Plotina Lite Desktop ${{ steps.ver.outputs.app_version }} (Electron)"
          # src/updater.js only trusts stable releases.
          prerelease: false
          make_latest: "true"
          generate_release_notes: false
          files: release-assets/*
          body: |
            Сборка Plotina Lite Desktop ${{ steps.ver.outputs.app_version }} — клиент Cinny для plotina.cc в оболочке Electron с шумоподавлением DeepFilterNet3. Начиная с этой версии Lite Desktop выпускается на Electron (прежние сборки на Tauri остаются в истории релизов).

            Шумоподавление: уровень по умолчанию 60, настраивается в Настройки → General → Sound.
            Windows: установщик NSIS обновляется автоматически из этого релиза; MSI — для ручной установки. Сборка не подписана сертификатом Authenticode, SmartScreen попросит подтверждение при первом запуске.
            Linux: AppImage, deb (Debian/Ubuntu) и rpm (Fedora/openSUSE); AppImage обновляется автоматически.
            Файлы без версии в имени (Plotina-Lite-Desktop.AppImage, .deb, .rpm, -setup.exe, .msi) — стабильные ссылки на текущую сборку; контрольные суммы — в SHA256SUMS.

            Исходники этой сборки — в этом репозитории (AGPL-3.0): upstream-тег cinny-desktop из cinny/UPSTREAM_TAG и его submodule cinny плюс оверлей cinny/ и оболочка cinny-electron/. Полный набор: https://github.com/plotina-cc/clients/blob/main/SOURCE.md

      # ---- dev tags: prerelease release + dev-latest roll -------------------
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.prerelease == 'true'
        with:
          tag_name: ${{ github.ref_name }}
          name: "Plotina Lite Desktop ${{ steps.ver.outputs.app_version }} dev (Electron)"
          # Dev tags are test builds: prerelease so the stable updater listing
          # (non-prerelease only, src/updater.js) never sees them, and never
          # the repository's 'latest' release.
          prerelease: true
          make_latest: "false"
          generate_release_notes: false
          files: release-assets/*
          body: |
            Тестовая (dev) сборка Plotina Lite Desktop ${{ steps.ver.outputs.app_version }}. Ставится только клиентами с включённым каналом обновлений Dev (Настройки → Обновления). Rolling-метаданные latest-lite-dev.yml / latest-lite-linux-dev.yml и эти же артефакты опубликованы в релизе dev-latest.

      - name: Publish rolling dev metadata + artifacts to dev-latest
        if: steps.ver.outputs.prerelease == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.app_version }}"
          # Product-scoped copies of the verified Lite metadata. The shared
          # dev-latest release also carries Plotina Desktop's rolling
          # latest-dev.yml / latest-linux-dev.yml: Lite must never upload or
          # clobber those names, or a Desktop dev client would install Lite
          # bytes.
          cp release-assets/latest-lite-linux.yml release-assets/latest-lite-linux-dev.yml
          cp release-assets/latest-lite.yml release-assets/latest-lite-dev.yml
          shopt -s nullglob
          upload=(release-assets/latest-lite-linux-dev.yml release-assets/latest-lite-dev.yml)
          for pat in \
            "Plotina-Lite-Desktop-${version}-*.AppImage" \
            "Plotina-Lite-Desktop-${version}-*.deb" \
            "Plotina-Lite-Desktop-${version}-*.rpm" \
            "Plotina-Lite-Desktop-${version}-*.exe" \
            "Plotina-Lite-Desktop-${version}-*.exe.blockmap" \
            "Plotina-Lite-Desktop-${version}-*.msi"; do
            upload+=(release-assets/${pat})
          done
          echo "dev-latest upload set:"; printf '  %s\n' "${upload[@]}"
          [ "${#upload[@]}" -ge 4 ] || { echo "FATAL: dev upload set too small (${#upload[@]} files) — versioned artifacts missing?" >&2; exit 1; }
          # dev-latest is shared with Desktop: create only if absent, never
          # delete, clobber-upload just this product's files.
          gh release view dev-latest >/dev/null 2>&1 || \
            gh release create dev-latest --prerelease \
              --title "Plotina dev-latest (rolling test builds)" \
              --notes "Rolling dev builds of plotina-cc/clients products. Product-scoped metadata: Plotina Desktop -> latest-dev.yml / latest-linux-dev.yml; Plotina Lite Desktop -> latest-lite-dev.yml / latest-lite-linux-dev.yml. Do not delete this release."
          gh release upload dev-latest --clobber "${upload[@]}"
