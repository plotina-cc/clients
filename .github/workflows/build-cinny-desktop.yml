name: build-cinny-desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*-plotina.*"]
    paths: ["cinny-desktop/**", ".github/workflows/build-cinny-desktop.yml"]

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/cinnyapp/cinny-desktop.git

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Pin upstream
        working-directory: cinny-desktop
        shell: bash
        run: |
          TAG="$(cat UPSTREAM_TAG)"
          echo "upstream tag: $TAG"
          git clone --depth 1 --branch "$TAG" --recurse-submodules --shallow-submodules \
            "$UPSTREAM_REPO" upstream

      - name: Fetch pinned model assets
        working-directory: cinny-desktop
        run: python scripts/fetch-noise.py

      - name: Build Cinny web
        working-directory: cinny-desktop/upstream/cinny
        run: |
          npm ci
          npm run build

      - name: Apply noise patch
        working-directory: cinny-desktop
        run: |
          cp config.json upstream/config.json
          cp config.json upstream/cinny/config.json
          cp config.json upstream/cinny/dist/config.json
          python apply-noise.py --dist upstream/cinny/dist --noise noise

      - name: Install Tauri CLI
        working-directory: cinny-desktop/upstream
        run: npm ci

      - name: Build installers
        working-directory: cinny-desktop/upstream
        run: npm run tauri -- build --config "${{ github.workspace }}/cinny-desktop/tauri.plotina.json"

      - uses: actions/upload-artifact@v4
        with:
          name: plotina-cinny-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            cinny-desktop/upstream/src-tauri/target/release/bundle/appimage/*.AppImage
            cinny-desktop/upstream/src-tauri/target/release/bundle/deb/*.deb
            cinny-desktop/upstream/src-tauri/target/release/bundle/msi/*.msi
            cinny-desktop/upstream/src-tauri/target/release/bundle/nsis/*.exe
            cinny-desktop/upstream/src-tauri/target/release/bundle/dmg/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            Сборка Cinny Desktop для plotina.cc с шумоподавлением DeepFilterNet3.

            Шумоподавление с уровнем по умолчанию 60, настраивается в Настройки → General → Sound.
            Windows: установщик не подписан, SmartScreen попросит подтверждение.
            macOS: приложение не нотаризовано — правый клик → «Открыть».
            Linux: AppImage или deb.

            Исходники этой сборки — в этом репозитории (AGPL-3.0).
