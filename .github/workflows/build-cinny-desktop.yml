name: build-cinny-desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*-plotina-cinny.*"]
    # noise/ is baked into the bundle, so a change there must rebuild too.
    paths: ["cinny/**", "noise/**", ".github/workflows/build-cinny-desktop.yml"]

permissions:
  contents: write

env:
  UPSTREAM_REPO: https://github.com/cinnyapp/cinny-desktop.git

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            bundles: appimage deb rpm
          - name: windows
            os: windows-latest
            bundles: nsis msi

    steps:
      - uses: actions/checkout@v4

      # Cloned before the toolchain steps so the caches below have lock files to
      # hash: without them setup-node warns and rust-cache finds no Cargo.lock.
      - name: Pin upstream
        working-directory: cinny
        shell: bash
        run: |
          TAG="$(cat UPSTREAM_TAG)"
          echo "upstream tag: $TAG"
          git clone --depth 1 --branch "$TAG" --recurse-submodules --shallow-submodules \
            "$UPSTREAM_REPO" upstream

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            cinny/upstream/package-lock.json
            cinny/upstream/cinny/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cinny/upstream/src-tauri
          key: ${{ matrix.name }}

      - name: Linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Assemble the noise bundle
        working-directory: cinny
        shell: bash
        run: |
          mkdir -p noise/vendor
          cp ../noise/logic.js ../noise/boot.js ../noise/cinny-ui.js noise/
          cp -a ../noise/vendor/. noise/vendor/
          python scripts/fetch-noise.py

      - name: Build Cinny web
        working-directory: cinny/upstream/cinny
        run: |
          npm ci
          npm run build

      - name: Apply noise patch
        working-directory: cinny
        shell: bash
        run: |
          cp config.json upstream/config.json
          cp config.json upstream/cinny/config.json
          cp config.json upstream/cinny/dist/config.json
          python apply-noise.py --dist upstream/cinny/dist --noise noise

      - name: Verify the patch landed
        working-directory: cinny
        shell: bash
        run: |
          grep -q 'noise/cinny-ui.js' upstream/cinny/dist/index.html
          grep -q 'noise/boot.js' upstream/cinny/dist/public/element-call/index.html
          test -f upstream/cinny/dist/noise/dfn/v3/pkg/df_bg.wasm
          test -f upstream/cinny/dist/noise/vendor/dfn.esm.js
          echo "patch present in the dist"

      - name: Install Tauri CLI
        working-directory: cinny/upstream
        run: npm ci

      - name: Build installers
        working-directory: cinny/upstream
        run: npm run tauri -- build --config "${{ github.workspace }}/cinny/tauri.plotina.json" --bundles ${{ matrix.bundles }}

      - name: Stage artifacts with stable names
        shell: bash
        run: |
          mkdir -p stable
          shopt -s nullglob
          for f in cinny/upstream/src-tauri/target/release/bundle/appimage/*.AppImage; do cp "$f" stable/Plotina.AppImage; done
          for f in cinny/upstream/src-tauri/target/release/bundle/deb/*.deb;           do cp "$f" stable/Plotina.deb; done
          for f in cinny/upstream/src-tauri/target/release/bundle/rpm/*.rpm;           do cp "$f" stable/Plotina.rpm; done
          for f in cinny/upstream/src-tauri/target/release/bundle/nsis/*.exe;          do cp "$f" stable/Plotina-setup.exe; done
          for f in cinny/upstream/src-tauri/target/release/bundle/msi/*.msi;           do cp "$f" stable/Plotina.msi; done
          ls -lh stable

      - uses: actions/upload-artifact@v4
        with:
          name: plotina-cinny-${{ matrix.name }}
          if-no-files-found: warn
          path: stable/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          body: |
            Сборка Cinny Desktop для plotina.cc с шумоподавлением DeepFilterNet3.

            Шумоподавление с уровнем по умолчанию 60, настраивается в Настройки → General → Sound.
            Windows: установщик не подписан, SmartScreen попросит подтверждение.
            Linux: AppImage, deb (Debian/Ubuntu) или rpm (Fedora/openSUSE).

            Исходники этой сборки — в этом репозитории (AGPL-3.0).
