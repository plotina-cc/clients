name: Build Plotina Desktop

on:
  workflow_dispatch:
  push:
    tags: ["v*-plotina-desktop.*"]

permissions:
  contents: read

env:
  # Must match devEngines.packageManager in the upstream monorepo; the lockfile
  # is generated by this pnpm.
  PNPM_VERSION: "11.23.0"
  UPSTREAM_REPO: https://github.com/element-hq/element-web.git

jobs:
  # The noise layer is baked into the webapp.asar; its tests must not regress.
  # The pinned DPDFNet binaries are gitignored, so fetch them first: the python
  # suite verifies their SHA-256 digests and the headless smoke drives the real
  # browser pages (run-headless.sh).
  noise-tests:
    name: noise tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch DPDFNet assets
        run: python3 noise/scripts/fetch-dpdfnet.py

      - name: Noise tests (python)
        run: python3 -m unittest discover -s noise/tests -p '*_test.py'

      - name: Noise tests (node)
        run: node --test noise/tests/*.test.mjs

      - name: Noise tests (headless browser)
        shell: bash
        run: |
          set -euo pipefail
          for b in chromium chromium-browser google-chrome; do
            if command -v "$b" >/dev/null 2>&1; then export CHROME="$b"; break; fi
          done
          if [ -n "${CHROME:-}" ]; then
            bash noise/tests/run-headless.sh
          else
            echo "::notice::no chromium binary on this runner; headless smoke skipped"
          fi

  # desktop/updater.ts is compiled into the packaged app for BOTH platforms;
  # its Linux swap/verify logic runs here against the real live feed (the last
  # test downloads the AppImage the published latest-linux.yml names).
  # Node >= 22.18 is required: the test imports the .ts source directly.
  updater-tests:
    name: updater tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Linux AppImage updater tests
        working-directory: element-desktop/desktop
        # Explicit files, not the directory: `node --test <dir>` scanning of a
        # path argument differs between Node majors; the file form is stable.
        # update-feed.test.mjs guards the Settings "Check for updates" feed
        # (ipc.ts is patched to call getUpdateFeedUrl from our updater).
        run: node --test tests/linux-updater.test.mjs tests/update-feed.test.mjs

  # One webapp for both platforms: the desktop shell embeds a fixed asar, so the
  # overlay has to be applied once and handed to the packaging jobs.
  webapp:
    name: webapp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assemble the webapp
        working-directory: element-desktop
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: scripts/prepare-webapp.sh --dest "$RUNNER_TEMP/webapp"

      - name: Check the Sentry block before packing
        working-directory: element-desktop
        run: python3 ../element-web/scripts/render-config.py --check --config "$RUNNER_TEMP/webapp/config.json"

      - name: Pack it for the build jobs
        run: |
          tar czf "$RUNNER_TEMP/webapp.tar.gz" -C "$RUNNER_TEMP/webapp" .

      - uses: actions/upload-artifact@v4
        with:
          name: plotina-webapp
          path: ${{ runner.temp }}/webapp.tar.gz
          retention-days: 1

  build:
    name: ${{ matrix.name }}
    needs: [webapp]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            targets: "-l appimage deb"
          - name: windows
            os: windows-latest
            targets: "-w nsis"
    env:
      SRC: element-desktop/.build/element-web
    steps:
      - uses: actions/checkout@v4

      # nx chokes on CRLF checkouts, and the upstream tree is cloned below.
      - name: Git line endings
        if: matrix.name == 'windows'
        shell: bash
        run: |
          git config --system core.autocrlf false
          git config --system core.eol lf

      - name: Pin upstream
        shell: bash
        run: |
          TAG="$(cat element-desktop/UPSTREAM_TAG)"
          echo "upstream tag: $TAG"
          git clone --depth 1 --branch "$TAG" "$UPSTREAM_REPO" "$SRC"

      - uses: actions/download-artifact@v4
        with:
          name: plotina-webapp
          path: ${{ runner.temp }}/webapp

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: element-desktop/.build/element-web/apps/desktop/.node-version
          cache: pnpm
          cache-dependency-path: element-desktop/.build/element-web/pnpm-lock.yaml

      - name: Desktop deps
        working-directory: element-desktop/.build/element-web/apps/desktop
        run: pnpm install --frozen-lockfile --filter element-desktop

      # GNU tar reads "D:\a\_temp\..." as a remote host on Windows, so the
      # archive is handed over as a bare filename from its own directory.
      - name: Unpack the webapp
        shell: bash
        run: |
          WEBAPP_DIR="$PWD/$SRC/apps/desktop/webapp"
          rm -rf "$WEBAPP_DIR"
          mkdir -p "$WEBAPP_DIR"
          cd "$RUNNER_TEMP/webapp"
          tar xzf webapp.tar.gz -C "$WEBAPP_DIR"

      - name: Pack and check webapp.asar
        working-directory: element-desktop/.build/element-web/apps/desktop
        shell: bash
        run: |
          pnpm run asar-webapp
          # asar lists entries with path.sep, so normalize before matching.
          LIST="$(pnpm exec asar list webapp.asar | tr '\\' '/')"
          for f in /noise/dfn/v3/pkg/df_bg.wasm \
                   /noise/vendor/dpdfnet.esm.js \
                   /noise/vendor/ort/ort-wasm-simd-threaded.wasm \
                   /noise/vendor/dpdfnet/dpdfnet2_48khz_hr/model_stateful.onnx \
                   /config.json; do
            if ! printf '%s\n' "$LIST" | grep -qx "$f"; then
              echo "missing $f in webapp.asar" >&2
              printf '%s\n' "$LIST" | head -30
              exit 1
            fi
          done
          # The shell's config.json is the only thing that turns Sentry on, so
          # read the packed copy back instead of trusting the directory.
          node -e '
          const { extractFile } = require("@electron/asar");
          const c = JSON.parse(extractFile("webapp.asar", "config.json"));
          const s = c.sentry || {};
          if (!s.dsn || s.environment !== "production" || !/\/relay\//.test(s.dsn)) {
            console.error("webapp.asar config.json has no usable sentry block:", s);
            process.exit(1);
          }
          console.log("asar config.json sentry:", s.dsn.replace(/\/\/[^@]+@/, "//<key>@"), s.environment);
          '
          echo "webapp.asar carries the noise overlay and the Sentry block"

      # Upstream's src/updater.ts drives Electron's Squirrel-based autoUpdater,
      # which needs the Update.exe that a `squirrel` installer ships; our NSIS
      # packaging has none, so it always logs "Squirrel not found" and no
      # updater ever runs in our builds. Swap in our GitHub-releases updater.
      - name: Apply Plotina desktop sources
        shell: bash
        run: |
          cp "${{ github.workspace }}/element-desktop/desktop/updater.ts" "$SRC/apps/desktop/src/updater.ts"
          # Window icon capped at 128px for _NET_WM_ICON (X11 request limit at
          # 256px leaves the property empty -> KDE switcher shows a generic
          # icon); patch-shell.py wires it plus the Settings "Check for
          # updates" feed answer (upstream's Squirrel-only autoUpdater call
          # throws on Linux, hiding the button). Must mirror scripts/build.sh.
          cp "${{ github.workspace }}/element-desktop/desktop/icon.ts" "$SRC/apps/desktop/src/icon.ts"
          rm -rf "$SRC/apps/desktop/build/icons"
          cp -r "${{ github.workspace }}/element-desktop/build/icons" "$SRC/apps/desktop/build/icons"
          if command -v python3 >/dev/null; then PY=python3; else PY=python; fi
          "$PY" "${{ github.workspace }}/element-desktop/desktop/patch-shell.py" "$SRC/apps/desktop/src"

      - name: Build installers
        working-directory: element-desktop/.build/element-web/apps/desktop
        shell: bash
        env:
          VARIANT_PATH: variant.json
          USE_HARD_LINKS: "false"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          TARGETS: ${{ matrix.targets }}
        run: |
          cp "${{ github.workspace }}/element-desktop/build.plotina.json" variant.json
          # electron-builder resolves the "icon" from the app's build directory,
          # so upstream's Element icon would be packaged unless we overwrite it.
          cp "${{ github.workspace }}/element-desktop/build/icon.png" build/icon.png
          cp "${{ github.workspace }}/element-desktop/build/icon.ico" build/icon.ico
          # Upstream's electron-builder.ts builds its config from a whitelist of
          # variant fields, so the publish block in build.plotina.json never
          # reaches it, and app-update.yml falls back to the github publish
          # config inferred from package.json "repository" (vector-im/element-web).
          # CLI --config.* dot overrides sit on top of the file config: verified
          # against electron-builder 26.16.1 (probe: win-unpacked/resources/app-update.yml
          # gets owner/repo from here even with repository=vector-im/element-web).
          # Tag builds get a per-build app version (v1.12.32-plotina-desktop.30 ->
          # VERSION=1.12.32-plotina.30) so the updater can tell successive Plotina
          # builds apart at the same upstream base. Must be semver-prerelease
          # format: electron-builder sanitizes a 4-segment "1.12.32.30" into the
          # nonsense "1.12.3-2.30" inside latest.yml (probe), while the prerelease
          # form passes through byte-identical.
          if [[ "${{ github.ref_name }}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-plotina-desktop\.([0-9]+)$ ]]; then
            export VERSION="${BASH_REMATCH[1]}-plotina.${BASH_REMATCH[2]}"
          fi
          APPVER="${VERSION:-$(node -p 'require("./package.json").version')}"
          echo "app VERSION=$APPVER"
          PUB=(
            --config.publish.provider=github
            --config.publish.owner=plotina-cc
            --config.publish.repo=clients
            --config.publish.releaseType=release
          )
          # No ${version} macro in the artifact names: when nx re-quotes the
          # command it wraps argument values in DOUBLE quotes, and the shell
          # then expands ${version} to empty (run #41 built
          # "Plotina-Desktop-.AppImage"). Interpolate in bash instead; the
          # result contains only [0-9A-Za-z.-] and stays unexpanded.
          if [ "${{ matrix.name }}" = "windows" ]; then
            PUB+=(--config.win.executableName=Plotina-Desktop \
                  "--config.nsis.artifactName=Plotina-Desktop-$APPVER-setup.exe")
          else
            PUB+=("--config.appImage.artifactName=Plotina-Desktop-$APPVER.AppImage" \
                  --config.linux.icon=icons \
                  "--config.linux.desktop.entry.Name=Plotina Desktop")
          fi
          pnpm run build --publish never $TARGETS "${PUB[@]}"

      - name: Check updater metadata
        working-directory: element-desktop/.build/element-web/apps/desktop
        shell: bash
        run: |
          # The build-time --config.publish.* overrides must be what the
          # packaged app actually carries; scripts/fix-appimage-updater.sh and
          # the sed in fix-deb-branding.sh used to post-process the yml, but a
          # post-build re-pack changes the bytes AFTER electron-builder hashed
          # them into latest*.yml, which would break download verification.
          # So: assert here instead of patching there.
          set -euo pipefail
          if [ "${{ matrix.name }}" = "windows" ]; then
            unpacked=dist/win-unpacked
            meta=dist/latest.yml
          else
            unpacked=dist/linux-unpacked
            meta=dist/latest-linux.yml
          fi
          yml="$unpacked/resources/app-update.yml"
          echo "---- $yml ----"; cat "$yml"
          grep -qx 'provider: github' "$yml"
          grep -qx 'owner: plotina-cc' "$yml"
          grep -qx 'repo: clients' "$yml"
          if grep -qE 'vector-im|element-web' "$yml"; then
            echo "app-update.yml still references upstream" >&2
            exit 1
          fi
          echo "---- $meta ----"; cat "$meta"
          test -s "$meta"
          if [ "${{ matrix.name }}" = "windows" ]; then
            # NSIS ships the blockmap as a separate file for differential updates.
            ls -l dist/*.exe.blockmap
          else
            # electron-builder 26 embeds the AppImage blockmap INSIDE the
            # .AppImage (log line "building embedded block map"); there is no
            # standalone .AppImage.blockmap file, only the blockMapSize entry.
            grep -q 'blockMapSize:' "$meta"
          fi

      - name: Rewrite deb branding
        if: matrix.name == 'linux'
        working-directory: element-desktop/.build/element-web/apps/desktop
        shell: bash
        env:
          PLOTINA_REVISION: ${{ github.ref_name }}
        run: |
          # electron-builder keeps upstream's Vendor/Maintainer/Homepage and
          # the executable name in the menu entry; rewrite both in the built
          # package before it is staged (see scripts/fix-deb-branding.sh).
          shopt -s nullglob
          for deb in dist/*.deb; do
            REQUIRE_HICOLOR_ICONS=1 bash "${{ github.workspace }}/element-desktop/scripts/fix-deb-branding.sh" "$deb"
          done

          # Re-packing the deb changed its bytes AFTER electron-builder hashed
          # it into latest-linux.yml; refresh those entries so the published
          # metadata stays truthful. The AppImage is untouched, so its entry
          # (and the embedded blockmap) remain valid as built.
          python3 - <<'PY'
          import base64, hashlib, re
          from pathlib import Path

          meta = Path("dist/latest-linux.yml")
          if not meta.exists():
              raise SystemExit(0)

          def fix(m: re.Match) -> str:
              name = m.group("url")
              f = Path("dist") / name
              if not f.is_file():
                  return m.group(0)
              digest = base64.b64encode(hashlib.sha512(f.read_bytes()).digest()).decode()
              body = m.group("body")
              body = re.sub(r"(sha512: )\S+", rf"\g<1>{digest}", body)
              body = re.sub(r"(size: )\d+", rf"\g<1>{f.stat().st_size}", body)
              return f"{m.group('ind')}- url: {name}\n{body}"

          text = meta.read_text(encoding="utf-8")
          fixed = re.sub(
              r"(?P<ind>[ \t]*)- url: (?P<url>\S+\.deb)\n(?P<body>(?:[ \t]+(?:sha512|size): [^\n]*\n)+)",
              fix,
              text,
          )
          meta.write_text(fixed, encoding="utf-8")
          print(fixed)
          PY

      # The desktop shell in the built asar must carry the Plotina patches
      # (128px window icon so _NET_WM_ICON gets data; updater-fed
      # getUpdateFeedUrl so Settings shows the "Check for updates" button),
      # and the Linux payloads must ship the full hicolor icon set and a
      # consistent .desktop (Name="Plotina Desktop",
      # StartupWMClass=plotina-desktop == observed WM_CLASS).
      - name: Check shell patches and icon payload
        working-directory: element-desktop/.build/element-web/apps/desktop
        shell: bash
        run: |
          set -euo pipefail
          grep -q "getMainWindowIcon" lib/electron-main.js
          grep -q 'from "./updater.js"' lib/ipc.js
          grep -q "plotinaUpdateFeed" lib/updater.js
          echo "compiled shell carries the Plotina patches"
          if [ "${{ matrix.name }}" = "linux" ]; then
            ai=$(ls dist/*.AppImage | head -1)
            chmod +x "$ai"
            rm -rf "$RUNNER_TEMP/appimg-check"
            mkdir -p "$RUNNER_TEMP/appimg-check"
            ( cd "$RUNNER_TEMP/appimg-check" && "./$ai" --appimage-extract >/dev/null )
            d="$RUNNER_TEMP/appimg-check/squashfs-root"
            grep -qx "Name=Plotina Desktop" "$d"/*.desktop
            grep -qx "StartupWMClass=plotina-desktop" "$d"/*.desktop
            n=$(find "$d/usr/share/icons/hicolor" -path "*/apps/plotina-desktop.png" | wc -l)
            test "$n" -ge 8
            echo "AppImage: .desktop consistent, $n hicolor icon sizes"
            dpkg-deb -c dist/*.deb > "$RUNNER_TEMP/deb-list.txt"
            m=$(grep -c "icons/hicolor/[0-9]*x[0-9]*/apps/plotina-desktop.png" "$RUNNER_TEMP/deb-list.txt" || true)
            test "$m" -ge 8
            echo "deb: $m hicolor icon sizes"
          fi

      - name: Stage artifacts
        shell: bash
        run: |
          cd "$SRC/apps/desktop/dist"
          mkdir -p "$GITHUB_WORKSPACE/stable"
          shopt -s nullglob
          # Upload under the build names: latest.yml / latest-linux.yml refer to
          # the installer by filename, so renaming the staged copy would make
          # the published metadata point at a non-existent asset. The names are
          # already stable ("Plotina-Desktop-...") via the artifactName overrides.
          staged=0
          for f in *.exe *.exe.blockmap *.AppImage *.AppImage.blockmap *.deb latest.yml latest-linux.yml; do
            [ -e "$f" ] || continue
            cp "$f" "$GITHUB_WORKSPACE/stable/"
            staged=$((staged + 1))
          done
          echo "staged $staged files"
          # Stable aliases for /dl and the public links: the updater reads the
          # versioned names from latest.yml, while pull-release.py expects the
          # stable ones.
          case "${{ matrix.name }}" in
            windows)
              cp ./*-setup.exe "$GITHUB_WORKSPACE/stable/Plotina-Desktop-setup.exe"
              ;;
            linux)
              cp ./*.AppImage "$GITHUB_WORKSPACE/stable/Plotina-Desktop.AppImage"
              cp ./*.deb "$GITHUB_WORKSPACE/stable/Plotina-Desktop.deb"
              ;;
          esac
          ls -lh "$GITHUB_WORKSPACE/stable"
          # The installer plus its checksum metadata must both be present.
          case "${{ matrix.name }}" in
            windows)
              ls "$GITHUB_WORKSPACE/stable"/*-setup.exe >/dev/null
              ls "$GITHUB_WORKSPACE/stable"/latest.yml >/dev/null
              ;;
            linux)
              ls "$GITHUB_WORKSPACE/stable"/*.AppImage >/dev/null
              ls "$GITHUB_WORKSPACE/stable"/*.deb >/dev/null
              ;;
          esac

      - name: Fail if nothing was produced
        shell: bash
        run: test -n "$(ls -A stable)"

      - uses: actions/upload-artifact@v4
        with:
          name: plotina-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: stable/*

  # End-to-end proof the Windows pipeline ships something usable: silently
  # install the built NSIS package on a real Windows runner, assert the
  # installed tree carries OUR updater config and name, launch the app and
  # verify the process actually starts. Any mismatch fails the job (and the
  # release job, which needs it).
  windows-smoke:
    name: windows smoke
    runs-on: windows-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plotina-desktop-windows
          path: pkg

      - name: Check release metadata and install silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setups = @(Get-ChildItem pkg\Plotina-Desktop-*-setup.exe)
          if ($setups.Count -ne 1) { throw "artifact should carry exactly one setup exe, found $($setups.Count)" }
          $setup = $setups[0]
          Write-Host "installer: $($setup.Name) ($([math]::Round($setup.Length/1MB)) MB)"
          $latest = Get-Content pkg\latest.yml -Raw
          Write-Host "---- latest.yml ----`n$latest"
          $ref = [regex]::Match($latest, '(?m)^path:\s*(\S+)\s*$').Groups[1].Value
          if ([string]::IsNullOrEmpty($ref)) { throw "latest.yml has no path: entry" }
          if (-not (Test-Path "pkg\$ref")) { throw "latest.yml references $ref, which is not in the release assets" }
          if (-not (Test-Path "pkg\$ref.blockmap")) { throw "latest.yml installer $ref has no .blockmap asset" }
          $proc = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "installer exited with code $($proc.ExitCode)" }
          Write-Host "installer exited 0"

      - name: Assert installed app-update.yml and executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $roots = @(Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -Filter 'Plotina*')
          if ($roots.Count -lt 1) { throw "no Plotina* install directory under $env:LOCALAPPDATA\Programs" }
          $root = $roots[0].FullName
          Write-Host "install dir: $root"
          $ymlPath = Join-Path $root 'resources\app-update.yml'
          if (-not (Test-Path $ymlPath)) { throw "installed tree has no resources/app-update.yml" }
          $yml = Get-Content $ymlPath -Raw
          Write-Host "---- installed resources/app-update.yml ----`n$yml"
          foreach ($want in @('provider: github', 'owner: plotina-cc', 'repo: clients')) {
            if (-not $yml.Contains($want)) { throw "app-update.yml does not contain '$want'" }
          }
          if ($yml -match 'vector-im|element-web') { throw "app-update.yml still references upstream" }
          $exe = Join-Path $root 'Plotina-Desktop.exe'
          if (-not (Test-Path $exe)) { throw "Plotina-Desktop.exe is not installed at $exe" }
          $vi = (Get-Item $exe).VersionInfo
          Write-Host "installed version: FileVersion=$($vi.FileVersion) ProductVersion=$($vi.ProductVersion)"

      - name: Launch the installed app and check it stays running
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory -Filter 'Plotina*')[0].FullName
          $exe = Join-Path $root 'Plotina-Desktop.exe'
          # runAfterFinish may or may not have started it in a silent install;
          # make sure we have a live instance either way.
          if (@(Get-Process -Name 'Plotina-Desktop' -ErrorAction SilentlyContinue).Count -eq 0) {
            Start-Process $exe | Out-Null
          }
          Start-Sleep -Seconds 25
          $procs = @(Get-Process -Name 'Plotina-Desktop' -ErrorAction SilentlyContinue)
          if ($procs.Count -eq 0) { throw "Plotina-Desktop.exe is not running 25s after launch" }
          Write-Host "running as PID(s): $($procs.Id -join ', '); main window title(s): $(($procs | ForEach-Object { $_.MainWindowTitle }) -join ' | ')"
          # Reap the whole tree (renderer/GPU children share the image name).
          & taskkill /IM Plotina-Desktop.exe /F /T 2>&1 | ForEach-Object { Write-Host $_ }
          Start-Sleep -Seconds 3
          $left = @(Get-Process -Name 'Plotina-Desktop' -ErrorAction SilentlyContinue)
          Write-Host "processes left after kill: $($left.Count)"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, windows-smoke, updater-tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The webapp artifact is an input for the build jobs, not something to ship.
      - uses: actions/download-artifact@v4
        with:
          pattern: plotina-desktop-*
          merge-multiple: true
          path: dist

      - name: Work out the release title
        id: release_title
        env:
          TAG: ${{ github.ref_name }}
        run: |
          base="${TAG#v}"
          echo "name=Plotina Desktop ${base%%-plotina-*}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          # Human-facing title only: never the tag, which carries the upstream
          # client name and the plotina release counter.
          name: ${{ steps.release_title.outputs.name }}
          files: dist/*
          # Releases here share a tag namespace with the other clients, so the
          # generated changelog would compare against an unrelated product.
          generate_release_notes: false
          body: |
            Сборка Plotina Desktop для plotina.cc с шумоподавлением DeepFilterNet3.

            Шумоподавление включено по умолчанию (уровень 70), настраивается в Настройки → Голос и видео.
            Windows: установщик не подписан, SmartScreen попросит подтверждение. Работают автообновления: приложение проверяет релизы plotina-cc/clients (latest.yml), скачанный установщик сверяется по sha512; подпись Authenticode у обновлений нет — проверка подписи намеренно отключена.
            Linux: AppImage или deb (Debian/Ubuntu). AppImage обновляется сам: приложение проверяет latest-linux.yml в релизах plotina-cc/clients, скачивает новый образ, сверяет sha512, заменяет запущенный файл (atomic rename) и предлагает перезапуск; если папка недоступна для записи — сохраняет проверенный образ в Downloads и печатает путь. Обновления не подписаны, проверка — sha512 из релиза. Для deb: sudo apt update && sudo apt upgrade.
            macOS не собирается.

            Исходники этой сборки — в этом репозитории (AGPL-3.0): upstream-тег element-web из element-desktop/UPSTREAM_TAG плюс оверлей element-desktop/.
            Полный набор: https://github.com/plotina-cc/clients/blob/main/SOURCE.md
