name: Build Plotina Web image

# The Element Web image (element-web/Dockerfile): the pinned upstream build with
# the Plotina brand pass and the noise overlay. It is served from golova, but
# nothing here deploys — this workflow builds, smoke-tests and, when a human
# says so, publishes to GHCR.
#
#   pull request, push to main   build + container smoke test, no registry write
#   tag v*-plotina-web.*         build, then a publish job that waits for a
#                                review of the `ghcr-publish` environment
#   workflow_dispatch            the same as a tag, and the publish job runs only
#                                when `publish` is ticked
#
# The review is the gate: a tag or a dispatch on its own publishes nothing.
# How to run a gated publish: element-web/README.md, "Publish (CI)".

on:
  pull_request:
    paths:
      - element-web/**
      - noise/**
      - .github/workflows/build-element-web.yml
  push:
    branches: [main]
    tags: ["v*-plotina-web.*"]
    # Branch pushes only: GitHub does not evaluate path filters for tags, so a
    # release tag always builds even when its commit touches another client.
    paths:
      - element-web/**
      - noise/**
      - .github/workflows/build-element-web.yml
  workflow_dispatch:
    inputs:
      publish:
        description: "Push the image to GHCR (the ghcr-publish review still decides)"
        type: boolean
        default: false
      latest:
        description: "Also move the latest tag (honoured only with publish)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-element-web-${{ github.ref }}
  # A new commit must cancel a stale pull request build, but never the release
  # run whose publish job a reviewer is about to approve.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/plotina-cc/element-web
  # Baked into the image config by both jobs, so the publishing rebuild carries
  # exactly the identifiers of the image the build job smoke-tested.
  OCI_LABELS: |
    org.opencontainers.image.title=Plotina Web
    org.opencontainers.image.description=Element Web with the Plotina brand and the noise overlay
    org.opencontainers.image.source=https://github.com/plotina-cc/clients
    org.opencontainers.image.revision=${{ github.sha }}
    org.opencontainers.image.licenses=AGPL-3.0

jobs:
  lint:
    name: workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          # Schema and expressions for every workflow. The shellcheck pass is
          # limited to this file: older workflows still carry findings that were
          # accepted when they landed (SC2088 in publish-element-web.yml), and
          # this job is not the place to rewrite them.
          "$RUNNER_TEMP/actionlint" -color -shellcheck= .github/workflows/*.yml
          "$RUNNER_TEMP/actionlint" -color .github/workflows/build-element-web.yml

      - name: yamllint
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/yamllint"
          "$RUNNER_TEMP/yamllint/bin/pip" install --quiet --disable-pip-version-check yamllint
          "$RUNNER_TEMP/yamllint/bin/yamllint" .github/workflows/*.yml

  build:
    name: image build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (element-web)
        # The overlay suites, before anything expensive runs: branding_test.py,
        # test_theme_tokens.py and test_theme_custom_css_vars.py (fixture half).
        # The artifact half of the last one needs a built webapp and skips here;
        # the step after the smoke test runs it against the extracted /app.
        run: python3 -m unittest discover -s element-web/tests -p '*test*.py'

      - name: Read the pinned upstream image
        id: pin
        run: |
          set -euo pipefail
          line="$(grep -m1 '^FROM vectorim/element-web:' element-web/Dockerfile)"
          image="${line#FROM }"
          image="${image%% *}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Assemble the build context
        run: |
          set -euo pipefail
          # The Dockerfile lives in element-web/ but expects the shared noise/
          # overlay as ./noise — the same throwaway context build-image.sh
          # assembles for a manual build. Nothing here is committed.
          context="$RUNNER_TEMP/context"
          rm -rf "$context"
          mkdir -p "$context"
          cp -a element-web/. "$context"/
          cp -a noise "$context/noise"
          du -sh "$context"

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/context
          platforms: linux/amd64
          load: true
          tags: plotina-web:ci-${{ github.run_id }}
          labels: ${{ env.OCI_LABELS }}
          # The layer cache turns the publishing rebuild below into a manifest
          # push: buildx keeps it per repository, so both jobs see the same
          # compiled layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          IMAGE: plotina-web:ci-${{ github.run_id }}
        run: bash element-web/scripts/smoke-image.sh "$IMAGE"

      - name: Theme CSS artifact check
        # The half of test_theme_custom_css_vars.py that the unit step above
        # skips: the generated theme-*-custom.css sheets only exist inside a
        # built webapp. Extract /app from the image just built and run the same
        # suite against it with the strict switch on, so "no artifact" is a
        # failure instead of a skip. This is the check that catches a new
        # upstream sheet using a custom property nothing defines.
        env:
          IMAGE: plotina-web:ci-${{ github.run_id }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/webapp"
          rm -rf "$app"
          mkdir -p "$app"
          cid="$(docker create "$IMAGE")"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/app/." "$app"/
          find "$app" -name 'theme-*-custom.css' | sed 's#^#  extracted: #'
          PLOTINA_WEBAPP_ROOT="$app" PLOTINA_THEME_CSS_STRICT=1 \
            python3 -m unittest discover -s element-web/tests -p '*test*.py'

      - name: Summary
        run: |
          set -euo pipefail
          {
            echo "### Plotina Web image built"
            echo ""
            echo "- upstream pin: \`${{ steps.pin.outputs.image }}\`"
            echo "- image: \`plotina-web:ci-${{ github.run_id }}\` — local to the runner, nothing was published"
            echo "- smoke test: pass"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish to GHCR
    needs: build
    # Never from a pull request, and from a dispatch only when the box is
    # ticked. A tag is the request; the environment below is the permission.
    if: >-
      github.event_name != 'pull_request' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish == true) ||
      startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ghcr-publish
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned upstream image
        id: pin
        run: |
          set -euo pipefail
          line="$(grep -m1 '^FROM vectorim/element-web:' element-web/Dockerfile)"
          image="${line#FROM }"
          image="${image%% *}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Work out the tags
        id: tags
        run: |
          set -euo pipefail
          # Immutable first: the commit always addresses this build, whatever
          # tag (if any) points at it later.
          tags=("${IMAGE}:sha-${GITHUB_SHA}")
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            # A release tag is the human-readable name of the same commit. It is
            # normalised instead of rejected: the registry refuses upper case.
            tags+=("${IMAGE}:$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]')")
          fi
          {
            echo "list<<TAGS"
            printf '%s\n' "${tags[@]}"
            echo "TAGS"
            echo "immutable=${tags[0]}"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Assemble the build context
        run: |
          set -euo pipefail
          context="$RUNNER_TEMP/context"
          rm -rf "$context"
          mkdir -p "$context"
          cp -a element-web/. "$context"/
          cp -a noise "$context/noise"
          du -sh "$context"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/context
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: ${{ env.OCI_LABELS }}
          cache-from: type=gha
          # provenance: false keeps the digest a plain amd64 manifest instead of
          # an index with an attestation, so `docker pull <name>@<digest>` works
          # on hosts that predate OCI 1.1 clients.
          provenance: false

      - name: Verify the pushed digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$DIGEST"
          ref="${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "$ref"
          # What the registry serves under the digest is what a host will pull:
          # pull it back and run the same smoke test the build job ran.
          docker pull "$ref"
          bash element-web/scripts/smoke-image.sh "$ref"
          {
            echo "### Plotina Web image published"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| digest | \`$DIGEST\` |"
            echo "| immutable | \`${{ steps.tags.outputs.immutable }}\` |"
            echo "| tags | \`${{ steps.tags.outputs.list }}\` |"
            echo "| upstream pin | \`${{ steps.pin.outputs.image }}\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo ""
            echo "\`\`\`"
            echo "docker pull $ref"
            echo "\`\`\`"
            echo ""
            echo "Nothing deployed: golova pulls the digest by hand (element-web/README.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=image digest::$DIGEST"

      - name: Move latest
        if: inputs.latest == true
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # Only after the smoke test above passed, and only when the dispatch
          # asked for it: `latest` is a moving pointer nobody gets by default.
          docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:latest" | head -20
          echo "- latest now points at \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
